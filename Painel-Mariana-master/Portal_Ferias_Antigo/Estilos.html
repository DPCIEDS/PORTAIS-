<style>
/* =====================================================================================
   IDENTIDADE VISUAL — troque os hex abaixo pelos oficiais do CIEDS se quiser
   ===================================================================================== */
:root{
  --brand:      #0E5A6B;   /* teal institucional */
  --brand-dark: #093F4B;
  --brand-soft: #E7F1F3;
  --accent:     #E4007C;   /* magenta CIEDS */
  --accent-dark:#B80065;
  --ink:        #1c2b30;
  --muted:      #6b7c81;
  --line:       #e3e9eb;
  --bg:         #f4f7f8;
  --card:       #ffffff;
  --ok:         #1a8a4b;
  --ok-soft:    #e7f6ee;
  --warn:       #c47f00;
  --warn-soft:  #fdf3e0;
  --danger:     #c0392b;
  --danger-soft:#fdecea;
  --radius:     16px;
  --shadow:     0 6px 24px rgba(9,63,75,.08);
  --shadow-lg:  0 20px 60px rgba(9,63,75,.25);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ---------- HEADER ---------- */
.topbar{
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);
  color:#fff; padding:18px 26px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  position:sticky; top:0; z-index:20;
}
.topbar .brand{display:flex; align-items:center; gap:14px}
.topbar img{height:34px; display:block}
.topbar .brand b{font-size:17px; font-weight:700; letter-spacing:.2px}
.topbar .brand span{opacity:.7; font-size:12px; display:block; margin-top:1px}
.who{text-align:right; font-size:13px; line-height:1.35}
.who .name{font-weight:600}
.who .mail{opacity:.75; font-size:12px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:26px 22px 60px}
.hello{display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:20px}
.hello h1{margin:0; font-size:24px; font-weight:700}
.hello p{margin:6px 0 0; color:var(--muted); font-size:14px}

.stats{display:flex; gap:12px; flex-wrap:wrap}
.stat{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:12px 18px; min-width:120px; box-shadow:var(--shadow)
}
.stat b{display:block; font-size:22px; color:var(--brand)}
.stat span{font-size:12px; color:var(--muted)}

.toolbar{display:flex; gap:12px; margin:6px 0 20px; flex-wrap:wrap}
.search{
  flex:1; min-width:220px; display:flex; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:0 14px; box-shadow:var(--shadow)
}
.search input{border:0; outline:0; padding:13px 0; font-size:14px; width:100%; background:transparent; color:var(--ink)}
.search svg{flex:none; opacity:.5}

/* ---------- CARDS ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow); cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s;
  display:flex; flex-direction:column; gap:14px; position:relative;
}
.card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--brand)}
.card.locked{cursor:default; opacity:.85}
.card.locked:hover{transform:none; box-shadow:var(--shadow); border-color:var(--line)}
.card .head{display:flex; align-items:center; gap:12px}
.avatar{
  width:44px; height:44px; border-radius:12px; flex:none;
  background:linear-gradient(135deg,var(--brand),var(--accent));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px
}
.card .name{font-weight:700; font-size:15px; line-height:1.25}
.card .period{color:var(--muted); font-size:12px; margin-top:2px}

.rowinfo{display:flex; gap:10px}
.pill{
  flex:1; border-radius:11px; padding:9px 12px; background:var(--brand-soft);
}
.pill .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted)}
.pill .v{font-weight:700; font-size:14px; color:var(--brand-dark); margin-top:2px}
.pill.urg-amber{background:var(--warn-soft)} .pill.urg-amber .v{color:var(--warn)}
.pill.urg-red{background:var(--danger-soft)}  .pill.urg-red  .v{color:var(--danger)}

.badge{
  position:absolute; top:14px; right:14px;
  font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
}
.badge.livre{background:var(--brand-soft); color:var(--brand)}
.badge.pendente{background:var(--warn-soft); color:var(--warn)}
.badge.aprovado{background:var(--ok-soft); color:var(--ok)}
.badge.recusado{background:var(--danger-soft); color:var(--danger)}

.card .cta{font-size:12.5px; color:var(--accent); font-weight:700; display:flex; align-items:center; gap:6px}

/* ---------- ESTADOS ---------- */
.center{max-width:520px; margin:60px auto; text-align:center; background:var(--card);
  border:1px solid var(--line); border-radius:var(--radius); padding:44px 32px; box-shadow:var(--shadow)}
.center .big{font-size:44px; margin-bottom:6px}
.center h2{margin:0 0 8px; font-size:20px}
.center p{color:var(--muted); font-size:14px; margin:0}
.empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:40px; font-size:14px}

.skeleton{height:150px; border-radius:var(--radius); background:linear-gradient(90deg,#eef3f4 25%,#e2eaec 37%,#eef3f4 63%);
  background-size:400% 100%; animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ---------- MODAL ---------- */
.overlay{position:fixed; inset:0; background:rgba(9,63,75,.45); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; padding:18px; z-index:40}
.overlay.open{display:flex}
.modal{background:var(--card); border-radius:20px; width:100%; max-width:460px; overflow:hidden;
  box-shadow:var(--shadow-lg); animation:pop .18s ease}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal .mhead{background:linear-gradient(135deg,var(--brand),var(--brand-dark)); color:#fff; padding:20px 24px; position:relative}
.modal .mhead .name{font-weight:700; font-size:17px}
.modal .mhead .sub{opacity:.8; font-size:12.5px; margin-top:2px}
.modal .x{position:absolute; top:16px; right:16px; cursor:pointer; opacity:.8; font-size:22px; line-height:1;
  background:none; border:0; color:#fff}
.modal .body{padding:22px 24px}
.field{margin-bottom:16px}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px}
.field input{width:100%; border:1.5px solid var(--line); border-radius:11px; padding:12px 14px; font-size:15px;
  font-family:inherit; color:var(--ink); outline:none; transition:border-color .15s}
.field input:focus{border-color:var(--brand)}
.hint{font-size:12px; color:var(--muted); margin-top:6px}
.resumo{background:var(--brand-soft); border-radius:12px; padding:12px 14px; font-size:13.5px; color:var(--brand-dark);
  margin:4px 0 18px; display:none}
.resumo.show{display:block}
.resumo b{color:var(--brand)}
.err{background:var(--danger-soft); color:var(--danger); border-radius:10px; padding:10px 13px; font-size:13px;
  margin-bottom:14px; display:none}
.err.show{display:block}

.btn{width:100%; border:0; border-radius:12px; padding:14px; font-size:15px; font-weight:700; cursor:pointer;
  font-family:inherit; transition:filter .15s, transform .08s}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent); color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55; cursor:not-allowed}

/* ---------- TOAST ---------- */
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:14px 20px; border-radius:12px; font-size:14px; font-weight:500;
  box-shadow:var(--shadow-lg); opacity:0; transition:.25s; z-index:60; max-width:90%}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--danger)}

.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  display:inline-block;vertical-align:-3px;margin-right:8px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:560px){
  .who .mail{display:none}
  .hello h1{font-size:20px}
}
/* ---------- PAINEL DE STATUS SUPERIOR ---------- */
.status-panel {
  display: grid;
  grid-template-columns: repeat(4, minmax(140px, 1fr));
  gap: 14px;
  margin: 18px 0 20px;
}

.status-card {
  border: 2px solid transparent;
  border-radius: 18px;
  background: #fff;
  box-shadow: var(--shadow);
  padding: 16px 18px;
  cursor: pointer;
  text-align: left;
  transition: .18s ease;
  font-family: Inter, Arial, sans-serif;
}

.status-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.status-card.ativo {
  border-color: var(--accent);
  background: #fff7fb;
}

.status-card span {
  display: block;
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .03em;
  margin-bottom: 8px;
}

.status-card strong {
  display: block;
  font-size: 30px;
  font-weight: 800;
  line-height: 1;
  color: var(--brand);
}

.status-card small {
  display: block;
  margin-top: 7px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}

/* ---------- BADGES CORRIGIDOS PARA AS CHAVES DO GS ---------- */
.badge.deferido {
  background: var(--ok-soft);
  color: var(--ok);
}

.badge.indeferido {
  background: var(--danger-soft);
  color: var(--danger);
}

/* mantém compatibilidade caso ainda venha aprovado/recusado em algum ponto */
.badge.aprovado {
  background: var(--ok-soft);
  color: var(--ok);
}

.badge.recusado {
  background: var(--danger-soft);
  color: var(--danger);
}

.info-extra {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.45;
}

.info-extra b {
  color: var(--ink);
}

.info-extra.motivo {
  background: var(--danger-soft);
  color: var(--danger);
  padding: 10px 12px;
  border-radius: 10px;
}

.info-extra.motivo b {
  color: var(--danger);
}

@media(max-width:900px){
  .status-panel {
    grid-template-columns: repeat(2, minmax(140px, 1fr));
  }
}

@media(max-width:560px){
  .status-panel {
    grid-template-columns: 1fr;
  }
}

/* ---------- BANNER DA POLÍTICA DE FÉRIAS ---------- */
.politica-banner{
  display:flex; align-items:center; gap:14px;
  text-decoration:none; color:var(--ink);
  background:linear-gradient(135deg,var(--brand-soft),#fff);
  border:1px solid var(--line); border-left:5px solid var(--accent);
  border-radius:14px; padding:14px 18px; margin:0 0 20px;
  box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease;
}
.politica-banner:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.politica-banner .pb-ico{ font-size:24px; flex:none; }
.politica-banner .pb-txt{ font-size:13px; color:var(--muted); line-height:1.45; }
.politica-banner .pb-txt b{ display:block; color:var(--ink); font-size:14px; margin-bottom:2px; }
.politica-banner .pb-cta{ margin-left:auto; flex:none; font-weight:700; font-size:13px; color:var(--accent); white-space:nowrap; }
@media(max-width:560px){
  .politica-banner{ flex-wrap:wrap; }
  .politica-banner .pb-cta{ margin-left:0; }
}

/* nota da política dentro do modal */
.modal-politica{
  font-size:12px; color:var(--muted); background:var(--brand-soft);
  border-radius:10px; padding:10px 12px; margin:0 0 14px;
}
.modal-politica a{ color:var(--brand); font-weight:700; }

/* passo de revisão (anti-erro) */
.revisao-box{
  background:#fff; border:1.5px solid var(--brand-soft); border-radius:14px;
  padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
}
.revisao-box .rb-tit{ font-size:13px; font-weight:800; color:var(--brand); text-transform:uppercase;
  letter-spacing:.03em; margin-bottom:10px; }
.rb-linha{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px dashed var(--line); }
.rb-linha:last-child{ border-bottom:0; }
.rb-linha span{ color:var(--muted); font-size:13px; }
.rb-linha b{ color:var(--ink); font-size:13.5px; text-align:right; }
.rb-obs{ margin-top:10px; background:var(--brand-soft); color:var(--brand-dark); border-radius:10px;
  padding:9px 12px; font-size:12.5px; }
.rb-acoes{ display:flex; gap:10px; margin-top:14px; }
.rb-acoes .btn{ margin:0; }
.btn.ghost{ background:#fff; color:var(--muted); border:1.5px solid var(--line); flex:0 0 40%; }
.btn.ghost:hover{ background:var(--bg); }

/* link "trocar conta" no cabeçalho */
.who .trocar{ display:inline-block; margin-top:4px; font-size:11.5px; color:#fff; opacity:.85;
  text-decoration:underline; cursor:pointer; }
.who .trocar:hover{ opacity:1; }
</style>
