/* ================= RESCISÃO: VISUAL NOVO (2026-10-14) ================= */
/* Etapas em cartões numerados, abas sublinhadas na Homologação, filtros de mês e tipo, e as listas
 * em tabela (colaborador, data, situação e ações: a principal num botão, as outras no menu ⋮).
 * Os handlers de cada ação são os mesmos de antes; só mudou a apresentação. */

const RESC_POR_PAGINA = 100;
let RESC_PAG = { chave: '', pagina: 0 };
let RESC_MOSTRAR_TODOS = false; // "Mostrar todos" vale para todas as listas da Rescisão até voltar para 100 por vez
let HOMOLOG_FILTRO_MES = '', HOMOLOG_FILTRO_TIPO = '';

const RESC_COL_DATA = {
  solicitadas: 'Solicitada em', agendadas: 'Comparecimento', compareceram: 'Exame',
  conciliacao: 'Demissão', arquivados: 'Demissão', canceladas: 'Solicitada em'
};
const RESC_VAZIO = {
  solicitadas: 'Nenhuma rescisão solicitada aguardando agendamento.',
  agendadas: 'Nenhum comparecimento agendado.',
  compareceram: 'Ninguém aguardando exame ou desligamento.',
  conciliacao: 'Nenhuma rescisão em conciliação.',
  arquivados: 'Nenhuma rescisão arquivada ainda.',
  canceladas: 'Nenhuma rescisão cancelada.'
};
const RESC_COR_STATUS = {
  SOLICITADA: 'cinza', AGENDADA: 'azul', NAO_COMPARECEU: 'vermelho', COMPARECEU: 'azul', EXAME_MARCADO: 'azul',
  DESLIGADO: 'amarelo', AGUARDANDO_CONCILIACAO: 'amarelo', VALORES_CONFIRMADOS: 'azul', ENVIADO_FINANCEIRO: 'azul',
  AGUARDANDO_ASSINATURA: 'amarelo', ARQUIVADO: 'verde', CANCELADA: 'cinza'
};

/* ---- peças da tabela ---- */

function _rescNomeTitulo_(s){
  const min = { da: 1, de: 1, di: 1, do: 1, du: 1, das: 1, dos: 1, e: 1 };
  return String(s || '').trim().toLowerCase().split(/\s+/).map((w, i) =>
    (i > 0 && min[w]) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function _rescFrase_(s){ // 'PEDIDO DE DEMISSÃO' -> 'Pedido de demissão'
  const t = String(s || '').trim().toLowerCase();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function _rescMesExtenso_(chave){ // 'AAAA-MM' -> 'SETEMBRO 2026'
  const nomes = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
  const p = String(chave || '').split('-');
  return p.length === 2 && nomes[Number(p[1]) - 1] ? nomes[Number(p[1]) - 1] + ' ' + p[0] : 'SEM DATA DE DEMISSÃO';
}

/** Texto para dentro de um onclick="f('...')": escapa para o JS e depois para o HTML. */
function _rescArgJs_(s){ return esc(String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")); }

/** Prazo de pagamento da rescisão: demissão + 9 dias, recuando para sexta se cair no fim de
 *  semana (a mesma conta da coluna U da CONTROLE.2026). */
function _rescPrazoPagamento_(iso){
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3] + 9, 12);
  if(d.getDay() === 6) d.setDate(d.getDate() - 1);
  if(d.getDay() === 0) d.setDate(d.getDate() - 2);
  return d;
}

function _rescDiasAte_(d){
  const h = new Date(); const hoje = new Date(h.getFullYear(), h.getMonth(), h.getDate(), 12);
  return Math.round((d - hoje) / 86400000);
}

function _rescDataBR_(d){ return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }

/** Ações: a que tem p=1 vira o botão; as outras vão para o menu ⋮. */
function _rescAcoesHtml_(acoes){
  acoes = (acoes || []).filter(Boolean);
  if(!acoes.length) return '<span class="resc-sem-acao">—</span>';
  const prim = acoes.find(a => a.p) || acoes[0];
  const resto = acoes.filter(a => a !== prim);
  const botao = prim.href
    ? '<a class="resc-btn-acao' + (prim.forte ? ' forte' : '') + (prim.verde ? ' verde' : '') + '" href="' + esc(prim.href) + '" target="_blank" rel="noopener">' + esc(prim.t) + '</a>'
    : '<button type="button" class="resc-btn-acao' + (prim.forte ? ' forte' : '') + (prim.verde ? ' verde' : '') + '"' + (prim.disabled ? ' disabled' : '') +
      (prim.title ? ' title="' + esc(prim.title) + '"' : '') + ' onclick="' + prim.fn + '">' + esc(prim.t) + '</button>';
  const menu = resto.length
    ? '<div class="resc-menu"><button type="button" class="resc-kebab" aria-label="Mais ações" aria-haspopup="menu" aria-expanded="false" onclick="rescMenu(this, event)">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></button>' +
        '<template>' + resto.map(a => a.href
          ? '<a role="menuitem" href="' + esc(a.href) + '" target="_blank" rel="noopener">' + esc(a.t) + '</a>'
          : '<button type="button" role="menuitem"' + (a.perigo ? ' class="perigo"' : '') + (a.disabled ? ' disabled' : '') +
            ' onclick="rescMenuFechar(); ' + a.fn + '">' + esc(a.t) + '</button>').join('') +
        '</template></div>'
    : '<span class="resc-kebab-vazio" aria-hidden="true"></span>';
  return '<div class="resc-acoes">' + botao + menu + '</div>';
}

function _rescLinhaHtml_(l){
  return '<tr>' +
    '<td><div class="resc-colab"><span class="resc-av" aria-hidden="true">' + esc(ini(l.nome)) + '</span>' +
      '<div class="resc-colab-txt"><b>' + esc(_rescNomeTitulo_(l.nome)) + '</b><span>' + esc(l.sub || '') + '</span></div></div></td>' +
    '<td class="resc-data" data-rotulo="' + esc(l.rotuloData || '') + '">' + esc(l.data || '—') +
      (l.dataSub ? '<small class="' + (l.dataSubCls || '') + '">' + esc(l.dataSub) + '</small>' : '') + '</td>' +
    '<td class="resc-situacao"><span class="resc-tag ' + (l.cor || 'cinza') + '"' + (l.situacaoTitle ? ' title="' + esc(l.situacaoTitle) + '"' : '') + '>' + esc(l.situacao) + '</span>' +
      (l.situacaoSub ? '<small>' + esc(l.situacaoSub) + '</small>' : '') + '</td>' +
    '<td class="resc-col-acoes">' + _rescAcoesHtml_(l.acoes) + '</td>' +
  '</tr>';
}

/** Tabela com grupos por mês (opcional) e paginação. linhas: [{ grupo, html }].
 *  opc (a Admissão usa a mesma tabela, com paginação própria): pag = { chave, pagina },
 *  todos = "Mostrar todos" ligado, pref = prefixo das funções de página ('adm' -> admPagina),
 *  rotuloGrupo = texto da linha do mês. Sem opc, é a Rescisão de sempre. */
function _rescTabelaHtml_(colData, linhas, chave, opc){
  opc = opc || {};
  const pag = opc.pag || RESC_PAG;
  const mostrarTodos = opc.todos !== undefined ? !!opc.todos : RESC_MOSTRAR_TODOS;
  const pref = opc.pref || 'resc';
  const rotuloGrupo = opc.rotuloGrupo || _rescMesExtenso_;
  if(pag.chave !== chave){ pag.chave = chave; pag.pagina = 0; }
  const total = linhas.length;
  const porPagina = mostrarTodos ? Math.max(1, total) : RESC_POR_PAGINA;
  const paginas = Math.max(1, Math.ceil(total / porPagina));
  if(pag.pagina > paginas - 1) pag.pagina = paginas - 1;
  const ini0 = pag.pagina * porPagina;
  let grupo = null;
  const corpo = linhas.slice(ini0, ini0 + porPagina).map(l => {
    let h = '';
    if(l.grupo !== undefined && l.grupo !== grupo){
      grupo = l.grupo;
      h += '<tr class="resc-grupo"><th colspan="4" scope="rowgroup">' + esc(rotuloGrupo(grupo)) + '</th></tr>';
    }
    return h + l.html;
  }).join('');
  return '<div class="resc-tabela-rolagem"><table class="resc-tabela">' +
      '<thead><tr><th scope="col">Colaborador</th><th scope="col">' + esc(colData) + '</th><th scope="col">Situação</th>' +
      '<th scope="col" class="resc-col-acoes">Ações</th></tr></thead>' +
      '<tbody>' + corpo + '</tbody></table></div>' +
    '<div class="resc-rodape"><span>Mostrando ' +
      (paginas > 1 ? (ini0 + 1) + '–' + Math.min(ini0 + porPagina, total) + ' de ' + total : total + ' de ' + total) + '</span>' +
      '<div class="resc-paginas">' +
        (mostrarTodos && total > RESC_POR_PAGINA ? '' :
          '<button type="button" class="resc-pag"' + (pag.pagina === 0 ? ' disabled' : '') + ' onclick="' + pref + 'Pagina(-1)">Anterior</button>' +
          '<button type="button" class="resc-pag"' + (pag.pagina >= paginas - 1 ? ' disabled' : '') + ' onclick="' + pref + 'Pagina(1)">Próxima</button>') +
        (total > RESC_POR_PAGINA
          ? '<button type="button" class="resc-pag resc-pag-todos" onclick="' + pref + 'MostrarTodos(' + !mostrarTodos + ')">' +
            (mostrarTodos ? 'Mostrar ' + RESC_POR_PAGINA + ' por vez' : 'Mostrar todos (' + total + ')') + '</button>'
          : '') +
      '</div></div>';
}

function rescMostrarTodos(todos){
  RESC_MOSTRAR_TODOS = !!todos;
  rescPagina(-RESC_PAG.pagina); // volta para a 1ª página e redesenha
}

function rescPagina(delta){
  RESC_PAG.pagina = Math.max(0, RESC_PAG.pagina + delta);
  if(RESC_SUBABA === 'homologacao') _desenharHomologSemQuebrar_(); else renderResc();
  const box = $('listaResc');
  if(box && box.getBoundingClientRect().top < 0) box.scrollIntoView({ block: 'start' });
}

/* ---- menu ⋮ ----
 * Abre num quadro solto no <body>: dentro da tabela ele seria cortado pela rolagem, e a animação
 * de entrada da seção (transform) faria um position:fixed ficar preso a ela. */

let RESC_MENU_BTN = null;

function rescMenu(btn, ev){
  if(ev) ev.stopPropagation();
  const mesmo = RESC_MENU_BTN === btn;
  rescMenuFechar();
  if(mesmo) return;
  const tpl = btn.parentNode.querySelector('template');
  if(!tpl) return;
  const lista = document.createElement('div');
  lista.id = 'rescMenuFlutuante';
  lista.className = 'resc-menu-lista';
  lista.setAttribute('role', 'menu');
  lista.innerHTML = tpl.innerHTML;
  document.body.appendChild(lista);
  RESC_MENU_BTN = btn;
  btn.setAttribute('aria-expanded', 'true');
  const r = btn.getBoundingClientRect();
  const larg = lista.offsetWidth, alt = lista.offsetHeight;
  lista.style.left = Math.max(8, Math.min(window.innerWidth - larg - 8, r.right - larg)) + 'px';
  lista.style.top = (r.bottom + alt + 8 > window.innerHeight ? Math.max(8, r.top - alt - 4) : r.bottom + 4) + 'px';
  const primeiro = lista.querySelector('button:not([disabled]),a');
  if(primeiro) primeiro.focus();
}

function rescMenuFechar(devolverFoco){
  const lista = $('rescMenuFlutuante');
  if(lista) lista.remove();
  if(RESC_MENU_BTN){
    RESC_MENU_BTN.setAttribute('aria-expanded', 'false');
    if(devolverFoco && document.body.contains(RESC_MENU_BTN)) RESC_MENU_BTN.focus();
  }
  RESC_MENU_BTN = null;
}

document.addEventListener('click', e => {
  if(!RESC_MENU_BTN) return;
  if(e.target.closest && (e.target.closest('#rescMenuFlutuante') || e.target.closest('.resc-kebab'))) return;
  rescMenuFechar();
});
document.addEventListener('keydown', e => {
  if(!RESC_MENU_BTN) return;
  if(e.key === 'Escape'){ rescMenuFechar(true); return; }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const itens = Array.from(document.querySelectorAll('#rescMenuFlutuante button:not([disabled]), #rescMenuFlutuante a'));
    if(!itens.length) return;
    e.preventDefault();
    const i = itens.indexOf(document.activeElement);
    itens[(i + (e.key === 'ArrowDown' ? 1 : itens.length - 1)) % itens.length].focus();
  }
  if(e.key === 'Tab') rescMenuFechar(true);
});
window.addEventListener('resize', () => rescMenuFechar());
window.addEventListener('scroll', e => {
  if(RESC_MENU_BTN && !(e.target && e.target.id === 'rescMenuFlutuante')) rescMenuFechar();
}, true);

/* ---- etapas 1 a 4 e arquivados/canceladas ---- */

function _rescLinhaCaso_(c){
  const id = _rescArgJs_(c.id), nome = _rescArgJs_(c.nome);
  const pedido = c.tipoCod === 'PEDIDO_DEMISSAO';
  let acoes = [];
  if(c.assinaturaLink){
    acoes = [{ t: 'Ver assinado', href: c.assinaturaLink, p: 1 }];
  } else if(RESC_SUBABA === 'solicitadas'){
    acoes = [{ t: 'Agendar comparecimento', fn: "abrirRescAgendar('" + id + "')", p: 1, forte: 1 },
      pedido && { t: 'Registrar direto (sem agendamento)', fn: "abrirRescRegistrarDireto('" + id + "')" },
      { t: 'Cancelar solicitação', fn: "rescCancelarSolicitacao('" + id + "', '" + nome + "')", perigo: 1 }];
  } else if(RESC_SUBABA === 'agendadas'){
    acoes = [{ t: 'Registrar comparecimento', fn: "abrirRescComparecimento('" + id + "')", p: 1, forte: 1 }];
  } else if(RESC_SUBABA === 'compareceram'){
    if(c.status === 'COMPARECEU'){
      acoes = [{ t: 'Marcar exame', fn: "abrirRescExame('" + id + "')", p: 1, forte: 1 },
        pedido && { t: 'Dispensar exame (menos de 90 dias)', fn: "abrirRescExameDispensar('" + id + "')" }];
    } else if(c.status === 'EXAME_MARCADO'){
      acoes = [{ t: 'Confirmar desligamento', fn: "abrirRescDesligar('" + id + "')", p: 1, forte: 1 }];
    }
  } else if(RESC_SUBABA === 'conciliacao'){
    if(!c.rescisaoDocLink) acoes = [{ t: 'Anexar rescisão', fn: "abrirRescAnexar('" + id + "')", p: 1, forte: 1 }];
    else if(!c.valorTrctConfirmado) acoes = [{ t: 'Confirmar valores', fn: "abrirRescValores('" + id + "')", p: 1, forte: 1 }];
    else if(c.status === 'VALORES_CONFIRMADOS') acoes = [{ t: 'Enviar ao financeiro', fn: "rescEnviarFinanceiro('" + id + "')", p: 1, forte: 1 }];
    else if(c.status === 'ENVIADO_FINANCEIRO') acoes = [{ t: 'Enviar ao Autentique', fn: "rescEnviarAutentique('" + id + "')", p: 1, forte: 1, verde: 1 }];
    else if(c.status === 'AGUARDANDO_ASSINATURA'){
      acoes = [{ t: 'Baixar e arquivar', fn: "rescBaixarArquivar('" + id + "')", p: 1, forte: 1 },
        { t: 'Verificar assinatura', fn: "rescVerificarAssinatura('" + id + "')" },
        { t: 'Cancelar envio', fn: "abrirRescCancelarAutentique('" + id + "', '" + nome + "')", perigo: 1 }];
    }
  }

  // coluna de data de cada etapa
  let data = '', dataSub = '', dataSubCls = '';
  if(RESC_SUBABA === 'solicitadas' || RESC_SUBABA === 'canceladas'){
    data = c.solicitadoEm ? dBR(c.solicitadoEm) : '';
  } else if(RESC_SUBABA === 'agendadas'){
    data = c.agendamento ? dBR(c.agendamento) : '';
  } else if(RESC_SUBABA === 'compareceram'){
    if(c.exame) data = dBR(c.exame);
    else if(c.exameDispensado) dataSub = 'Exame dispensado';
    else if(c.comparecimento){ data = dBR(c.comparecimento); dataSub = 'compareceu nesse dia'; }
  } else {
    data = c.demissao ? dBR(c.demissao) : '';
    if(RESC_SUBABA === 'conciliacao' && c.demissao && !c.financeiroEnviadoEm){
      const pz = _rescPrazoPagamento_(c.demissao), d = _rescDiasAte_(pz);
      dataSub = d < 0 ? 'Pagamento atrasado há ' + (-d) + (d === -1 ? ' dia' : ' dias') : 'Pagar até ' + _rescDataBR_(pz);
      dataSubCls = d < 0 ? 'vermelho' : (d <= 3 ? 'amarelo' : '');
    }
  }

  return _rescLinhaHtml_({
    nome: c.nome,
    sub: [c.matricula ? 'Matrícula ' + c.matricula : '', c.tipo || ''].filter(Boolean).join(' · '),
    rotuloData: RESC_COL_DATA[RESC_SUBABA] || 'Data',
    data: data, dataSub: dataSub, dataSubCls: dataSubCls,
    situacao: rotuloStatusResc(c.status), cor: RESC_COR_STATUS[c.status] || 'cinza',
    situacaoSub: c.valorTrctConfirmado ? 'TRCT ' + c.valorTrctConfirmado : '',
    acoes: acoes
  });
}

function _rescMarcarEtapa_(){
  document.querySelectorAll('#rescSubnav .sub').forEach(b => {
    const on = b.dataset.sub === RESC_SUBABA;
    b.classList.toggle('on', on);
    if(on) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}

/** A contagem do cartão 5 vem da lista da Homologação. Ela é carregada uma vez, em segundo plano,
 *  quando a pessoa abre a Rescisão (só com a seção na tela, não no login). */
function _homologPreCarga_(){
  const sec = $('secRescisao');
  if(!sec || sec.offsetParent === null) return;
  if(RESC_HOMOLOGACAO || HOMOLOG_CARREGANDO || HOMOLOG_ERRO) return;
  // carregarRescHomologacao só desenha se a pessoa estiver na Homologação; aqui só as contagens
  carregarRescHomologacao(false).then(() => {
    if(RESC_HOMOLOGACAO && RESC_SUBABA !== 'homologacao') _homologContagens_(listaSegura(RESC_HOMOLOGACAO.lista));
  });
}

function renderResc(){
  if(!RESC_FILA){ _rescMarcarEtapa_(); _moduloSemDados_('RESCISAO', 'listaResc'); return; }
  const grupos = {
    solicitadas: RESC_FILA.solicitadas,
    agendadas: RESC_FILA.agendadas,
    compareceram: RESC_FILA.compareceram,
    conciliacao: RESC_FILA.conciliacao,
    arquivados: RESC_FILA.arquivados,
    canceladas: RESC_FILA.canceladas
  };
  Object.keys(grupos).forEach(k => atualizarContagemSub('rescCont_' + k, listaSegura(grupos[k]).length));
  _rescMarcarEtapa_();
  _homologPreCarga_();

  const lista = listaSegura(grupos[RESC_SUBABA]);
  if(!lista.length){ $('listaResc').innerHTML = '<div class="vazio">' + (RESC_VAZIO[RESC_SUBABA] || 'Nada por aqui.') + '</div>'; return; }
  const linhas = lista.map(c => ({ html: _rescLinhaCaso_(c) }));
  $('listaResc').innerHTML = _rescTabelaHtml_(RESC_COL_DATA[RESC_SUBABA] || 'Data', linhas, 'etapa:' + RESC_SUBABA);
}

/* ---- Homologação ---- */

function homologFiltrar(campo, v){
  if(campo === 'mes') HOMOLOG_FILTRO_MES = v; else HOMOLOG_FILTRO_TIPO = v;
  _desenharHomologSemQuebrar_();
}

function _homologOpcoes_(id, rotulo, valores, atual){
  const sel = $(id);
  if(!sel) return;
  ver(id, valores.length > 1 || !!atual);
  sel.innerHTML = '<option value="">' + rotulo + ': Todos</option>' + valores.map(v =>
    '<option value="' + esc(v.valor) + '"' + (v.valor === atual ? ' selected' : '') + '>' + rotulo + ': ' + esc(v.texto) + '</option>').join('');
}

function _homologContagens_(todos){
  atualizarContagemSub('rescCont_homologacao', todos.length);
  atualizarContagemSub('homologCont_pendentes', todos.filter(c => !c.enviado && !c.temHomologacao).length);
  atualizarContagemSub('homologCont_prontosEnvio', todos.filter(c => !c.enviado && c.temHomologacao).length);
  atualizarContagemSub('homologCont_enviadas', todos.filter(c => c.enviado && !c.baixado).length);
  atualizarContagemSub('homologCont_prontas', todos.filter(c => c.enviado && c.baixado).length);
}

function _homologLinha_(c){
  const mat = _rescArgJs_(c.matricula);
  let situacao, cor, titulo = '', acoes = [];
  if(!c.enviado){
    if(c.temHomologacao){
      const falta = (c.faltando || []).join(', ');
      if(c.documentacaoCompleta){ situacao = 'Pronta para envio'; cor = 'verde'; titulo = 'Na pasta: ' + (c.documentosPresentes || []).join(' + '); }
      else { situacao = 'Falta ' + falta; cor = 'amarelo'; titulo = 'Adicione na pasta antes de enviar'; }
      acoes = [{ t: 'Enviar ao Autentique', fn: "rescEnviarHomologacao('" + mat + "')", p: 1, forte: 1, verde: 1,
          disabled: !c.documentacaoCompleta, title: c.documentacaoCompleta ? '' : 'Falta ' + falta + ' na pasta' },
        { t: 'Ver documentos', fn: "verHomologacaoDocumentos('" + mat + "')" }];
    } else {
      situacao = 'TRCT não encontrado'; cor = 'laranja'; titulo = 'Não encontrei o TRCT na pasta de rescisões (mês/pessoa)';
    }
  } else if(c.baixado){
    situacao = 'Assinada'; cor = 'verde';
    acoes = [{ t: 'Ver documento', href: c.assinadoLink, p: 1 }];
  } else if(c.assinado){
    situacao = 'Assinada, falta arquivar'; cor = 'verde';
    acoes = [{ t: 'Baixar e arquivar', fn: "rescBaixarArquivarHomologacao('" + mat + "')", p: 1, forte: 1 }];
  } else {
    situacao = 'Aguardando assinatura'; cor = 'amarelo';
    acoes = [{ t: 'Verificar', fn: "rescVerificarAssinaturaHomologacao('" + mat + "')", p: 1 },
      { t: 'Cancelar envio', fn: "abrirCancelarHomologacao('" + mat + "')", perigo: 1 }];
  }
  return _rescLinhaHtml_({
    nome: c.nome,
    sub: 'Matrícula ' + c.matricula + (c.tipo ? ' · ' + _rescFrase_(c.tipo) : ''),
    rotuloData: 'Demissão',
    data: c.demissao ? dBR(c.demissao) : '',
    situacao: situacao, cor: cor, situacaoTitle: titulo,
    situacaoSub: (!c.enviado && c.documentacaoCompleta) ? (c.documentosPresentes || []).join(' + ') : '',
    acoes: acoes
  });
}

function renderRescHomologacaoLista(){
  const cont = $('listaResc');
  if(!cont) return;
  if(RESC_HOMOLOGACAO && !Array.isArray(RESC_HOMOLOGACAO.lista)) RESC_HOMOLOGACAO = null; // nunca desenha sem lista
  // Fora da etapa Homologação (pré-carga do cartão 5) só atualiza as contagens: a lista é de outra etapa.
  if(RESC_SUBABA !== 'homologacao'){
    if(RESC_HOMOLOGACAO) _homologContagens_(listaSegura(RESC_HOMOLOGACAO.lista));
    return;
  }
  document.querySelectorAll('#homologSubnav .sub').forEach(b => {
    const on = b.dataset.sub === HOMOLOG_SUBABA;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  if(!RESC_HOMOLOGACAO){
    ['btnEnviarTodasHomolog', 'btnBaixarTodasHomolog', 'homologFiltroMes', 'homologFiltroTipo'].forEach(id => ver(id, false));
    cont.innerHTML = (HOMOLOG_ERRO && !HOMOLOG_CARREGANDO)
      ? '<div class="vazio" style="color:var(--danger)">Não consegui carregar a lista: ' + esc(HOMOLOG_ERRO) +
        '<br><br><button class="b ver" onclick="carregarRescHomologacao(true)">Tentar de novo</button></div>'
      : '<div class="resc-carregando"><div class="esq"></div><div class="esq"></div><div class="esq"></div></div>' +
        '<div class="vazio">Carregando a lista… a primeira carga do dia pode levar alguns segundos.</div>';
    return;
  }

  const todos = listaSegura(RESC_HOMOLOGACAO.lista);
  _homologContagens_(todos);
  ver('btnEnviarTodasHomolog', HOMOLOG_SUBABA === 'prontosEnvio');
  ver('btnBaixarTodasHomolog', HOMOLOG_SUBABA === 'enviadas');
  const qtdProntosEnvio = todos.filter(c => !c.enviado && c.temHomologacao && c.documentacaoCompleta).length;
  const qtdProntosBaixar = todos.filter(c => c.enviado && !c.baixado && c.assinado).length;
  ver('badgeEnviarTodasHomolog', qtdProntosEnvio > 0);
  ver('badgeBaixarTodasHomolog', qtdProntosBaixar > 0);
  $('badgeEnviarTodasHomolog').textContent = qtdProntosEnvio;
  $('badgeBaixarTodasHomolog').textContent = qtdProntosBaixar;

  let lista = todos.filter(c => {
    if(HOMOLOG_SUBABA === 'prontas') return c.enviado && c.baixado;
    if(HOMOLOG_SUBABA === 'enviadas') return c.enviado && !c.baixado;
    if(HOMOLOG_SUBABA === 'prontosEnvio') return !c.enviado && c.temHomologacao;
    if(HOMOLOG_SUBABA === 'pendentes') return !c.enviado && !c.temHomologacao;
    return !c.enviado;
  });

  // Filtros de mês e tipo: as opções saem da aba atual (o "Tipo" só aparece se a API mandar o campo).
  const meses = [], tipos = [];
  lista.forEach(c => {
    const m = String(c.demissao || '').slice(0, 7);
    if(m && !meses.some(x => x.valor === m)) meses.push({ valor: m, texto: _rescNomeTitulo_(_rescMesExtenso_(m)) });
    const t = String(c.tipo || '').trim();
    if(t && !tipos.some(x => x.valor === t)) tipos.push({ valor: t, texto: _rescFrase_(t) });
  });
  meses.sort((a, b) => b.valor.localeCompare(a.valor));
  tipos.sort((a, b) => a.texto.localeCompare(b.texto));
  if(HOMOLOG_FILTRO_MES && !meses.some(x => x.valor === HOMOLOG_FILTRO_MES)) HOMOLOG_FILTRO_MES = '';
  if(HOMOLOG_FILTRO_TIPO && !tipos.some(x => x.valor === HOMOLOG_FILTRO_TIPO)) HOMOLOG_FILTRO_TIPO = '';
  _homologOpcoes_('homologFiltroMes', 'Mês', meses, HOMOLOG_FILTRO_MES);
  _homologOpcoes_('homologFiltroTipo', 'Tipo', tipos, HOMOLOG_FILTRO_TIPO);
  if(HOMOLOG_FILTRO_MES) lista = lista.filter(c => String(c.demissao || '').slice(0, 7) === HOMOLOG_FILTRO_MES);
  if(HOMOLOG_FILTRO_TIPO) lista = lista.filter(c => String(c.tipo || '').trim() === HOMOLOG_FILTRO_TIPO);

  const busca = _homologNorm_(HOMOLOG_BUSCA);
  if(busca){
    lista = lista.filter(c => _homologNorm_(c.nome).indexOf(busca) > -1 || _homologNorm_(c.matricula).indexOf(busca) > -1);
  }

  if(!lista.length){
    const vazioMsg = busca ? 'Ninguém encontrado para "' + esc(HOMOLOG_BUSCA) + '".' :
      (HOMOLOG_FILTRO_MES || HOMOLOG_FILTRO_TIPO) ? 'Ninguém com esses filtros.' :
      (HOMOLOG_SUBABA === 'enviadas' ? 'Nenhuma homologação enviada ainda.' :
       HOMOLOG_SUBABA === 'prontas' ? 'Nenhuma documentação assinada e arquivada ainda.' :
       HOMOLOG_SUBABA === 'prontosEnvio' ? 'Nenhuma homologação pronta para envio no momento.' :
       'Nenhuma rescisão pendente de homologação.');
    cont.innerHTML = '<div class="vazio">' + vazioMsg + '</div>';
    return;
  }

  // Mais recente primeiro, com uma linha por mês de demissão.
  lista = lista.slice().sort((a, b) => String(b.demissao || '').localeCompare(String(a.demissao || '')));
  const linhas = lista.map(c => ({ grupo: String(c.demissao || '').slice(0, 7), html: _homologLinha_(c) }));
  cont.innerHTML = _rescTabelaHtml_('Demissão', linhas,
    'homolog:' + HOMOLOG_SUBABA + ':' + HOMOLOG_FILTRO_MES + ':' + HOMOLOG_FILTRO_TIPO + ':' + busca);
}

function toggleRcCompareceu(){

async function confirmarRescComparecimento(){
  limpa('rcMsg');
  const compareceu = $('rcCompareceu').value === 'sim';
  const b = $('rcBtn'); ocupado(b, 'Salvando…');
  try{
    const dados = { id: RESC_ATUAL, compareceu: compareceu };
    if(compareceu) dados.avisoOpcao = $('rcAvisoOpcao').value;
    else if($('rcNovaData').value) dados.novaData = $('rcNovaData').value;
    const r = await chamar('srvRescComparecimento', TOKEN, dados);

/* ---- Homologação (lê direto a CONTROLE.2026 por matrícula, aba própria) ---- */
let RESC_HOMOLOGACAO = null;

/**
 * Pede a lista da Homologação. Devolve { ok, erro?, sessao? } para o botão de atualizar saber o
 * que aconteceu.
 *
 * [FIX 2026-09-28] Antes: (1) se a lista não chegava, clicar nas seções não fazia nada e todas
 * mostravam as mesmas barras de carregamento; (2) se a atualização falhava com uma lista já na
 * tela, o erro ia só para o console e o botão parecia não funcionar; (3) um pedido perdido
 * travava as atualizações seguintes; (4) sessão vencida deixava a lista parada.
 */
async function carregarRescHomologacao(forcar){
  document.querySelectorAll('#rescSubnav .sub').forEach(b => b.classList.toggle('on', b.dataset.sub === RESC_SUBABA));

  // Não empilha pedidos: se um ainda está em andamento, a atualização automática espera o próximo
  // ciclo. Um pedido que passou de 2 minutos se perdeu no caminho: não trava mais a lista.
  if(HOMOLOG_CARREGANDO && !forcar && Date.now() - HOMOLOG_CARREGANDO_DESDE < 120000){
    renderRescHomologacaoLista();
    return { ok: true, emAndamento: true };
  }
  HOMOLOG_CARREGANDO = true;
  HOMOLOG_CARREGANDO_DESDE = Date.now();
  if(!RESC_HOMOLOGACAO) HOMOLOG_ERRO = '';
  // A lista que já existe fica na tela enquanto a nova chega; sem lista, mostra "Carregando…".
  _desenharHomologSemQuebrar_();

  const tokenUsado = TOKEN;
  let r;
  try{
    r = await chamar('srvRescHomologacaoLista', tokenUsado, !!forcar);
  }catch(e){
    HOMOLOG_CARREGANDO = false;
    const sessao = _tratarSessaoVencida_(e, tokenUsado);
    if(sessao === 'login') return { ok: false, sessao: true };
    if(sessao === 'novo') return carregarRescHomologacao(forcar);
    HOMOLOG_ERRO = (e && e.message) || 'o sistema não respondeu';
    console.error('[homologação] carga falhou:', e);
    // Com lista na tela, uma falha não a apaga; sem lista, mostra o erro e o "Tentar de novo".
    if(RESC_SUBABA === 'homologacao') _desenharHomologSemQuebrar_();
    return { ok: false, erro: HOMOLOG_ERRO };
  }
  HOMOLOG_CARREGANDO = false;
  if(tokenUsado !== TOKEN) return { ok: false, sessao: true }; // a pessoa saiu ou trocou de sessão no meio
  // [FIX 2026-09-28] Resposta sem a lista de pessoas: antes era guardada assim mesmo e o desenho
  // quebrava ("Cannot read properties of undefined (reading 'filter')"), travando a tela até
  // recarregar. Agora vira erro visível, com o formato do que chegou para achar a causa.
  if(!r || !Array.isArray(r.lista)){
    HOMOLOG_ERRO = 'a resposta chegou sem a lista de pessoas (' + _descreverRespostaHomolog_(r) + ')';
    console.error('[homologação] resposta inesperada:', r);
    if(RESC_SUBABA === 'homologacao') _desenharHomologSemQuebrar_();
    return { ok: false, erro: HOMOLOG_ERRO };
  }
  RESC_HOMOLOGACAO = r;
  HOMOLOG_ERRO = '';
  // Guarda a lista mesmo se a pessoa foi para outra seção da Rescisão; só desenha se ainda está aqui.
  if(RESC_SUBABA === 'homologacao'){
    const falhaDesenho = _desenharHomologSemQuebrar_();
    if(falhaDesenho) return { ok: false, erro: falhaDesenho };
  }
  return { ok: true };
}

/** Resumo do formato de uma resposta, sem dados de pessoas (só tipo, campos e tamanho). */
function _descreverRespostaHomolog_(r){
  if(r === null || r === undefined) return 'resposta vazia';
  if(Array.isArray(r)) return 'veio uma lista solta com ' + r.length + ' itens';
  if(typeof r !== 'object') return 'tipo ' + typeof r + (typeof r === 'string' ? ' com ' + r.length + ' caracteres' : '');
  const campos = Object.keys(r);
  return 'campos: ' + (campos.length ? campos.slice(0, 10).join(', ') : 'nenhum') +
    ('lista' in r ? '; lista é ' + (r.lista === null ? 'null' : typeof r.lista) : '');
}

/** Desenha a Homologação sem deixar um erro de desenho travar a tela. Devolve a mensagem se falhar. */
function _desenharHomologSemQuebrar_(){
  try{
    renderRescHomologacaoLista();
    return '';
  }catch(e){
    console.error('[homologação] erro ao desenhar a lista:', e);
    const cont = $('listaResc');
    if(cont) cont.innerHTML = '<div class="vazio" style="color:#b00">Não consegui mostrar a lista: ' + esc(e.message) +
      '<br><br><button class="b ver" onclick="carregarRescHomologacao(true)">Tentar de novo</button></div>';
    return (e && e.message) || 'erro ao mostrar a lista';
  }
}

function homologBuscar(v){
  HOMOLOG_BUSCA = v;
  _desenharHomologSemQuebrar_();
}

async function atualizarHomolog(btn){
  btn.disabled = true; btn.classList.add('girando');
  try{
    const carga = await carregarRescHomologacao(true); // força reler o Drive, não espera o cache
    if(!carga || !carga.ok){
      if(carga && carga.erro) toast('Não consegui atualizar a lista: ' + carga.erro, 'err');
      return;
    }
    if(HOMOLOG_SUBABA !== 'enviadas') toast('Lista atualizada.', 'suc');
    // A checagem em tempo real no Autentique só roda quando a aba "Enviadas"
    // está selecionada — é a única aba onde isso importa, e é uma chamada mais lenta/cara,
    // então não deve rodar (nem "girar") nas outras abas.
    if(HOMOLOG_SUBABA === 'enviadas'){
      // [FIX 2026-09-28] Em rodadas (cada chamada à API trabalha até ~40 s): repete até conferir todas.
      const vistos = {};
      let rodada = 0, restantes = 0;
      do{
        rodada++;
        if(rodada > 1) toast('Conferindo no Autentique… ' + Object.keys(vistos).length + ' checadas, faltam ' + restantes + '.', '');
        const r = await chamar('srvRescVerificarTodasAssinaturasHomologacao', TOKEN);
        (r && r.verificados || []).forEach(v => { vistos[v.matricula] = v; });
        restantes = Number(r && r.restantes || 0);
        if(!(r && Number(r.consultadosAgora || 0))) break; // nada novo consultado: para
      }while(restantes > 0 && rodada < 15);
      const lista = Object.keys(vistos).map(k => vistos[k]);
      if(RESC_HOMOLOGACAO && RESC_HOMOLOGACAO.lista){
        let assinados = 0;
        lista.forEach(v => {
          if(!v.ok) return;
          const item = RESC_HOMOLOGACAO.lista.find(x => x.matricula === v.matricula);
          if(item) item.assinado = v.assinado;
          if(v.assinado) assinados++;
        });
        _desenharHomologSemQuebrar_();
        toast('Verificação concluída: ' + lista.length + ' checadas, ' + assinados + ' assinadas por todo mundo.' +
          (restantes ? ' Faltaram ' + restantes + ': clique em atualizar de novo.' : ''), 'suc');
      }
    }
  }
  catch(e){ if(!_tratarSessaoVencida_(e, TOKEN)) toast(e.message, 'err'); }
  finally{ btn.disabled = false; btn.classList.remove('girando'); }
}

function _homologNorm_(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
}

/**
 * [FIX 2026-09-28] Em rodadas: cada chamada à API trabalha até ~40 s (o Portal só espera ~60 s
 * pela API) e devolve quantas faltam; aqui repetimos até acabar, mostrando o andamento na janela.
 * Antes era uma chamada só, que passava de 60 s: aparecia erro e só parte era arquivada.
 */
async function confirmarBaixarTodasHomologacoes(){
  const btn = $('btnConfirmarBaixarTodasHomolog');
  const textoBtn = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; }
  const baixados = [], erros = [];
  let rodada = 0, restantes = 0, falha = '';
  const andamento = t => { const el = $('baixarTodasHomologMsg'); if(el){ el.textContent = t; el.className = 'msg on ok'; } };
  try{
    do{
      rodada++;
      andamento('Verificando no Autentique e baixando… ' + baixados.length + ' arquivada(s) até agora' +
        (restantes ? ', ainda faltam ' + restantes + ' para conferir ou baixar' : '') + '.');
      if(btn) btn.textContent = 'Trabalhando… (rodada ' + rodada + ')';
      let r;
      try{ r = await chamar('srvRescBaixarTodasHomologacoes', TOKEN); }
      catch(e){ falha = e.message; break; }
      (r.baixados || []).forEach(x => baixados.push(x));
      (r.erros || []).forEach(x => erros.push(x));
      restantes = Number(r.restantes || 0);
      const avancou = (r.baixados || []).length + Number(r.consultadosAgora || 0) + (r.erros || []).length;
      if(!avancou) break; // nada andou nesta rodada: não fica repetindo à toa
    }while(restantes > 0 && rodada < 30);

    fechar('ovBaixarTodasHomolog');
    let msg = baixados.length ? baixados.length + ' homologação(ões) baixada(s) e arquivada(s).'
                              : 'Nenhuma homologação nova assinada por todo mundo.';
    if(erros.length) msg += ' ' + erros.length + ' com erro: ' + erros.map(e => e.matricula + ' (' + e.erro + ')').join('; ');
    if(falha) msg += ' A última rodada falhou (' + falha + '): clique de novo para continuar de onde parou.';
    else if(restantes > 0) msg += ' Ainda faltam ' + restantes + ': clique de novo para continuar.';
    toast(msg, (erros.length || falha) ? 'err' : 'suc');
    carregarRescHomologacao(true);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = textoBtn; }
    limpa('baixarTodasHomologMsg');
  }
}

const ROTULOS_MOTIVO_COMPLEMENTAR = {
  ERRO_CALCULO_DP: 'Erro no cálculo original (DP)',
  DISSIDIO: 'Dissídio / reajuste retroativo',
  MULTA_477: 'Multa do art. 477 CLT',
  OUTRO: 'Outro motivo'
};

function rotuloMotivoComplementar(chave){
  if(ROTULOS_MOTIVO_COMPLEMENTAR[chave]) return esc(ROTULOS_MOTIVO_COMPLEMENTAR[chave]);
  if(chave.indexOf('SEM_CATEGORIA') > -1) return 'Sem categoria <i>(lançamento antigo)</i>';
  return esc(chave);
}

async function renderRescComplementarIndicadores(){
  const el = $('rescIndicadores');
  if(!el) return;
  if(RESC_SUBABA === 'homologacao'){ el.innerHTML = ''; return; }

  const pedidaEm = RESC_SUBABA; // se o usuário trocar de aba antes da resposta chegar, ignora a resposta atrasada
  try{
    const r = await chamar('srvRescComplementarIndicadores', TOKEN);
    if(RESC_SUBABA !== pedidaEm) return;

    if(!r.total){ el.innerHTML = ''; return; }

    const linhas = Object.keys(r.porMotivo).map(k =>
      '<div class="indic-l"><span>' + rotuloMotivoComplementar(k) + '</span><b>' + r.porMotivo[k] + '</b></div>').join('');
    el.innerHTML = '<div class="indic" style="margin-top:18px">' +
      '<div class="indic-cab"><span>Rescisões complementares</span><span class="qtd">' + r.total + '</span></div>' +
      linhas + '</div>';
  }catch(e){ if(RESC_SUBABA === pedidaEm) el.innerHTML = ''; }
}

function renderProcTrab(){
  if(!PROC_FILA){ _moduloSemDados_('PROCESSOTRAB', 'listaProcTrab'); return; }
  const grupos = { atrasados: PROC_FILA.atrasados, pendentes: PROC_FILA.pendentes, parciais: PROC_FILA.parciais, pagos: PROC_FILA.pagos };
  Object.keys(grupos).forEach(k => atualizarContagemSub('procCont_' + k, listaSegura(grupos[k]).length));
  document.querySelectorAll('#procSubnav .sub').forEach(b => b.classList.toggle('on', b.dataset.sub === PROC_SUBABA));

  const lista = grupos[PROC_SUBABA] || [];
  if(!lista.length){ $('listaProcTrab').innerHTML = '<div class="vazio">Nada por aqui.</div>'; return; }

  $('listaProcTrab').innerHTML = lista.map(x => {
    const fgtsNum = Number(String(x.valorFgts || '0').replace(/[^\d,.-]/g, '').replace(',', '.'));
    const inssNum = Number(String(x.valorInss || '0').replace(/[^\d,.-]/g, '').replace(',', '.'));

    let acoes = '';
    if(fgtsNum > 0 && !x.dataPagamentoFgts) acoes += '<button class="b sim" onclick="abrirProcPagamento(\'' + x.id + '\',\'FGTS\')">Pagar FGTS</button>';
    if(inssNum > 0 && !x.dataPagamentoInss) acoes += '<button class="b sim" onclick="abrirProcPagamento(\'' + x.id + '\',\'INSS\')">Pagar INSS</button>';
    if(x.status !== 'PAGO' && x.status !== 'CANCELADO') acoes += '<button class="b nao" onclick="procTrabCancelar(\'' + x.id + '\')">Cancelar</button>';

    return '<div class="item">' +
      '<div class="ini">' + esc(ini(x.nome)) + '</div>' +
      '<div class="info"><b>' + esc(x.nome) + (x.atrasado ? ' <span class="tag atraso">atrasado</span>' : '') + '</b>' +
      '<span>Processo ' + esc(x.numeroProcesso) + '</span></div>' +
      '<div class="col"><div class="k">FGTS</div><div class="v">' + esc(x.valorFgts || '—') + '</div></div>' +
      '<div class="col"><div class="k">INSS</div><div class="v">' + esc(x.valorInss || '—') + '</div></div>' +
      '<div class="col"><div class="k">Prazo</div><div class="v">' + dBR(x.prazoPagamento) + '</div></div>' +
      '<div class="acoes">' + acoes + '</div>' +
    '</div>';
  }).join('');
}

function _buscaNorm_(s){
  const baixo = String.fromCharCode(768), alto = String.fromCharCode(879);
  const re = new RegExp('[' + baixo + '-' + alto + ']', 'g');
  return String(s || '').normalize('NFD').replace(re, '').toLowerCase();
}

/* Autocomplete simples pra campos "escolha um colaborador da lista", em cima de um <input> comum
   + <div> de sugestões (não usa <input list>/<datalist>: essa dupla não abre a lista de sugestões
   em boa parte dos navegadores/webviews mobile, então a busca ficava impossível no celular).
   itens: [{id, label, sub?, dados?}]. onEscolher(it) recebe o item clicado, ou null quando o
   texto foi apagado/editado sem selecionar nada da lista. */
function montarAutocompleteBusca_(prefixo, itens, onEscolher){
  const input = $(prefixo + 'Busca');
  const box = $(prefixo + 'Drop');
  if(!input || !box) return;

  function fechar(){ box.style.display = 'none'; }

  function renderizar(filtro){
    const q = _buscaNorm_(filtro);
    const filtrados = q ? itens.filter(it => _buscaNorm_(it.label).indexOf(q) !== -1) : itens;
    if(!filtrados.length){
      box.innerHTML = '<div class="vazio">Nenhum colaborador encontrado.</div>';
    }else{
      box.innerHTML = filtrados.slice(0, 60).map((it, i) =>
        '<div class="item" data-i="' + i + '"><b>' + esc(it.label) + '</b>' +
        (it.sub ? '<span>' + esc(it.sub) + '</span>' : '') + '</div>'
      ).join('');
      // mousedown (não click) + preventDefault: escolhe no toque inicial, antes do input perder o
      // foco. Em celular, um <div> clicável dentro de um modal que fecha "ao clicar fora" é
      // arriscado com click puro — entre o toque e o click sintetizado o teclado pode recolher,
      // o layout desloca, e o clique acaba "vazando" pro overlay escuro atrás do modal, fechando
      // tudo (era esse o sumiço reportado). preventDefault no mousedown evita esse blur/deslocamento.
      Array.prototype.forEach.call(box.querySelectorAll('.item'), function(el){
        el.addEventListener('mousedown', function(ev){
          ev.preventDefault();
          const it = filtrados[+el.dataset.i];
          input.value = it.label;
          fechar();
          onEscolher(it);
        });
      });
    }
    box.style.display = 'block';
  }

  input.oninput = function(){ onEscolher(null); renderizar(input.value); };
  input.onfocus = function(){ renderizar(input.value); };
  document.addEventListener('click', function(e){
    if(e.target !== input && !box.contains(e.target)) fechar();
  });
}

/** Resultados locais e instantâneos: seções do portal (navegação) + pendências já carregadas
 *  em Férias, Afastamentos, Rescisão, Trabalhista e Movimentações. */
function _buscaGlobalLocais_(q){
  const acoes = [];

  BUSCA_GLOBAL_SECOES.filter(s => _buscaNorm_(s.texto).indexOf(q) > -1).forEach(s => {
    acoes.push({ grupo: 'Ir para', texto: s.texto, sub: '', tipo: 'secao', aba: s.aba });
  });

  PAINEL_ITENS_CACHE.filter(it => _buscaNorm_(it.titulo + ' ' + it.sub).indexOf(q) > -1).forEach(it => {
    acoes.push({ grupo: it.modulo, texto: it.titulo, sub: it.sub, tipo: 'pendencia', aba: it.aba });
  });

  return acoes;
}

function _buscaGlobalRenderizar_(){
  const box = $('buscaGlobalResultados');
  if(!box) return;

  if(!BUSCA_GLOBAL_ACOES.length){ box.innerHTML = '<div class="vazio">Nada encontrado.</div>'; return; }

  let grupoAtual = null, html = '';
  BUSCA_GLOBAL_ACOES.forEach((a, i) => {
    if(a.grupo !== grupoAtual){ html += '<div class="grupo-titulo">' + esc(a.grupo) + '</div>'; grupoAtual = a.grupo; }
    html += '<div class="item" onclick="buscaGlobalAcao(' + i + ')"><b>' + esc(a.texto) + '</b>' +
      (a.sub ? '<span>' + esc(a.sub) + '</span>' : '') + '</div>';
  });
  box.innerHTML = html;
}

function buscaGlobalInput(valor){
  const box = $('buscaGlobalResultados');
  if(!box) return;
  const qOriginal = String(valor || '').trim();
  const q = _buscaNorm_(qOriginal);

  clearTimeout(BUSCA_GLOBAL_TIMER);

  if(q.length < 2){ box.style.display = 'none'; box.innerHTML = ''; BUSCA_GLOBAL_ACOES = []; return; }

  // Seções e pendências aparecem na hora, sem esperar a rede.
  BUSCA_GLOBAL_ACOES = _buscaGlobalLocais_(q);
  box.style.display = 'block';
  _buscaGlobalRenderizar_();
  if(!BUSCA_GLOBAL_ACOES.length) box.innerHTML = '<div class="vazio">Buscando no cadastro…</div>';

  // Colaboradores vêm da API (cadastro inteiro), com um respiro pra não disparar a cada tecla.
  BUSCA_GLOBAL_TIMER = setTimeout(async function(){
    try{
      const r = await chamar('srvBuscarColaborador', TOKEN, qOriginal);
      if(_buscaNorm_(($('buscaGlobal').value || '').trim()) !== q) return; // digitou outra coisa nesse meio tempo

      const colabAcoes = (r.resultados || []).map(c => ({
        grupo: 'Colaboradores', texto: c.nome,
        sub: [c.departamento, c.cargo].filter(Boolean).join(' · '),
        tipo: 'colaborador', dados: c
      }));
      BUSCA_GLOBAL_ACOES = BUSCA_GLOBAL_ACOES.concat(colabAcoes);
      _buscaGlobalRenderizar_();
    }catch(e){
      if(!BUSCA_GLOBAL_ACOES.length) box.innerHTML = '<div class="vazio">' + esc(e.message || 'Erro ao buscar.') + '</div>';
    }
  }, 300);
}

function buscaGlobalAcao(i){
  const a = BUSCA_GLOBAL_ACOES[i];
  if(!a) return;

  const box = $('buscaGlobalResultados'); if(box){ box.style.display = 'none'; }
  const input = $('buscaGlobal'); if(input){ input.value = ''; }

  if(a.tipo === 'secao'){
    if(a.aba === '__config__') abrirConfig(); else ir(a.aba);
    return;
  }

  if(a.tipo === 'pendencia'){ ir(a.aba); return; }

  // colaborador: se tiver algo pendente numa fila, vai direto pra lá; senão, só mostra os dados dela.
  const alvo = String(a.dados.nome || '').trim().toLowerCase();
  const pendencia = PAINEL_ITENS_CACHE.find(it => String(it.titulo || '').trim().toLowerCase() === alvo);
  if(pendencia){ ir(pendencia.aba); return; }

  const partes = [a.dados.matricula ? 'matrícula ' + a.dados.matricula : '', a.dados.cargo, a.dados.departamento].filter(Boolean);
  toast(a.dados.nome + (partes.length ? ' — ' + partes.join(' · ') : '') + ' — sem pendências no momento.', '');
}

function buscaGlobalIr(aba){
  $('sinoResultados').style.display = 'none';
  const box = $('buscaGlobalResultados'); if(box){ box.style.display = 'none'; }
  ir(aba);
}

document.addEventListener('click', function(ev){
  const buscaBox = $('buscaGlobalResultados');
  const buscaInput = $('buscaGlobal');
  if(buscaBox && buscaInput && ev.target !== buscaInput && !buscaBox.contains(ev.target)) buscaBox.style.display = 'none';

  const sinoBox = $('sinoResultados');
  const sinoBtn = $('sinoAviso');
  if(sinoBox && sinoBtn && !sinoBtn.contains(ev.target) && !sinoBox.contains(ev.target)) sinoBox.style.display = 'none';
});

/* ================= MOVIMENTAÇÕES · [2026-10-21] visual da Rescisão/Férias =================
 * Cartões de etapa (Aguardando o DP / Decididas pelo DP / Reprovadas pelo RH), busca e filtro por tipo,
 * tabela com o que muda (de → para) e os alertas do pedido, e a caixa de decisão com o resumo e o
 * caminho Gestor → RH → DP. Usa as peças da Férias (_ferTabelaHtml_, _ferColab_, _ferTag_) e da
 * Rescisão (_rescAcoesHtml_). A API não mudou: MOVIMENTACAO.FILA e MOVIMENTACAO.DECIDIR_DP. */

let MOV_FILTRO = {};
let MOV_DECISAO = '';

function movIr(sub){ MOV_SUBABA = sub; FER_PAG.mov = { pagina: 0, todos: false }; renderMov(); }
function movFiltrar(campo, valor){ MOV_FILTRO[campo] = valor; FER_PAG.mov = { pagina: 0, todos: false }; renderMov(); }

function _movTodos_(){
  const f = MOV_FILA || {};
  return [].concat(listaSegura(f.aguardandoDP), listaSegura(f.decididas), listaSegura(f.reprovadasPeloRH));
}
function _movAchar_(id){ return _movTodos_().find(x => String(x.id) === String(id)) || null; }

function _movDiasDesde_(iso){
  const d = _ferIsoParaData_(iso);
  if(!d) return null;
  const h = new Date(); h.setHours(12, 0, 0, 0);
  return Math.max(0, Math.round((h - d) / 864e5));
}
function _movBrl_(v){ return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

/** O que muda: { rotulo, de, para } — "de" só quando o sistema sabe o valor atual. */
function _movMudanca_(k){
  const d = k.detalhe || {};
  switch(k.tipoCod){
    case 'TRANSFERENCIA_DEPARTAMENTO': return { rotulo: 'Departamento', de: k.departamento, para: d.departamentoNovo };
    case 'ALTERACAO_TURNO': return { rotulo: 'Turno', de: '', para: d.turnoNovo === 'NOTURNO' ? 'Noturno' : 'Diurno' };
    case 'ALTERACAO_CARGA_HORARIA': return { rotulo: 'Carga horária', de: '', para: d.cargaHorariaNova };
    case 'ALTERACAO_CARGO': return { rotulo: 'Cargo', de: k.cargo, para: d.cargoNovo };
    case 'ALTERACAO_SALARIO': return { rotulo: 'Salário', de: '', para: d.salarioNovo ? _movBrl_(d.salarioNovo) : '' };
    default: {
      const rot = k.tipoCod === 'ADICIONAL_PAGAMENTO' ? (d.acaoAdicional === 'RETIRAR' ? 'Retirar' : 'Incluir') : 'Pedido';
      return { rotulo: rot, de: '', para: [d.descricaoAdicional, d.valorAdicional ? _movBrl_(d.valorAdicional) : ''].filter(Boolean).join(' · ') };
    }
  }
}
function _movMudancaTxt_(k){
  const m = _movMudanca_(k);
  return m.rotulo + ': ' + (m.de ? m.de + ' → ' : '') + (m.para || '—');
}
function _movMudancaHtml_(k){
  const m = _movMudanca_(k);
  return '<b class="mov-tipo">' + esc(k.tipo) + '</b>' +
    '<small class="mov-de-para">' + esc(m.rotulo) + ': ' + (m.de ? esc(m.de) + ' <span aria-hidden="true">→</span> ' : '') +
    '<b>' + esc(m.para || '—') + '</b></small>';
}

/** Ajuste do RH pode vir como texto ou como { campo, de, para } (gravado pela página de decisão). */
function _movAjusteTxt_(a){
  if(a == null) return '';
  if(typeof a !== 'object') return String(a);
  const campo = a.campo || a.rotulo || a.chave || '';
  const txt = [campo, a.de ? 'de ' + a.de : '', a.para ? 'para ' + a.para : ''].filter(Boolean).join(' ');
  return txt || JSON.stringify(a);
}

/** Alertas do pedido: [texto, cor, explicação]. */
function _movAlertas_(k){
  const t = [];
  if(k.salarioDivergente) t.push(['Salário fora do praticado', 'amarelo', 'O valor é diferente do que se paga para o mesmo cargo no departamento. O gestor confirmou e justificou.']);
  else if(k.salarioVerificacao === 'NAO_VERIFICADO') t.push(['Salário não conferido', 'cinza', 'Não havia salário de referência para o mesmo cargo no departamento.']);
  if(k.alertaCargoInedito) t.push(['Cargo novo no departamento', 'amarelo', 'Ninguém mais tem esse cargo no departamento: confira se não é engano.']);
  const aj = listaSegura(k.rhAjustes).map(_movAjusteTxt_).filter(Boolean);
  if(aj.length) t.push(['Ajustado pelo RH', 'azul', aj.join('; ')]);
  if(k.geradaDe) t.push(['Gerada pela troca de turno', 'cinza', 'Criada automaticamente junto com a movimentação ' + k.geradaDe + '.']);
  return t;
}
function _movAlertasHtml_(k){
  const t = _movAlertas_(k);
  if(!t.length) return '<span class="resc-sem-acao">—</span>';
  return '<div class="mov-tags">' + t.map(a => '<span class="resc-tag ' + a[1] + '" title="' + esc(a[2]) + '">' + esc(a[0]) + '</span>').join('') + '</div>';
}

function _movNota_(sub, texto, cor){
  const el = $('movNota_' + sub);
  if(!el) return;
  el.textContent = texto || '';
  el.className = 'fer-etapa-nota' + (cor ? ' ' + cor : '');
}

function renderMov(){
  if(!MOV_FILA){ _moduloSemDados_('MOVIMENTACAO', 'listaMov'); return; }
  const grupos = {
    aguardandoDP: listaSegura(MOV_FILA.aguardandoDP),
    decididas: listaSegura(MOV_FILA.decididas),
    reprovadasPeloRH: listaSegura(MOV_FILA.reprovadasPeloRH)
  };
  Object.keys(grupos).forEach(k => { const el = $('movCont_' + k); if(el) el.textContent = grupos[k].length; });
  document.querySelectorAll('#movEtapas .resc-etapa').forEach(b => b.classList.toggle('on', b.dataset.sub === MOV_SUBABA));

  const ag = grupos.aguardandoDP;
  const espera = ag.reduce((m, k) => Math.max(m, _movDiasDesde_(k.solicitadoEm) || 0), 0);
  _movNota_('aguardandoDP', ag.length ? (espera ? 'a mais antiga há ' + _ferPlural_(espera, 'dia', 'dias') : 'pedidas hoje') : 'nada para decidir', ag.length && espera > 7 ? 'amarelo' : '');
  const aprovadas = grupos.decididas.filter(k => k.status === 'DP_APROVADA').length;
  _movNota_('decididas', grupos.decididas.length ? aprovadas + ' aprovada' + (aprovadas === 1 ? '' : 's') + ' · ' + (grupos.decididas.length - aprovadas) + ' reprovada' + (grupos.decididas.length - aprovadas === 1 ? '' : 's') : '');
  _movNota_('reprovadasPeloRH', grupos.reprovadasPeloRH.length ? 'não chegam ao DP' : '');

  const INFO = {
    aguardandoDP: 'Já aprovadas pelo RH. A decisão do DP avisa o gestor por e-mail.',
    decididas: 'As 40 mais recentes.',
    reprovadasPeloRH: 'As 20 mais recentes. O gestor já recebeu o motivo do RH.'
  };
  $('movInfo').textContent = INFO[MOV_SUBABA] || '';

  const base = grupos[MOV_SUBABA] || [];
  if(!base.length){
    $('listaMov').innerHTML = _ferVazio_({
      aguardandoDP: 'Nenhuma movimentação esperando o DP.',
      decididas: 'O DP ainda não decidiu nenhuma movimentação.',
      reprovadasPeloRH: 'Nenhuma movimentação reprovada pelo RH.'
    }[MOV_SUBABA] || 'Nada por aqui.');
    return;
  }

  const busca = _ferNorm_(MOV_FILTRO.busca);
  const lista = base.filter(k => {
    if(MOV_FILTRO.tipo && k.tipoCod !== MOV_FILTRO.tipo) return false;
    if(busca && _ferNorm_([k.nome, k.departamento, k.cargo, k.tipo, k.gestorEmail, _ferNomeGestor_(k.gestorEmail)].join(' ')).indexOf(busca) < 0) return false;
    return true;
  });
  // A fila do DP vem da mais antiga para a mais nova (quem espera mais aparece primeiro); as outras, da mais nova.
  if(MOV_SUBABA !== 'aguardandoDP') lista.sort((a, b) => String(b.solicitadoEm).localeCompare(String(a.solicitadoEm)));
  if(!lista.length){ $('listaMov').innerHTML = _ferVazio_('Nenhuma movimentação com esses filtros.'); return; }

  const linhas = lista.map(k => {
    const idJs = _rescArgJs_(k.id);
    const gestor = _ferNomeGestor_(k.gestorEmail || k.solicitadoPor);
    const dias = _movDiasDesde_(k.solicitadoEm);
    const colab = _ferColab_(k.nome, esc([k.departamento, k.cargo].filter(Boolean).join(' · ') || '—'));
    const pedido = _ferDado_(dBR(k.solicitadoEm), gestor ? 'por ' + gestor : '');
    const inicio = _ferDado_(k.competenciaInicio, '');
    if(MOV_SUBABA === 'aguardandoDP'){
      return { cels: [
        colab, _movMudancaHtml_(k), inicio,
        _ferDado_(dBR(k.solicitadoEm), (gestor ? 'por ' + gestor : '') + (dias != null ? (gestor ? ' · ' : '') + (dias === 0 ? 'hoje' : 'há ' + _ferPlural_(dias, 'dia', 'dias')) : '')),
        _movAlertasHtml_(k),
        _rescAcoesHtml_([
          { p: 1, t: 'Decidir', forte: 1, fn: "abrirDecidirMov('" + idJs + "')" },
          { t: 'Ver detalhes', fn: "abrirDetalheMov('" + idJs + "')" }
        ])
      ] };
    }
    if(MOV_SUBABA === 'decididas'){
      const ok = k.status === 'DP_APROVADA';
      return { cels: [
        colab, _movMudancaHtml_(k), inicio,
        ok ? _ferTag_('Aprovada', 'verde', k.dpFolhaCompetencia ? 'folha de ' + k.dpFolhaCompetencia : '')
           : _ferTag_('Reprovada', 'vermelho', String(k.dpMotivo || '').slice(0, 70) + (String(k.dpMotivo || '').length > 70 ? '…' : ''), k.dpMotivo),
        _rescAcoesHtml_([{ p: 1, t: 'Ver detalhes', fn: "abrirDetalheMov('" + idJs + "')" }])
      ] };
    }
    return { cels: [
      colab, _movMudancaHtml_(k), inicio, pedido,
      _ferTag_('Reprovada pelo RH', 'vermelho', String(k.rhMotivo || '').slice(0, 70) + (String(k.rhMotivo || '').length > 70 ? '…' : ''), k.rhMotivo),
      _rescAcoesHtml_([{ p: 1, t: 'Ver detalhes', fn: "abrirDetalheMov('" + idJs + "')" }])
    ] };
  });

  const colunas = MOV_SUBABA === 'aguardandoDP'
    ? [{ t: 'Colaborador' }, { t: 'O que muda' }, { t: 'Início', data: 1 }, { t: 'Pedido', data: 1 }, { t: 'Alertas' }, { t: 'Ações', cls: 'resc-col-acoes' }]
    : MOV_SUBABA === 'decididas'
      ? [{ t: 'Colaborador' }, { t: 'O que muda' }, { t: 'Início', data: 1 }, { t: 'Decisão do DP', cls: 'resc-situacao' }, { t: 'Ações', cls: 'resc-col-acoes' }]
      : [{ t: 'Colaborador' }, { t: 'O que muda' }, { t: 'Início', data: 1 }, { t: 'Pedido', data: 1 }, { t: 'Motivo do RH', cls: 'resc-situacao' }, { t: 'Ações', cls: 'resc-col-acoes' }];
  $('listaMov').innerHTML = _ferTabelaHtml_('mov', colunas, linhas);
}

/* ---- caixa de decisão / detalhes ---- */

function _movTrilhaHtml_(k){
  const s = k.status;
  const rh = s === 'SOLICITADA' ? ['atual', 'Analisando'] : s === 'RH_REPROVADA' ? ['cr', 'Reprovou'] : s === 'CANCELADA' ? ['', 'Cancelada'] :
    ['ok', listaSegura(k.rhAjustes).length ? 'Aprovou com ajustes' : 'Aprovou'];
  const dp = s === 'AGUARDANDO_DP' ? ['atual', 'Decidindo'] : s === 'DP_APROVADA' ? ['ok', 'Aprovou' + (k.dpFolhaCompetencia ? ' · folha ' + k.dpFolhaCompetencia : '')] :
    s === 'DP_REPROVADA' ? ['cr', 'Reprovou'] : ['', '—'];
  const gestor = _ferNomeGestor_(k.gestorEmail || k.solicitadoPor);
  return '<ol class="mov-trilha" aria-label="Caminho do pedido">' +
    '<li class="ok"><span>Gestor</span><b>Pediu em ' + esc(dBR(k.solicitadoEm)) + '</b>' + (gestor ? '<small>' + esc(gestor) + '</small>' : '') + '</li>' +
    '<li class="' + rh[0] + '"><span>RH</span><b>' + esc(rh[1]) + '</b></li>' +
    '<li class="' + dp[0] + '"><span>DP</span><b>' + esc(dp[1]) + '</b></li>' +
  '</ol>';
}

function _movResumoHtml_(k){
  const m = _movMudanca_(k);
  const dados = [
    ['Movimentação', esc(k.tipo)],
    ['O que muda', esc(m.rotulo) + ': ' + (m.de ? esc(m.de) + ' → ' : '') + '<b>' + esc(m.para || '—') + '</b>'],
    ['Início', esc(k.competenciaInicio || '—')],
    ['Pedido por', esc(_ferNomeGestor_(k.gestorEmail || k.solicitadoPor) || k.solicitadoPor || '—')]
  ];
  const largos = [['Justificativa do gestor', esc(k.justificativa || '—')]];
  const aj = listaSegura(k.rhAjustes).map(_movAjusteTxt_).filter(Boolean);
  if(aj.length) largos.push(['Ajustes do RH', aj.map(esc).join('<br>')]);
  if(k.rhMotivo) largos.push([k.status === 'RH_REPROVADA' ? 'Motivo do RH' : 'Observação do RH', esc(k.rhMotivo)]);
  if(k.dpMotivo) largos.push(['Motivo do DP', esc(k.dpMotivo)]);
  // "Ajustado pelo RH" já aparece no campo Ajustes do RH, logo acima.
  const alertas = _movAlertas_(k).filter(a => a[0] !== 'Ajustado pelo RH');
  return _movTrilhaHtml_(k) +
    '<div class="mov-pessoa">' + _ferColab_(k.nome, esc([k.departamento, k.cargo].filter(Boolean).join(' · ') || '—')) + '</div>' +
    '<dl class="mov-dados">' +
      dados.map(d => '<div><dt>' + d[0] + '</dt><dd>' + d[1] + '</dd></div>').join('') +
      largos.map(d => '<div class="largo"><dt>' + d[0] + '</dt><dd>' + d[1] + '</dd></div>').join('') +
    '</dl>' +
    (alertas.length ? '<div class="mov-alertas">' + alertas.map(a =>
      '<div class="mov-alerta"><span class="resc-tag ' + a[1] + '">' + esc(a[0]) + '</span><span>' + esc(a[2]) + '</span></div>').join('') + '</div>' : '');
}

function _movAbrirCaixa_(k, decidir){
  MOV_ATUAL = k.id;
  MOV_DECISAO = '';
  $('mdTitulo').textContent = decidir ? 'Decidir movimentação' : 'Detalhes da movimentação';
  $('mdSub').textContent = _rescNomeTitulo_(k.nome) + ' · ' + k.tipo;
  $('mdCorpoInfo').innerHTML = _movResumoHtml_(k);
  ver('mdDecisao', !!decidir);
  if(decidir){
    $('mdMotivo').value = '';
    const c = String(k.competenciaInicio || '').match(/^(\d{2})\/(\d{4})$/);
    $('mdFolha').value = c ? c[2] + '-' + c[1] : '';
    movEscolher('');
  }
  limpa('mdMsg');
  abrir('ovMovDecidir');
}
function abrirDecidirMov(id){ const k = _movAchar_(id); if(k) _movAbrirCaixa_(k, true); }
function abrirDetalheMov(id){ const k = _movAchar_(id); if(k) _movAbrirCaixa_(k, false); }

function movEscolher(decisao){
  MOV_DECISAO = decisao;
  [['mdOpAprovar', 'APROVADA'], ['mdOpReprovar', 'REPROVADA']].forEach(p => {
    const b = $(p[0]);
    b.classList.toggle('on', decisao === p[1]);
    b.setAttribute('aria-checked', decisao === p[1] ? 'true' : 'false');
  });
  ver('mdBoxFolha', decisao === 'APROVADA');
  ver('mdBoxMotivo', decisao === 'REPROVADA');
  const btn = $('mdBtnConfirmar');
  btn.disabled = !decisao;
  btn.classList.toggle('ok', decisao === 'APROVADA');
  btn.classList.toggle('cr', decisao === 'REPROVADA');
  btn.textContent = decisao === 'APROVADA' ? 'Aprovar e avisar o gestor' : decisao === 'REPROVADA' ? 'Reprovar e avisar o gestor' : 'Escolha aprovar ou reprovar';
  if(decisao === 'REPROVADA') setTimeout(() => $('mdMotivo').focus(), 0);
}

async function confirmarDecidirMov(){
  limpa('mdMsg');
  const decisao = MOV_DECISAO;
  if(!decisao) return msg('mdMsg', 'Escolha aprovar ou reprovar.');

  const dados = { id: MOV_ATUAL, decisao: decisao };
  if(decisao === 'APROVADA'){
    const m = String($('mdFolha').value || '').match(/^(\d{4})-(\d{2})$/);
    if(!m) return msg('mdMsg', 'Informe a folha em que a mudança vai refletir.');
    dados.folhaCompetencia = m[2] + '/' + m[1];
  } else {
    dados.motivo = $('mdMotivo').value.trim();
    if(!dados.motivo) return msg('mdMsg', 'Informe o motivo trabalhista da reprovação.');
  }

  const btn = $('mdBtnConfirmar');
  ocupado(btn, 'Salvando…');
  try{
    const r = await chamar('srvMovDecidirDP', TOKEN, dados);
    fechar('ovMovDecidir');
    toast(r.mensagem || 'Decisão registrada.', 'suc');
    MOV_FILA = await chamar('srvMovFila', TOKEN);
    renderMov();
  }catch(e){
    msg('mdMsg', e.message);
  }finally{ livre(btn); }
}

/* ================= BENEFÍCIOS · [2026-10-21] cálculo corrigido (era a aba "Benefícios (teste)") =================
 * Calcular: prévia do mês pela API (BENEFICIOS.SIMULAR, só leitura), com dias úteis por UF e faltas por pessoa,
 *   comparada com o pedido já gravado; "Gravar pedido" grava pelo mesmo cálculo (BENEFICIOS.GERAR_PEDIDO).
 * Importar: relatório do fornecedor (ou pedido feito fora) por arquivo CSV/TXT ou colando do Excel, com conferência.
 * Conciliar: pedido × relatório (BENEFICIOS.CONCILIAR). Lotes e Regras: o que está gravado.
 * Gravar de novo (pedido ou lote) SUBSTITUI o anterior depois de confirmar: nunca soma duas vezes.
 * Tudo tem prefixo bx (ids, classes e funções internas) para não colidir com o resto do Portal. */
const renderBeneficios = (function(){
'use strict';

const TIPOS = ['Alimentação', 'Refeição', 'Mobilidade', 'Cesta'];
let S = null;
function proximoMes(){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function estadoInicial(){
  return { aba:'calcular', comp:proximoMes(), forn:'PLUXEE', tipo:'Alimentação', faltas:{}, uteis:{}, ufsUltimo:{},
    sim:{}, pedido:{}, conc:{}, regras:null, lotes:null, carregando:false, gravando:false, erro:'',
    leitura:null, txtRel:'', impOrigem:'RELATORIO', busca:'', filtro:'todos', limite:150 };
}

/* ---- utilidades ---- */
function el(id){ return document.getElementById(id); }
function r2(v){ return Math.round(v * 100) / 100; }
function moeda(v){ return brl(v || 0); } // brl() do Portal
function brD(iso){ if (!iso) return ''; const p = String(iso).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function compBr(c){ return c.slice(5) + '/' + c.slice(0,4); }
function normMat(s){ return String(s == null ? '' : s).replace(/\D/g, '').replace(/^0+/, ''); }
function normTxt(s){ return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase(); }
function lerValor(txt){
  let s = String(txt == null ? '' : txt).replace(/R\$|\s/g, '');
  if (!s) return null;
  if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isFinite(n) ? n : null;
}
const chip = (cls, t) => '<span class="bx-chip ' + cls + '">' + t + '</span>';
function motivoTxt(m){ return /sem valor na tabela|sem regra/i.test(m) ? 'Departamento sem valor na tabela (sem Sodexo ou ainda não cadastrado)' : String(m || ''); }
function porEm(r){ return r && r.em ? ' · gravado em ' + esc(r.em) + (r.por ? ' por ' + esc(String(r.por).split('@')[0]) : '') : ''; }

/* ---- dados ---- */
function uteisDoMes(){ const o = {}; Object.keys(S.uteis).forEach(k => { const p = k.split('|'); if (p[0] === S.comp) o[p[1]] = S.uteis[k]; }); return o; }
function faltasDoMes(){ return S.faltas[S.comp] || (S.faltas[S.comp] = {}); }
function chaveSim(){ return S.comp + '|' + JSON.stringify(uteisDoMes()); }
function sim(){ return S.sim[chaveSim()] || null; }
function chaveLote(){ return [S.comp, S.forn, S.tipo].join('|'); }
function pedidoGravado(){ return S.pedido[chaveLote()]; }
function pessoas(){ const R = sim(); return R ? R.linhas.concat(R.fora) : []; }
function loteDe(origem){
  return (S.lotes || []).find(l => l.competencia === compBr(S.comp) && String(l.fornecedor).toUpperCase() === S.forn &&
    normTxt(l.tipoBeneficio) === normTxt(S.tipo) && String(l.origem).toUpperCase() === origem) || null;
}
function invalidarGravados(){ S.pedido = {}; S.conc = {}; S.lotes = null; }

async function carregarSim(){
  if (S.carregando) return;
  S.carregando = true; S.erro = ''; render();
  try {
    const r = await chamar('srvBenSimular', TOKEN, { competencia: compBr(S.comp), diasUteisPorUF: uteisDoMes() });
    S.sim[chaveSim()] = r;
    S.ufsUltimo[S.comp] = r.ufs || [];
    await Promise.all([carregarPedido(), carregarLotes()]);
  } catch (e) { S.erro = e.message; }
  S.carregando = false;
  render();
}

// Pedido já gravado desta competência + fornecedor + tipo (do cálculo ou importado). Se foi gravado pelo cálculo
// e ninguém digitou falta ainda neste mês, as faltas gravadas voltam para a tabela.
async function carregarPedido(){
  const k = chaveLote();
  if (S.pedido[k] !== undefined) return;
  try {
    const r = await chamar('srvBenLoteLinhas', TOKEN, { competencia: compBr(S.comp), fornecedor: S.forn, tipoBeneficio: S.tipo, origem: 'PEDIDO' });
    const porMat = {};
    r.linhas.forEach(l => { const m = normMat(l.mat); if (m) porMat[m] = r2((porMat[m] || 0) + l.valor); });
    S.pedido[k] = { linhas: r.linhas, porMat: porMat, total: r.resumo.total, qtd: r.resumo.pessoas, resumo: r.resumo };
    const fal = faltasDoMes();
    if (!Object.keys(fal).length) r.linhas.forEach(l => { if (l.id && l.faltas > 0) fal[l.id] = l.faltas; });
  } catch (e) {
    S.pedido[k] = { erro: e.message, linhas: [], porMat: {}, total: 0, qtd: 0 };
  }
}

// uma consulta por vez: se a tela for redesenhada enquanto carrega, reaproveita a que já está a caminho
const EM_CURSO = {};
function umaVez(chave, fn){
  if (!EM_CURSO[chave]) EM_CURSO[chave] = fn().finally(() => { delete EM_CURSO[chave]; });
  return EM_CURSO[chave];
}
function carregarLotes(){
  if (S.lotes) return Promise.resolve();
  return umaVez('lotes', () => chamar('srvBenListarLotes', TOKEN).then(r => { S.lotes = r.lotes || []; }, e => { S.lotes = []; toast(e.message, 'err'); }));
}
function carregarRegras(){
  if (S.regras) return Promise.resolve();
  return umaVez('regras', () => chamar('srvBenListarRegras', TOKEN).then(r => { S.regras = r.regras || []; }, e => { S.regras = []; toast(e.message, 'err'); }));
}
function carregarConc(){
  const k = chaveLote();
  return umaVez('conc|' + k, () => chamar('srvBenConciliar', TOKEN, { competencia: compBr(S.comp), fornecedor: S.forn, tipoBeneficio: S.tipo })
    .then(r => { S.conc[k] = r; }, e => { S.conc[k] = { erro: e.message }; })).then(render);
}

/* ---- cálculo com as faltas digitadas (o resto vem pronto da API, mesma conta do GERAR_PEDIDO) ---- */
function comFaltas(l){
  const fal = Math.min(l.total, Math.max(0, Number(faltasDoMes()[l.id] || 0)));
  const total = l.total - fal;
  const valor = r2(l.tipoValor === 'FIXO' ? (l.dias ? l.valorRegra * total / l.dias : 0) : l.valorRegra * total);
  return { fal: fal, total: total, valor: valor };
}
function linhasCalculadas(){
  const R = sim(); if (!R) return [];
  const P = pedidoGravado();
  return R.linhas.map(l => {
    const c = comFaltas(l);
    const ped = P && !P.erro ? P.porMat[normMat(l.mat)] : undefined;
    return Object.assign({}, l, { fal: c.fal, totalF: c.total, valorF: c.valor, ped: ped,
      dif: ped === undefined ? null : r2(c.valor - ped) });
  });
}

/* ---- telas ---- */
function etapas(){
  const ped = pedidoGravado(), rel = loteDe('RELATORIO'), conc = S.conc[chaveLote()];
  const passos = [['Calcular', !!sim()], ['Pedido gravado', !!(ped && ped.qtd)], ['Relatório importado', !!rel], ['Conferido', !!(conc && conc.tudoConferido)]];
  el('bxEtapas').innerHTML = passos.map((p, i) => (i ? '<span class="seta" aria-hidden="true">→</span>' : '') +
    '<span class="' + (p[1] ? 'on' : '') + '">' + (p[1] ? '✓ ' : '') + p[0] + '</span>').join('');
}

function render(){
  if (!S) S = estadoInicial();
  document.querySelectorAll('#bxAbas .sub').forEach(b => b.classList.toggle('on', b.dataset.bx === S.aba));
  el('bxComp').value = S.comp; el('bxForn').value = S.forn; el('bxTipo').value = S.tipo;
  etapas();
  const f = { calcular:telaCalcular, importar:telaImportar, conciliar:telaConciliar, lotes:telaLotes, regras:telaRegras }[S.aba];
  el('bxTela').innerHTML = f();
  ligar();
}

  if (S.forn !== 'PLUXEE') return '<div class="bx-aviso warn"><b>!</b><div>A tabela de regras é a da <b>Sodexo (Pluxee)</b>. Vale-transporte (RioCard, Jaé) é por pessoa, conforme o trajeto, e ainda não é calculado aqui: importe o pedido e o relatório na aba <b>Importar</b> para conciliar.</div></div>';

}

function lerTexto(txt){
  const ls = String(txt).replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (ls.length < 2) throw new Error('Precisa de uma linha de cabeçalho e pelo menos uma linha de dados.');
  const sep = ls[0].indexOf('\t') > -1 ? '\t' : ls[0].indexOf(';') > -1 ? ';' : ',';
  const cab = ls[0].split(sep).map(normTxt);
  const ach = (nomes) => { for (const n of nomes) { const i = cab.indexOf(n); if (i > -1) return i; } return -1; };
  const cMat = ach(['MATRICULA', 'FUNCIONARIO']), cCpf = ach(['CPF']), cNome = ach(['NOME', 'COLABORADOR', 'NOME DO FUNCIONARIO']), cVal = ach(['VALOR', 'VALOR DA CARGA', 'VALOR TOTAL', 'ALIMENTACAO', 'REFEICAO']);
  if (cMat < 0 && cCpf < 0) throw new Error('Não achei a coluna MATRÍCULA nem CPF no cabeçalho.');
  if (cNome < 0) throw new Error('Não achei a coluna NOME no cabeçalho.');
  if (cVal < 0) throw new Error('Não achei a coluna VALOR no cabeçalho.');
  const porMat = {}, porCpf = {};
  pessoas().forEach(p => { const m = normMat(p.mat); if (m) porMat[m] = p; const c = String(p.cpf || '').replace(/\D/g, ''); if (c) porCpf[c.padStart(11, '0')] = p; });
  const linhas = ls.slice(1).map((l, i) => {
    const p = l.split(sep);
    const mat = cMat > -1 ? String(p[cMat] || '').trim() : '', cpf = cCpf > -1 ? String(p[cCpf] || '').replace(/\D/g, '') : '';
    const c = (mat && porMat[normMat(mat)]) || (cpf && porCpf[cpf.padStart(11, '0')]) || null;
    return { n:i + 2, mat:mat, cpf:cpf, nome:String(p[cNome] || '').trim(), bruto:String(p[cVal] || '').trim(), valor:lerValor(p[cVal]), achou:!!c };
  }).filter(l => l.nome);
  if (!linhas.length) throw new Error('Nenhuma linha com nome.');
  return { sep:sep, colunas: ls[0].split(sep).map(s => s.trim()), linhas:linhas };
}

async function gravarPedido(){
  if (S.gravando || !sim()) return;
  const dados = { competencia: compBr(S.comp), fornecedor: S.forn, tipoBeneficio: S.tipo, diasUteisPorUF: uteisDoMes(), faltas: faltasDoMes() };
  S.gravando = true; render();
  try {
    let r = await chamar('srvBenGerarPedido', TOKEN, dados);
    if (r && r.precisaConfirmar) {
      const e = r.existente;
      if (!confirm('Já existe um pedido ' + S.forn + ' ' + S.tipo + ' de ' + compBr(S.comp) + ' com ' + e.pessoas + ' pessoas (' + moeda(e.total) + ')' +
        (e.em ? ', gravado em ' + e.em : '') + '.\n\nGravar o pedido do cálculo SUBSTITUI esse pedido. Continuar?')) { S.gravando = false; render(); return; }
      dados.substituir = true;
      r = await chamar('srvBenGerarPedido', TOKEN, dados);
    }
    invalidarGravados();
    await Promise.all([carregarPedido(), carregarLotes()]);
    toast(r.mensagem + ' Total ' + moeda(r.total) + '.', 'suc');
  } catch (e) { toast(e.message, 'err'); }
  S.gravando = false; render();
}

async function importarLote(){
  if (S.gravando || !S.leitura) return;
  const dados = { competencia: compBr(S.comp), fornecedor: S.forn, tipoBeneficio: S.tipo, origem: S.impOrigem,
    linhas: S.leitura.linhas.map(l => ({ matricula: l.mat, cpf: l.cpf, nome: l.nome, valor: l.valor })) };
  S.gravando = true; render();
  try {
    const pdf = el('bxPdf');
    if (pdf && pdf.files && pdf.files[0]) { const f = await lerArquivo(pdf); dados.arquivoBase64 = f.base64; dados.arquivoNome = f.nome; dados.arquivoTipo = f.tipo; }
    let r = await chamar('srvBenImportarLote', TOKEN, dados);
    if (r && r.precisaConfirmar) {
      const e = r.existente;
      if (!confirm('Já existe ' + (S.impOrigem === 'PEDIDO' ? 'pedido' : 'relatório') + ' ' + S.forn + ' ' + S.tipo + ' de ' + compBr(S.comp) + ' com ' + e.pessoas + ' pessoas (' + moeda(e.total) + ')' +
        (e.em ? ', gravado em ' + e.em : '') + '.\n\nImportar este arquivo SUBSTITUI o anterior. Continuar?')) { S.gravando = false; render(); return; }
      dados.substituir = true;
      r = await chamar('srvBenImportarLote', TOKEN, dados);
    }
    invalidarGravados();
    S.leitura = null; S.txtRel = '';
    S.aba = 'conciliar';
    await Promise.all([carregarPedido(), carregarLotes()]);
    toast(r.mensagem, 'suc');
  } catch (e) { toast(e.message, 'err'); }
  S.gravando = false; render();
}

async function importarRegras(){
  const id = normalizarSheetIdGoogle(el('bxSheetRegras').value);
  if (!id) return toast('Cole o link ou o ID da planilha com as regras.', 'err');
  if (!confirm('Importar estas regras SUBSTITUI a tabela de valores inteira (' + (S.regras || []).length + ' departamentos hoje). Continuar?')) return;

}

/* ---- eventos ---- */
let tBusca = null; // espera a pessoa parar de digitar para redesenhar a tabela
function ligar(){
  const raiz = el('bxTela');
  const on = (id, ev, fn) => { const e = el(id); if (e) e.addEventListener(ev, fn); };
  raiz.querySelectorAll('[data-bxir]').forEach(e => e.addEventListener('click', (ev) => { ev.preventDefault(); S.aba = e.dataset.bxir; render(); }));
  raiz.querySelectorAll('[data-bxfiltro]').forEach(e => e.addEventListener('click', () => { S.filtro = e.dataset.bxfiltro; S.limite = 150; render(); }));
  raiz.querySelectorAll('[data-bximp]').forEach(e => e.addEventListener('click', () => { S.impOrigem = e.dataset.bximp; render(); }));
  raiz.querySelectorAll('input[data-bxuf]').forEach(e => e.addEventListener('change', () => {
    S.uteis[S.comp + '|' + e.dataset.bxuf] = Math.max(0, Math.min(31, Number(e.value) || 0)); render();
  }));
  raiz.querySelectorAll('input.bx-falta').forEach(e => e.addEventListener('change', () => {
    faltasDoMes()[e.dataset.bxid] = Math.max(0, Math.min(31, Number(e.value) || 0)); render();
    const n = raiz.querySelector('input.bx-falta[data-bxid="' + e.dataset.bxid + '"]'); if (n) n.focus();
  }));
  // [2026-10-26] filtra enquanto digita (antes só no Enter, e apagar o texto não desfazia o filtro)
  on('bxBusca', 'input', (e) => {
    const v = e.target.value;
    clearTimeout(tBusca);
    tBusca = setTimeout(() => { S.busca = v; S.limite = 150; render(); const b = el('bxBusca'); if (b) { b.focus(); b.setSelectionRange(v.length, v.length); } }, 300);
  });
  on('bxMais', 'click', () => { S.limite += 300; render(); });
  on('bxBtnCalc', 'click', () => { carregarSim(); });
  on('bxBtnPedido', 'click', gravarPedido);
  on('bxBtnCopiar', 'click', () => {
    const linhas = linhasCalculadas().filter(r => r.valorF > 0);
    const tsv = 'MATRICULA\tCPF\tNOME\tVALOR\n' + linhas.map(r => [r.mat, r.cpf, r.nome, r.valorF.toFixed(2).replace('.', ',')].join('\t')).join('\n');
    navigator.clipboard.writeText(tsv).then(() => toast('Copiado. Cole no Sheets ou no Excel.', 'suc'), () => toast('O navegador não deixou copiar.', 'err'));
  });
  on('bxConcDeNovo', 'click', () => { delete S.conc[chaveLote()]; render(); });
  on('bxTxtRel', 'input', (e) => { S.txtRel = e.target.value; });
  on('bxArq', 'change', (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { S.txtRel = String(r.result); try { S.leitura = lerTexto(S.txtRel); } catch (err) { S.leitura = null; toast(err.message, 'err'); } render(); }; r.readAsText(f);
  });
  on('bxBtnLer', 'click', () => { S.txtRel = el('bxTxtRel').value; try { S.leitura = lerTexto(S.txtRel); render(); } catch (err) { toast(err.message, 'err'); } });
  on('bxBtnVoltarLeitura', 'click', () => { S.leitura = null; render(); });
  on('bxBtnConfirmar', 'click', importarLote);
  on('bxBtnRegras', 'click', importarRegras);
}

// controles fixos do topo do módulo (ligados uma vez só)
let ligado = false;
function ligarTopo(){
  if (ligado) return; ligado = true;
  // competências: 3 meses para trás e 3 para frente do mês atual
  const opc = [], d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 3);
  for (let i = 0; i < 7; i++) { const v = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); opc.push('<option value="' + v + '">' + compBr(v) + '</option>'); d.setMonth(d.getMonth() + 1); }
  el('bxComp').innerHTML = opc.join('');
  el('bxTipo').innerHTML = TIPOS.map(t => '<option>' + esc(t) + '</option>').join('');
  document.querySelectorAll('#bxAbas .sub').forEach(b => b.addEventListener('click', () => { S.aba = b.dataset.bx; render(); }));
  ['bxComp', 'bxForn', 'bxTipo'].forEach(id => el(id).addEventListener('change', async () => {
    S.comp = el('bxComp').value; S.forn = el('bxForn').value; S.tipo = el('bxTipo').value; S.leitura = null; S.limite = 150;
    if (!sim()) { carregarSim(); return; }
    await carregarPedido();
    render();
  }));
  el('bxReset').addEventListener('click', () => { S = estadoInicial(); render(); carregarSim(); });
}

return function(){ ligarTopo(); const primeiraVez = !S; render(); if (primeiraVez) carregarSim(); };
})();

function normalizarSheetIdGoogle(valor){
  const raw = String(valor || '').trim();
  if(!raw) return '';

  const match = raw.match(/\/d\/([A-Za-z0-9-_]{10,})/i) || raw.match(/[?&]key=([A-Za-z0-9-_]{10,})/i);
  return match ? match[1] : raw;
}

  if (RAIOX.ocupado) return toast('Aguarde a importação terminar.');
  fechar('ovRaioX');
}

function raioxEtapa(n){
  [1, 2, 3].forEach(function(i){ ver('raioxEtapa' + i, i === n); });
  document.querySelectorAll('#raioxPassos li').forEach(function(li){
    const p = Number(li.getAttribute('data-p'));
    li.className = p === n ? 'on' : (p < n ? 'feito' : '');
  });
  raioxAtualizarBotoes();
}

function raioxFonte(f){
  RAIOX.fonte = f;
  $('raioxFonteArq').classList.toggle('on', f === 'arquivo');
  $('raioxFonteGoo').classList.toggle('on', f === 'google');

  ver('raioxPainelGoo', f === 'google');

// Trocou de arquivo/link: o que foi validado antes não vale mais.

  limpa('raioxMsg');

function raioxTamanho(bytes){
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB';
}

function raioxArquivoEscolhido(){
  const f = $('raioxArquivo').files && $('raioxArquivo').files[0];
  $('raioxDrop').classList.toggle('com-arquivo', !!f);
  $('raioxDropTit').textContent = f ? f.name : 'Arraste o arquivo aqui ou clique para escolher';
  $('raioxDropSub').textContent = f ? raioxTamanho(f.size) + ' · clique para trocar' : 'Excel (.xlsx) ou CSV exportado do Alterdata';
  raioxMudouOrigem();

function raioxPrepararDrop(){
  if (RAIOX.dropPronto) return;
  RAIOX.dropPronto = true;
  const zona = $('raioxDrop');
  ['dragenter', 'dragover'].forEach(function(ev){
    zona.addEventListener(ev, function(e){ e.preventDefault(); zona.classList.add('arrastando'); });
  });
  ['dragleave', 'drop'].forEach(function(ev){
    zona.addEventListener(ev, function(e){ e.preventDefault(); zona.classList.remove('arrastando'); });
  });
  zona.addEventListener('drop', function(e){
    const arqs = e.dataTransfer && e.dataTransfer.files;
    if (!arqs || !arqs.length) return;
    if (!/\.(xlsx|xls|csv)$/i.test(arqs[0].name)) return msg('raioxMsg', 'Use um arquivo .xlsx ou .csv.');
    $('raioxArquivo').files = arqs;
    raioxArquivoEscolhido();
  });
}

function raioxAtualizarBotoes(){
  const temArquivo = !!($('raioxArquivo').files && $('raioxArquivo').files[0]);
  const temLink = !!normalizarSheetIdGoogle($('raioxSheetId').value);
  $('raioxBtnPreview').disabled = RAIOX.ocupado || !(RAIOX.fonte === 'arquivo' ? temArquivo : temLink);
  $('raioxBtnImportar').disabled = RAIOX.ocupado || !RAIOX.validado || !$('raioxConfirmo').checked;
  $('raioxBtnVoltar').disabled = RAIOX.ocupado;

}

function raioxVoltar(){

function raioxErroAmigavel(m){
  const t = String(m || '');
  if (/permission to access|permissão para acessar|não tem permissão/i.test(t)) {
    return 'Sem acesso a essa planilha. Compartilhe com autodppessoal@cieds.org.br (pode ser como leitor) e valide de novo.';
  }
  if (/illegal spreadsheet id|ID da planilha do Raio-X inválido|not found|não encontrad[oa] o arquivo/i.test(t)) {
    return 'Não achei essa planilha. Confira o link ou o ID colado.';
  }
  if (/falha ao acessar o documento|failed while accessing document/i.test(t)) {
    return 'Não consegui abrir esse arquivo. Salve como Excel (.xlsx) e tente de novo.';
  }
  return t;
}

function lerArquivoRaioX(input){
  return new Promise(function(resolve, reject){
    const file = input && input.files && input.files[0];
    if (!file) {
      resolve(null);
      return;
    }
    const reader = new FileReader();
    reader.onload = function () {
      resolve({
        nome: file.name,
        tamanho: file.size,
        dataUri: reader.result
      });
    };
    reader.onerror = function () {
      reject(new Error('Não foi possível ler a planilha selecionada.'));
    };
    reader.readAsDataURL(file);
  });
}

/* ================= FÉRIAS: AGENDADAS (painel de acompanhamento) ================= */

let AGENDADAS_CACHE = [];
let EF_ID_ATUAL = '';

/* [2026-10-15] Carrega todas de uma vez (o filtro de mês é feito na tela), agrupa por mês de início,
 * caixinha só em quem ainda não foi ao financeiro, "Enviar ao financeiro" no botão e "Estornar" no menu ⋮. */
let AGENDADAS_CARREGADAS = false;

async function carregarAgendadas(){
  // Já carregada (pela pré-carga ou antes): mostra na hora e atualiza em seguida.
  if(AGENDADAS_CARREGADAS) renderAgendadas(AGENDADAS_CACHE);
  else $('listaAgendadas').innerHTML = '<div class="resc-carregando"><div class="esq"></div><div class="esq"></div><div class="esq"></div></div>';
