function mostrarErroPortal(texto){
  const el = $('loginMsg');
  if(el){
    el.textContent = texto;
    el.className = 'msg on err';
    return;
  }
  if(typeof window !== 'undefined' && typeof window.alert === 'function'){ window.alert(texto); }
}

function chamar(fn){
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(ok, falha){
    if(!google || !google.script || !google.script.run){
      falha(new Error('O portal não conseguiu acessar o projeto publicado. Verifique se a API e o Portal foram implantados corretamente.'));
      return;
    }

    if(typeof google.script.run[fn] !== 'function'){
      falha(new Error('Função do servidor não encontrada no projeto publicado: ' + String(fn) + '. Reimplante o projeto atual da API/Portal e confirme a versão publicada.'));
      return;
    }

    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function(e){ falha(new Error(e && e.message ? e.message : String(e))); })
      [fn].apply(null, args);
  });
}

function $(id){ return document.getElementById(id); }
function ver(id, s){ const e = $(id); if(e) e.style.display = s ? '' : 'none'; }
function listaSegura(v){ return Array.isArray(v) ? v.filter(Boolean) : []; }

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function brl(n){ return 'R$ ' + Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function brl0(n){ return 'R$ ' + Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 }); }

function ini(nome){
  const p = String(nome || '').trim().split(/\s+/);
  if(!p[0]) return '?';
  return ((p[0][0] || '') + (p.length > 1 ? (p[p.length-1][0] || '') : '')).toUpperCase();
}

function dBR(iso){
  if(!iso) return '—';
  const p = String(iso).split('-');
  return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : iso;
}

function mesBR(m){
  if(!m) return '';
  const [a, mm] = m.split('-');
  const nomes = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  return nomes[Number(mm) - 1] + '/' + a;
}

function hojeISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function lerArquivo(input){
  return new Promise(function(ok, falha){
    const f = input.files && input.files[0];
    if(!f){ ok(null); return; }
    const r = new FileReader();
    r.onload = function(){ ok({ base64: String(r.result).split(',')[1], nome: f.name, tipo: f.type || 'application/pdf' }); };
    r.onerror = function(){ falha(new Error('Não consegui ler o arquivo.')); };
    r.readAsDataURL(f);
  });
}

function lerArquivos(input){
  const arquivos = input.files ? Array.from(input.files) : [];
  return Promise.all(arquivos.map(function(f){
    return new Promise(function(ok, falha){
      const r = new FileReader();
      r.onload = function(){ ok({ base64: String(r.result).split(',')[1], nome: f.name, tipo: f.type || 'application/pdf' }); };
      r.onerror = function(){ falha(new Error('Não consegui ler o arquivo ' + f.name + '.')); };
      r.readAsDataURL(f);
    });
  }));
}

function toast(m, t){
  const e = $('toast');

  if(!e){
    console.log('[TOAST]', m);
    desprocessarBotoes();
    return;
  }

  e.textContent = m;
  e.className = 'toast on ' + (t || '');

  clearTimeout(window._t);
  window._t = setTimeout(function(){
    e.classList.remove('on');
  }, 4800);

  desprocessarBotoes();
}

// Feedback visual imediato nos botões de ação das listas (Confirmar, Registrar, Enviar,
// Verificar assinatura, Baixar e arquivar, Cancelar envio etc.), que antes não davam nenhum
// sinal de clique — causava clique duplo por parecer que não funcionou. Toda linha de lista
// (Fila, Abonos, Afastamentos, Rescisão, Homologação, Recibos, Trabalhista, Movimentação,
// Benefícios) é sempre renderizada dentro de um <div class="item">, então esse é o escopo —
// cobre os botões independente do nome da div de ações usada (.acoes, .recibo-acoes, ou sem
// classe, como em Homologação). Não interfere nos botões de modal, que já têm feedback
// próprio via ocupado()/livre().
function desprocessarBotoes(){
  document.querySelectorAll('.item .b.processando').forEach(b => b.classList.remove('processando'));
}

document.addEventListener('click', function(ev){
  const b = ev.target.closest('.item .b');
  if(!b || b.classList.contains('processando')) return;
  b.classList.add('processando');
  setTimeout(() => b.classList.remove('processando'), 8000); // rede fora do ar / esqueceu de chamar toast()
}, true);

function msg(id, texto, tipo){
  const e = $(id);
  e.textContent = texto;
  e.className = 'msg on ' + (tipo || 'err');
}

function _svgRostinho_(conteudo){
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="32" cy="32" r="30" fill="#ffffff"/>' +
    conteudo +
  '</svg>';
}

function _rostinhoPorId_(id){
  return ROSTINHOS_DISPONIVEIS.find(r => r.id === id) || ROSTINHOS_DISPONIVEIS[0];
}

function avatarSalvo(){
  try{ return localStorage.getItem(K_AVATAR) || ROSTINHOS_DISPONIVEIS[0].id; }catch(e){ return ROSTINHOS_DISPONIVEIS[0].id; }
}

function aplicarAvatar(id){
  const el = $('avatarAtual');
  const r = _rostinhoPorId_(id);
  if(el) el.innerHTML = _svgRostinho_(r.conteudo);
  try{ localStorage.setItem(K_AVATAR, r.id); }catch(e){}
}

}

function fechar(id){ $(id).classList.remove('on'); }
function ocupado(b, t){ b.disabled = true; b._a = b.innerHTML; b.innerHTML = '<span class="gira"></span>' + t; }
function livre(b){ b.disabled = false; if(b._a) b.innerHTML = b._a; }

/* ---------- início ---------- */
window.addEventListener('DOMContentLoaded', function(){
  aplicarAvatar(avatarSalvo());

  const e = localStorage.getItem(K_EMAIL);
  if(e) $('inEmail').value = e;

  ['inEmail','inSenha'].forEach(id => {
    const el = $(id);
    if(el) el.addEventListener('keydown', ev => { if(ev.key === 'Enter') entrar(); });
  });

  const btnEntrar = $('btnEntrar');
  if(btnEntrar && !btnEntrar.onclick) btnEntrar.addEventListener('click', entrar);
  const btnCodigo = $('btnCodigo');
  if(btnCodigo && !btnCodigo.onclick) btnCodigo.addEventListener('click', pedirCodigo);
  const btnSenha = $('btnSenha');
  if(btnSenha && !btnSenha.onclick) btnSenha.addEventListener('click', criarSenha);

  document.querySelectorAll('.ov').forEach(o => {
    o.addEventListener('click', ev => { if(ev.target === o) o.classList.remove('on'); });
  });

  const t = localStorage.getItem(K_TOKEN);
  if(t){ TOKEN = t; carregar(); }
});

async function entrar(){
  limpa('loginMsg');
  const email = $('inEmail').value.trim().toLowerCase();
  const senha = $('inSenha').value;

  if(!email || !senha) return msg('loginMsg', 'Informe e-mail e senha.');

  const b = $('btnEntrar');
  ocupado(b, 'Entrando…');

  try{
    MODULOS_USUARIO = null; // vem de novo no login (renderUsuario)
    // [PERF 2026-09-24] O login volta sem o painel de Férias: o painel e os outros módulos são
    // pedidos logo depois, todos juntos (ver carregar). Antes, o painel vinha dentro do login e
    // os módulos só eram pedidos depois dele.
    const r = await chamar('srvLogin', email, senha, true);
    TOKEN = r.token;
    localStorage.setItem(K_TOKEN, TOKEN);
    localStorage.setItem(K_EMAIL, email);
    $('inSenha').value = '';

    renderUsuario(r.usuario);

    ver('telaLogin', false);
    ver('topoCentro', true);
    ver('btnMenu', true);

    if(r.painel){
      // servidor antigo, que ainda manda o painel de Férias junto com o login
      P = r.painel;
      montar();
      carregarBadgesExtras();
      ir(ABA);
    } else if(r.semFerias){
      // a pessoa entrou, mas não cuida de férias: mostra os outros módulos dela ou,
      // se não tiver nenhum, o aviso amigável de "sem módulo"
      await _entrarSemFerias_(r.usuario);
    } else {
      await carregar(r.usuario);
    }
  }catch(e){
    const msgTxt = e && e.message ? e.message : 'Não foi possível entrar no sistema.';
    mostrarErroPortal(msgTxt);
  }finally{ livre(b); }
}

 */

    },
    render(){ if(RESC_SUBABA !== 'homologacao') renderResc(); } },

function _badgeModulo_(id, n){
  if(n){ $(id).textContent = n; ver(id, true); } else ver(id, false);
}

// "Usuário sem permissão para executar a ação" é a mensagem padrão do gate de permissão
// (Ferias.js, executar()): é a ÚNICA razão pra uma aba ficar escondida de propósito.
// Qualquer outro erro (rede, cold start, timeout) é falha passageira, não falta de acesso.
function _semPermissao_(motivo){ return /sem permiss(ã|a)o/i.test(String(motivo || '')); }

/**
 * Carrega os módulos além de Férias (Afastamentos, Rescisão, Processos Trabalhistas,
 * Movimentações, Benefícios, Admissões), todos em paralelo.
 *
 * [PERF 2026-09-24] Quando a API informa os módulos da pessoa, as abas aparecem NA HORA e cada
 * uma se preenche quando os seus dados chegam. Antes, a aba só aparecia depois que o módulo
 * respondia, e a carga só começava depois do painel de Férias. Se um módulo falhar por algo
 * passageiro, a aba continua no menu com o aviso e o botão "Tentar de novo", em vez de sumir.
 * Sem a lista de módulos (API antiga), segue o jeito antigo: a aba só aparece se o pedido der certo.
 */
async function carregarBadgesExtras(){
  const geracao = ++CARGA_GERACAO;
  CARGA_MODULOS_EM_CURSO = true;
  RESC_SO_HOMOLOG = false;
  const mods = _modulosConhecidos_();

  const pedidos = MODULOS_EXTRAS.map(m => {
    m.limpar();
    if(!_temModulo_(m.mod)){
      // Quando a API informa os módulos, só pede o que a pessoa tem: cada pedido negado
      // custava uma ida inteira à API (e uma linha de auditoria).
      CARGA_MOD[m.mod] = { estado: 'sem', erro: '' };
      ver(m.aba, false);
      return Promise.resolve({ m: m, estado: 'sem' });
    }
    if(mods) ver(m.aba, true);
    return _carregarModuloExtra_(m, geracao);
  });

  // Sem a Rescisão inteira, a pessoa ainda pode ter só a seção Homologação
  // (MODULOS = "RESCISAO.HOMOLOGACAO"). Aí a aba Rescisão aparece só com essa seção.
  if(mods && mods.indexOf('RESCISAO.HOMOLOGACAO') > -1 && !_temModulo_('RESCISAO')){
    RESC_SO_HOMOLOG = true;
    ver('abaResc', true);
    ver('nResc', false);
  }
  _aplicarModoRescisao_();

  const res = await Promise.all(pedidos);
  if(geracao !== CARGA_GERACAO) return; // outra carga começou depois desta (ex.: saiu e entrou)
  CARGA_MODULOS_EM_CURSO = false;

  const falhas = res.filter(r => r.estado === 'erro').map(r => r.m.rotulo);
  if(falhas.length){
    toast('Não consegui carregar: ' + falhas.join(', ') + '. Pode ser falha passageira' +
      (mods ? ': abra a aba e clique em "Tentar de novo".' : ': recarregue a página.'), 'err');
  }

  // API antiga, sem a lista de módulos: descobre testando a lista da Homologação.
  const resc = res.find(r => r.m.mod === 'RESCISAO');
  if(!mods && resc && resc.estado === 'sem'){
    try{
      RESC_HOMOLOGACAO = await chamar('srvRescHomologacaoLista', TOKEN);
      RESC_SO_HOMOLOG = true;
      ver('abaResc', true);
      ver('nResc', false);
    }catch(e){ /* sem acesso nenhum à Rescisão: a aba continua escondida */ }
    _aplicarModoRescisao_();
  }

  // Atualiza o quadro com os módulos efetivamente liberados, sem exigir que a pessoa navegue.
  if(ABA === 'painelgeral') renderPainelGeral();
}

/** Pede os dados de UM módulo e atualiza a aba dele. Devolve { m, estado }. */
async function _carregarModuloExtra_(m, geracao){
  CARGA_MOD[m.mod] = { estado: 'carregando', erro: '' };
  if(ABA === m.tela) m.render(); // aba aberta: mostra "Carregando…" (ex.: ao tentar de novo)

  const tokenUsado = TOKEN;
  try{
    const v = await chamar(m.fn, tokenUsado);
    if(geracao !== CARGA_GERACAO) return { m: m, estado: 'descartado' };
    m.aplicar(v);
    CARGA_MOD[m.mod] = { estado: 'ok', erro: '' };
    ver(m.aba, true);
  }catch(e){
    if(geracao !== CARGA_GERACAO) return { m: m, estado: 'descartado' };
    const texto = (e && e.message) || String(e);
    const sessao = _semPermissao_(texto) ? '' : _tratarSessaoVencida_(e, tokenUsado);
    if(sessao === 'login') return { m: m, estado: 'descartado' };
    if(sessao === 'novo') return _carregarModuloExtra_(m, geracao);
    if(_semPermissao_(texto)){
      CARGA_MOD[m.mod] = { estado: 'sem', erro: '' };
      ver(m.aba, false);
    }else{
      CARGA_MOD[m.mod] = { estado: 'erro', erro: texto };
      console.error('[carregarBadgesExtras] ' + m.rotulo + ':', e);
    }
  }

  if(ABA === m.tela) m.render();
  if(ABA === 'painelgeral') renderPainelGeral();
  return { m: m, estado: CARGA_MOD[m.mod].estado };
}

/** Botão "Tentar de novo" dentro da aba de um módulo que falhou. */
async function recarregarModulo(mod){
  const m = MODULOS_EXTRAS.find(x => x.mod === mod);
  if(!m) return;
  const r = await _carregarModuloExtra_(m, CARGA_GERACAO);
  if(r.estado === 'erro') toast('Ainda não consegui carregar ' + m.rotulo + '. Tente de novo em instantes.', 'err');
}

/** Aba de módulo aberta antes de os dados chegarem, ou depois de uma falha. */
function _moduloSemDados_(mod, listaId){
  const el = $(listaId);
  if(!el) return;
  const c = CARGA_MOD[mod] || {};
  if(c.estado === 'erro'){
    el.innerHTML = '<div class="vazio">Não consegui carregar agora' + (c.erro ? ': ' + esc(c.erro) : '.') +
      '<br><br><button class="b ver" onclick="recarregarModulo(\'' + mod + '\')">Tentar de novo</button></div>';
  }else{
    el.innerHTML = '<div class="vazio">Carregando…</div>';
  }
}

function _modulosConhecidos_(){ return Array.isArray(MODULOS_USUARIO) ? MODULOS_USUARIO : null; }

/** true se a pessoa tem o módulo, ou se a API não informou os módulos (aí o pedido testa). */
function _temModulo_(modulo){
  const mods = _modulosConhecidos_();
  return !mods || mods.indexOf('*') > -1 || mods.indexOf(modulo) > -1;
}

/**
 * Quem só tem a seção Homologação vê a tela direto como "Homologação da rescisão": sem as
 * outras etapas da Rescisão, sem a fileira com um botão só e sem os botões de nova rescisão.
 */
function _aplicarModoRescisao_(){
  document.querySelectorAll('#rescSubnav .sub').forEach(b => {
    b.style.display = (!RESC_SO_HOMOLOG || b.dataset.sub === 'homologacao') ? '' : 'none';
  });
  ver('rescSubnav', !RESC_SO_HOMOLOG);
  ver('rescAcoes', !RESC_SO_HOMOLOG);
  const titulo = $('rescTitulo'), sub = $('rescSubtitulo'), nomeAba = $('abaRescNome');
  if(titulo) titulo.textContent = RESC_SO_HOMOLOG ? 'Homologação da rescisão' : 'Rescisão';
  if(nomeAba) nomeAba.textContent = RESC_SO_HOMOLOG ? 'Homologação' : 'Rescisão';
  if(sub) sub.textContent = RESC_SO_HOMOLOG
    ? 'Confira a documentação de cada desligamento, envie para assinatura no Autentique e arquive o que já foi assinado.'
    : 'Da solicitação ao arquivamento da documentação assinada.';
  if(RESC_SO_HOMOLOG) RESC_SUBABA = 'homologacao';
}

/**
 * Entrada de quem não cuida de Férias. Carrega os outros módulos e mostra o menu só com eles.
 * Sem nenhum módulo, mantém o aviso de "sem módulo". Antes, quem não tinha Férias sempre caía
 * nesse aviso, mesmo tendo outro módulo liberado.
 */
async function _entrarSemFerias_(usuario, pedidoEmCurso){
  P = null;
  FERIAS_CARREGANDO = false;
  ver('topoCentro', false); // a busca do topo é de Férias
  const pedido = pedidoEmCurso || carregarBadgesExtras();
  // [PERF 2026-09-24] Com a lista de módulos da pessoa, as abas já estão no menu: abre na hora e
  // cada aba se preenche quando os dados chegam. Sem a lista (API antiga), espera tudo, como antes.
  if(!_modulosConhecidos_()){
    ver('telaLoading', true);
    try{ await pedido; }
    finally{ ver('telaLoading', false); }
  }

  const abasModulos = ['abaResc', 'abaAfast', 'abaMov', 'abaProcTrab', 'abaBen', 'abaAdm']
    .map(id => $(id))
    .filter(el => el && el.style.display !== 'none');

  if(!abasModulos.length){
    semModuloFerias({ nome: (usuario && usuario.nome) || '' });
    return;
  }

  ver('semModulo', false);
  $('kpis').innerHTML = '';
  ver('abaFerias', false);
  // Com um módulo só, o Painel Geral ficaria vazio: abre direto no módulo e esconde o painel.
  ver('abaPainelGeral', abasModulos.length > 1);
  ver('abas', true);
  ver('app', true);
  ir(abasModulos.length === 1 ? abasModulos[0].dataset.aba : 'painelgeral');
}

function semModuloFerias(usuario){
  ver('abas', false);
  ver('app', true);
  $('kpis').innerHTML = '';
  document.querySelectorAll('#app section').forEach(s => s.style.display = 'none');
  const wrap = document.querySelector('#app .wrap');
  if(wrap){
    let aviso = document.getElementById('semModulo');
    if(!aviso){
      aviso = document.createElement('div');
      aviso.id = 'semModulo';
      aviso.className = 'vazio';
      wrap.prepend(aviso);
    }
    aviso.style.display = '';
    aviso.innerHTML = 'Olá, ' + esc(usuario.nome.split(' ')[0]) + '! 👋<br><br>' +
      'Sua conta está ativa, mas você ainda não foi vinculado a nenhum módulo do DP. ' +
      'Fale com o administrador para liberar os módulos que você cuida.<br><br>' +
      '<span class="sair" style="cursor:pointer;text-decoration:underline;color:var(--azul)" onclick="sair()">↩ Sair da conta</span>';
  }
}

/** Limpa tudo da sessão atual e mostra o login. Usada ao sair e quando a sessão vence. */
function _encerrarSessaoNaTela_(){
  _homologPollParar_();
  _recibosPollParar_();
  // não deixa módulos nem a lista da pessoa anterior para quem entrar em seguida nesta página
  MODULOS_USUARIO = null;
  RESC_HOMOLOGACAO = null;
  HOMOLOG_ERRO = '';
  RESC_SO_HOMOLOG = false;

  CARGA_TELA++;
  CARGA_GERACAO++;
  CARGA_MOD = {};
  CARGA_MODULOS_EM_CURSO = false;
  FERIAS_CARREGANDO = false;
  FERIAS_ERRO = '';

  TOKEN = ''; P = null;
  ver('telaLoading', false);
  ver('app', false); ver('abas', false);
  $('usuario').innerHTML = '';
  ver('telaLogin', true);
  ver('topoCentro', false);

/**
 * [FIX 2026-09-28] A API respondeu que a sessão não vale mais (venceu depois de 10 h, foi
 * encerrada ou o token é inválido). Antes, só o painel de Férias levava ao login: nas outras
 * abas e na Homologação a lista ficava vazia ou parada, mesmo recarregando a página.
 * Devolve 'novo' (esta página já tem uma sessão mais nova, vale tentar de novo), 'login'
 * (mandou para o login) ou '' (não era erro de sessão).
 */
function _tratarSessaoVencida_(e, tokenUsado){
  if(!_erroDeSessao_(e && e.message)) return '';
  if(tokenUsado !== TOKEN) return TOKEN ? 'novo' : 'login'; // a página já trocou de sessão ou já saiu
  const salvo = _tokenSalvo_();
  if(salvo && salvo !== tokenUsado){ TOKEN = salvo; return 'novo'; } // outra aba entrou de novo
  if(salvo === tokenUsado){ try{ localStorage.removeItem(K_TOKEN); }catch(e2){} }
  _encerrarSessaoNaTela_();
  msg('loginMsg', 'Sua sessão expirou. Entre novamente.');
  return 'login';
}

/**
 * Abre o portal: na volta de uma sessão salva (sem argumento) ou logo depois do login (com a
 * pessoa que o login devolveu).
 *
 * [PERF 2026-09-24] Antes, a tela inteira esperava o painel de Férias (o pedido mais demorado)
 * e só depois pedia os outros módulos. Agora:
 *  - o menu abre assim que se sabe quem é a pessoa (login ou contexto, que são rápidos);
 *  - os outros módulos são pedidos na mesma hora, junto com o painel de Férias;
 *  - as telas de Férias mostram "Carregando…" até o painel chegar;
 *  - quem não cuida de Férias nem espera o painel.
 */
async function carregar(usuarioDoLogin){
  const geracao = ++CARGA_TELA;
  const vigente = () => geracao === CARGA_TELA; // false se a pessoa saiu ou abriu de novo no meio

  ver('telaLogin', false);
  ver('app', false);
  ver('telaLoading', true);

  P = null;
  FERIAS_ERRO = '';
  FERIAS_CARREGANDO = true;

  let pedidoModulos = null;
  const iniciarModulos = () => (pedidoModulos = pedidoModulos || carregarBadgesExtras());
  let telaAberta = false;
  let semFerias = false;
  let pedidoContexto = null;
  let contextoEstado = 'ok';

  // Menu e telas antes do painel de Férias: cada aba se preenche quando os dados dela chegam.
  function abrirTela(){
    if(telaAberta || semFerias || !vigente()) return;
    telaAberta = true;
    // Com o contexto a caminho, os módulos esperam por ele: com a lista da pessoa, só pede o
    // que ela tem (quem responde "sem permissão" gasta uma ida inteira à API).
    if(contextoEstado !== 'pendente') iniciarModulos();
    ver('telaLoading', false);
    ver('topoCentro', true);
    ver('btnMenu', true);
    ver('abas', true);
    ver('app', true);
    ver('abaFerias', true);
    ver('abaPainelGeral', true);
    ver('semModulo', false);
    if(!P) _limparIndicadoresFerias_();
    ir(ABA);
  }

  function entrarSemFerias(){
    if(semFerias || !vigente()) return null;
    semFerias = true;
    FERIAS_CARREGANDO = false;
    ver('telaLoading', false);
    ver('btnMenu', true);
    return _entrarSemFerias_(USUARIO_ATUAL, iniciarModulos());
  }

  if(usuarioDoLogin){
    // veio do login, que já trouxe a pessoa e a lista de módulos dela
    abrirTela();
  } else {
    // O contexto é rápido: traz o "Olá, nome" e os módulos da pessoa. Dispara junto com o painel.
    contextoEstado = 'pendente';
    pedidoContexto = chamar('srvContexto', TOKEN);
    pedidoContexto.then(ctx => {
      contextoEstado = 'ok';
      if(!vigente()) return;
      renderUsuario(ctx.usuario);
      if(!_temModulo_('FERIAS')){ entrarSemFerias(); return; } // nem espera o painel de Férias
      abrirTela();
      if(telaAberta) iniciarModulos(); // o painel pode ter aberto o menu antes do contexto
    }, e => {
      // A saudação é só cosmética: falha aqui não derruba a sessão restaurada. O menu abre
      // quando o painel chegar, e os módulos são pedidos mesmo sem a lista (pede todos).
      contextoEstado = 'erro';
      if(telaAberta && vigente()) iniciarModulos();
    });
  }

  // [FIX 2026-09-23] Antes, QUALQUER falha aqui (lentidão, falha passageira do Google, ou uma
  // aba antiga com token vencido) apagava o token do localStorage — que é compartilhado por
  // todas as abas — e derrubava também a sessão recém-aberta em outra aba. Agora:
  //  - só descarta a sessão quando o erro é de sessão de verdade (expirada/encerrada/inválida);
  //  - se outra aba já entrou de novo, adota o token mais novo e tenta outra vez;
  //  - falha passageira tenta de novo sozinha e, se persistir, mantém a sessão salva.
  let ultimoErro = null;
  let erroSessao = false;

  for(let tentativa = 1; tentativa <= 3; tentativa++){
    if(semFerias || !vigente()) return;
    try{
      const painel = await chamar('srvPainel', TOKEN);
      if(semFerias || !vigente()) return;
      P = painel;
      FERIAS_CARREGANDO = false;
      abrirTela(); // se o contexto ainda não abriu o menu (ou falhou)
      montar();
      _rerenderFeriasAtual_();
      return;
    }catch(e){
      if(semFerias || !vigente()) return;
      ultimoErro = e;
      // Sem o módulo de Férias não é falha: a pessoa só cuida de outros módulos (mesmo caminho
      // do login). Antes, isso caía nas novas tentativas e terminava na tela de login com
      // "o sistema demorou a responder".
      if(_semPermissao_(e && e.message)){
        // o contexto já foi pedido em paralelo: espera ele trazer os módulos da pessoa
        if(pedidoContexto){ try{ await pedidoContexto; }catch(e2){} }
        await entrarSemFerias();
        return;
      }
      erroSessao = _erroDeSessao_(e && e.message);

      const salvo = _tokenSalvo_();
      if(erroSessao && salvo && salvo !== TOKEN){
        TOKEN = salvo; // outra aba já entrou de novo: usa a sessão nova
        continue;
      }
      if(erroSessao) break;
      if(tentativa < 3) await new Promise(r => setTimeout(r, 1500 * tentativa));
    }
  }

  if(!vigente()) return;
  FERIAS_CARREGANDO = false;

  if(telaAberta && !erroSessao){
    // O menu e os outros módulos já estão na tela: só Férias ficou sem carregar.
    FERIAS_ERRO = (ultimoErro && ultimoErro.message) || 'o sistema demorou a responder';
    _rerenderFeriasAtual_();
    toast('Não consegui carregar Férias agora. Abra a aba e clique em "Tentar de novo".', 'err');
    return;
  }

  ver('telaLoading', false);
  ver('app', false);
  ver('abas', false);
  ver('topoCentro', false);
  ver('btnMenu', false);
  ver('telaLogin', true);

  if(erroSessao){
    // só apaga do navegador se o token salvo ainda for o que falhou (não o de outra aba)
    if(_tokenSalvo_() === TOKEN){ try{ localStorage.removeItem(K_TOKEN); }catch(e){} }
    TOKEN = '';
    msg('loginMsg', (ultimoErro && ultimoErro.message) || 'Sessão expirada. Entre novamente.');
    return;
  }

  msg('loginMsg', 'O sistema demorou a responder e não conseguiu carregar agora' +
    ((ultimoErro && ultimoErro.message) ? ' (' + ultimoErro.message + ')' : '') +
    '. Sua sessão continua ativa: atualize a página (F5) para tentar de novo.');
}

function _limparIndicadoresFerias_(){

}

/** Redesenha a tela aberta quando o painel de Férias chega (ou falha). */
function _rerenderFeriasAtual_(){
  if(ABA === 'fila') renderFila();
  else if(ABA === 'calendario') renderCalendario();
  else if(ABA === 'abonos') renderAbonos();
  else if(ABA === 'prazos') renderPrazos();
  else if(ABA === 'painelgeral') renderPainelGeral();
}

/** Tela de Férias aberta antes de o painel chegar, ou depois de uma falha. */
function _feriasSemPainel_(listaId){
  const el = $(listaId);
  if(!el) return;
  el.innerHTML = FERIAS_ERRO
    ? '<div class="vazio">Não consegui carregar Férias agora: ' + esc(FERIAS_ERRO) +
      '<br><br><button class="b ver" onclick="recarregarFerias()">Tentar de novo</button></div>'
    : '<div class="vazio">Carregando…</div>';
}

/** Botão "Tentar de novo" das telas de Férias. */
async function recarregarFerias(){
  const token = TOKEN;
  FERIAS_ERRO = '';
  FERIAS_CARREGANDO = true;
  _rerenderFeriasAtual_();
  try{
    const painel = await chamar('srvPainel', token);
    if(token !== TOKEN) return;
    P = painel;
    montar();
  }catch(e){
    if(token !== TOKEN) return;
    FERIAS_ERRO = (e && e.message) || 'o sistema demorou a responder';
    toast('Ainda não consegui carregar Férias. Tente de novo em instantes.', 'err');
  }finally{
    if(token === TOKEN) FERIAS_CARREGANDO = false;
  }
  _rerenderFeriasAtual_();
}

/** Erro que significa "a sessão não vale mais" — só nesses casos o token é descartado. */
function _erroDeSessao_(texto){
  return /sess(ã|a)o (expirada|encerrada)|token (n(ã|a)o informado|inv(á|a)lido)|token sem identifica|payload do token|usu(á|a)rio do token/i
    .test(String(texto || ''));
}

function _tokenSalvo_(){
  try{ return localStorage.getItem(K_TOKEN) || ''; }catch(e){ return ''; }
}

// Quando a pessoa entra de novo em outra aba, esta aba passa a usar a sessão nova, em vez de
// continuar com o token antigo (que venceria e derrubaria o portal sem motivo).
window.addEventListener('storage', function(ev){
  if(ev.key === K_TOKEN && ev.newValue && ev.newValue !== TOKEN){ TOKEN = ev.newValue; }
});

function montar(){
  const i = (P && P.indicadores) || {};

  if(P.marca && P.marca.logo) $('logo').src = P.marca.logo;

  if(totalFerias){ $('nFeriasBadge').textContent = totalFerias; ver('nFeriasBadge', true); } else ver('nFeriasBadge', false);

  $('kpis').innerHTML =

    kpi(i.slaViolado, 'SLA de 15 dias ultrapassado', i.slaViolado ? 'cr' : 'ok') +
    kpi(i.slaMedioDiasResposta === null ? '—' : i.slaMedioDiasResposta, 'Tempo médio de resposta (dias)', '') +
    kpi(i.taxaIndeferimentoPct === null ? '—' : i.taxaIndeferimentoPct + '%', 'Taxa de indeferimento', '') +
    kpi(i.financeiroDeferidasSemEnvio, 'Deferidas sem enviar ao financeiro', i.financeiroDeferidasSemEnvio ? 'al' : 'ok') +
    kpi(i.financeiroForaDoPrazo, 'Enviadas ao financeiro fora do prazo', i.financeiroForaDoPrazo ? 'cr' : 'ok') +

function kpi(v, r, c){

/* ================= FÉRIAS: VISUAL DA RESCISÃO (2026-10-15) =================
 * Cartões de etapa no lugar das pílulas e dos 12 indicadores do topo (que agora ficam no botão
 * "Indicadores"), busca e filtros em cada tela, tabela com a ação principal no botão e as outras no
 * menu ⋮ (mesmas peças da Rescisão: _rescAcoesHtml_, rescMenu, classes resc-*). As ações chamam as
 * mesmas funções de antes (deferir, abrirNao, verProvisao, abrirAbono, estornarFeriasDeferida...). */

const FER_POR_PAGINA = 100;
let FER_PAG = {};                  // por tela: { pagina, todos }
let FER_FILTRO = { fila: {}, abonos: {}, prazos: {}, agendadas: {} };
let PRAZOS_SUBABA = 'vencidas';
let FER_PRECARGA = false;          // Agendadas e Recibos carregados em segundo plano uma vez

function _ferNorm_(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

/** 'carla.menezes@cieds.org.br' -> 'Carla Menezes' (o painel manda o e-mail de quem pediu). */
function _ferNomeGestor_(email){
  const s = String(email || '').trim();
  if(!s || s === '(sem gestor)') return '';
  if(s.indexOf('@') < 0) return s;
  return _rescNomeTitulo_(s.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b(rj|sp)\b/gi, '').trim());
}

function _ferIsoParaData_(iso){
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], 12) : null;
}
function _ferBrParaIso_(br){
  const m = String(br || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? m[3] + '-' + m[2] + '-' + m[1] : '';
}
function _ferPlural_(n, um, varios){ return n + ' ' + (n === 1 ? um : varios); }
function _ferMilhar_(n){ return Number(n || 0).toLocaleString('pt-BR'); }
/** R$ compacto para os cartões do calendário: 612000 -> 'R$ 612 mil', 8097000 -> 'R$ 8,1 mi'. */
function _ferBrlCurto_(n){
  const v = Math.abs(Number(n || 0));
  if(v >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if(v >= 1e3) return 'R$ ' + Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil';
  return brl0(v);
}

/* ---- peças da tabela ---- */

function _ferColab_(nome, sub, antes, avCls){
  return '<div class="resc-colab">' + (antes || '') + '<span class="resc-av' + (avCls ? ' ' + avCls : '') + '" aria-hidden="true">' + esc(ini(nome)) + '</span>' +
    '<div class="resc-colab-txt"><b>' + esc(_rescNomeTitulo_(nome)) + '</b><span>' + (sub || '') + '</span></div></div>';
}
function _ferDado_(principal, sub, subCls){
  return esc(principal || '—') + (sub ? '<small class="' + (subCls || '') + '">' + esc(sub) + '</small>' : '');
}
function _ferTag_(texto, cor, sub, title){
  return '<span class="resc-tag ' + (cor || 'cinza') + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + esc(texto) + '</span>' +
    (sub ? '<small>' + esc(sub) + '</small>' : '');
}

/** Tabela com grupos (opcional) e paginação de 100, igual à da Rescisão, mas com colunas livres.
 *  colunas: [{ t, cls, html }]; linhas: [{ grupo, cels: [html...] }]. */
function _ferTabelaHtml_(tela, colunas, linhas, rodapeExtra){
  const pag = FER_PAG[tela] || (FER_PAG[tela] = { pagina: 0, todos: false });
  const total = linhas.length;
  const porPagina = pag.todos ? Math.max(1, total) : FER_POR_PAGINA;
  const paginas = Math.max(1, Math.ceil(total / porPagina));
  if(pag.pagina > paginas - 1) pag.pagina = paginas - 1;
  const ini0 = pag.pagina * porPagina;
  let grupo = null;
  const corpo = linhas.slice(ini0, ini0 + porPagina).map(l => {
    let h = '';
    if(l.grupo !== undefined && l.grupo !== grupo){
      grupo = l.grupo;
      h += '<tr class="resc-grupo"><th colspan="' + colunas.length + '" scope="rowgroup">' + esc(grupo) + '</th></tr>';
    }
    return h + '<tr>' + l.cels.map((c, j) => {
      const col = colunas[j] || {};
      const cls = [col.cls || '', col.data ? 'resc-data' : ''].join(' ').trim();
      return '<td' + (cls ? ' class="' + cls + '"' : '') + (col.data || col.cls === 'fer-num' ? ' data-rotulo="' + esc(col.t) + '"' : '') + '>' + c + '</td>';
    }).join('') + '</tr>';
  }).join('');
  const cab = colunas.map(c => '<th scope="col"' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + (c.html || esc(c.t)) + '</th>').join('');
  return '<div class="resc-tabela-rolagem"><table class="resc-tabela"><thead><tr>' + cab + '</tr></thead><tbody>' + corpo + '</tbody></table></div>' +
    (rodapeExtra ? '<div class="fer-nota-lista">' + rodapeExtra + '</div>' : '') +
    '<div class="resc-rodape"><span>Mostrando ' +
      (paginas > 1 ? (ini0 + 1) + '–' + Math.min(ini0 + porPagina, total) + ' de ' + total : total + ' de ' + total) + '</span>' +
      '<div class="resc-paginas">' +
        (pag.todos && total > FER_POR_PAGINA ? '' :
          '<button type="button" class="resc-pag"' + (pag.pagina === 0 ? ' disabled' : '') + ' onclick="ferPagina(\'' + tela + '\', -1)">Anterior</button>' +
          '<button type="button" class="resc-pag"' + (pag.pagina >= paginas - 1 ? ' disabled' : '') + ' onclick="ferPagina(\'' + tela + '\', 1)">Próxima</button>') +
        (total > FER_POR_PAGINA
          ? '<button type="button" class="resc-pag resc-pag-todos" onclick="ferMostrarTodos(\'' + tela + '\', ' + !pag.todos + ')">' +
            (pag.todos ? 'Mostrar ' + FER_POR_PAGINA + ' por vez' : 'Mostrar todos (' + total + ')') + '</button>' : '') +
      '</div></div>';
}

function _ferRedesenhar_(tela){
  if(tela === 'fila') renderFila();
  else if(tela === 'abonos') renderAbonos();
  else if(tela === 'prazos') renderPrazos();
  else if(tela === 'agendadas') renderAgendadas(AGENDADAS_CACHE || []);
  else if(tela === 'recibos') renderRecibosLista();
  else if(tela === 'mov') renderMov();
}
function ferPagina(tela, delta){
  const pag = FER_PAG[tela] || (FER_PAG[tela] = { pagina: 0, todos: false });
  pag.pagina = Math.max(0, pag.pagina + delta);
  _ferRedesenhar_(tela);
}
function ferMostrarTodos(tela, todos){
  FER_PAG[tela] = { pagina: 0, todos: !!todos };
  _ferRedesenhar_(tela);
}
function ferFiltrar(tela, campo, valor){
  (FER_FILTRO[tela] || (FER_FILTRO[tela] = {}))[campo] = valor;
  if(FER_PAG[tela]) FER_PAG[tela].pagina = 0;
  _ferRedesenhar_(tela);
}
function _ferVazio_(texto){ return '<div class="vazio">' + texto + '</div>'; }

/* ---- cartões de etapa (contagem + nota) ---- */

function _ferNota_(id, texto, cor){
  const el = $(id);
  if(!el) return;
  el.textContent = texto || '';
  el.className = 'fer-etapa-nota' + (cor ? ' ' + cor : '');
}
function _ferCartoes_(){
  const i = (P && P.indicadores) || null;
  const n = (id, v) => { const el = $(id); if(el) el.textContent = (v === null || v === undefined) ? '–' : _ferMilhar_(v); };
  if(i){
    n('nFila', i.naFila || 0);
    _ferNota_('ferNotaFila', i.atrasadas ? _ferPlural_(i.atrasadas, 'fora do prazo de resposta', 'fora do prazo de resposta') : (i.naFila ? 'todas no prazo' : 'fila zerada'), i.atrasadas ? 'vermelho' : '');
    const abonosFora = (P.abonos || []).filter(a => !a.dentroDoPrazo).length;
    n('nAbono', i.abonosParaConfirmar || 0);
    _ferNota_('ferNotaAbonos', abonosFora ? _ferPlural_(abonosFora, 'fora do prazo legal', 'fora do prazo legal') : (i.abonosParaConfirmar ? 'aguardando o DP' : 'nenhum pedido'), abonosFora ? 'vermelho' : '');
    n('nPrazo', i.vencidos || 0);
    _ferNota_('ferNotaPrazos', i.criticos ? _ferPlural_(i.criticos, 'vence em 60 dias', 'vencem em 60 dias') : 'nada vence em 60 dias', i.criticos ? 'amarelo' : '');
  }else{
    ['nFila', 'nAbono', 'nPrazo'].forEach(id => n(id, null));
    ['ferNotaFila', 'ferNotaAbonos', 'ferNotaPrazos'].forEach(id => _ferNota_(id, FERIAS_ERRO ? 'não carregou' : 'carregando…'));
  }
  if(AGENDADAS_CARREGADAS){
    const semEnvio = (AGENDADAS_CACHE || []).filter(a => !a.enviadoFinanceiro).length;
    n('nFinanceiro', (AGENDADAS_CACHE || []).length);
    _ferNota_('ferNotaAgendadas', semEnvio ? _ferPlural_(semEnvio, 'sem enviar ao financeiro', 'sem enviar ao financeiro') : 'todas no financeiro', semEnvio ? 'amarelo' : '');
  }else{
    n('nFinanceiro', null);
    const s = i && i.financeiroDeferidasSemEnvio;
    _ferNota_('ferNotaAgendadas', s ? _ferPlural_(s, 'sem enviar ao financeiro', 'sem enviar ao financeiro') : 'carregando…', s ? 'amarelo' : '');
  }
  if(RECIBOS && RECIBOS.lista){
    const l = RECIBOS.lista;
    const prontos = l.filter(r => !r.enviado && r.temRecibo).length; // mesma conta da aba "Prontos para envio"
    const aguardando = l.filter(r => r.enviado && !r.baixado).length;
    n('nRecibos', l.filter(r => !(r.enviado && r.baixado)).length);
    _ferNota_('ferNotaRecibos', prontos ? _ferPlural_(prontos, 'pronto para envio', 'prontos para envio') :
      (aguardando ? _ferPlural_(aguardando, 'aguardando assinatura', 'aguardando assinatura') : 'tudo assinado'), prontos ? 'amarelo' : '');
  }else{
    n('nRecibos', null);
    _ferNota_('ferNotaRecibos', 'carregando…');
  }
}

/** Ao entrar em Férias: Agendadas e Recibos vêm em segundo plano para os cartões terem número. */
function _ferPreCarga_(){
  if(FER_PRECARGA || !TOKEN) return;
  FER_PRECARGA = true;
  const token = TOKEN;
  chamar('srvAgendadas', token, '').then(r => {
    if(token !== TOKEN || AGENDADAS_CARREGADAS) return;
    AGENDADAS_CACHE = r.agendadas || []; AGENDADAS_CARREGADAS = true;
    _ferCartoes_();
  }).catch(() => {});
  if(!RECIBOS) chamar('srvFeriasRecibos', token, false).then(r => {
    if(token !== TOKEN || RECIBOS) return;
    RECIBOS = r; _ferCartoes_();
  }).catch(() => {});
}

/* ---- indicadores (antes eram 12 cartões no topo) ---- */

  const corpo = $('ferIndicadoresCorpo');
  if(!i){ corpo.innerHTML = _ferVazio_(FERIAS_ERRO ? 'Os indicadores não carregaram: ' + esc(FERIAS_ERRO) : 'Os indicadores ainda estão carregando.'); abrir('ovFerIndicadores'); return; }

      ind(brl0(i.custoNaFila), 'Custo dos pedidos em análise', '') +
      ind(_ferMilhar_(i.slaViolado), 'Pedidos que passaram de ' + (P.prazoDP || 15) + ' dias sem resposta (histórico)', i.slaViolado ? 'cr' : 'ok') +
      ind(nd(i.slaMedioDiasResposta === null ? null : String(i.slaMedioDiasResposta).replace('.', ',') + ' dias'), 'Tempo médio de resposta', '') +
      ind(nd(i.taxaIndeferimentoPct === null ? null : String(i.taxaIndeferimentoPct).replace('.', ',') + '%'), 'Pedidos não aprovados', '') +
    '</div></div>' +
    '<div class="fer-ind-grupo"><h3>Saldos e prazos</h3><div class="fer-ind-grade">' +
      ind(_ferMilhar_(i.vencidos), 'Prazos vencidos, pagos em dobro', i.vencidos ? 'cr' : 'ok') +
      ind(_ferMilhar_(i.criticos), 'Vencem nos próximos 60 dias', i.criticos ? 'al' : 'ok') +
      ind(_ferMilhar_(i.diasEmAberto), 'Dias de férias em aberto (saldo somado)', '') +
    '</div></div>' +
    '<div class="fer-ind-grupo"><h3>Financeiro</h3><div class="fer-ind-grade">' +

/* ================= FILA ================= */
/* [2026-10-15] Tabela no padrão da Rescisão: Confirmar no botão; memória e "Não aprovar" no menu ⋮. */
function renderFila(){
  if(!P){ $('filaInfo').textContent = ''; _ferCartoes_(); _feriasSemPainel_('listaFila'); return; }
  _ferCartoes_();
  const f = P.fila || [];
  const prazo = Number(P.prazoDP || 15);
  const filtro = FER_FILTRO.fila || {};
  const busca = _ferNorm_(filtro.busca);

  $('filaInfo').innerHTML = f.length
    ? 'Custo em análise <b>' + esc(brl0(f.reduce((t, s) => t + Number(s.custo || 0), 0))) + '</b> · resposta em até ' + prazo + ' dias'
    : '';

  if(!f.length){ $('listaFila').innerHTML = _ferVazio_('Nenhum pedido aguardando decisão. A fila está zerada.'); return; }

  const sitDe = s => s.atrasado ? 'fora' : (s.diasEsperando >= prazo - 5 ? 'perto' : 'no');
  const lista = f.filter(s => {
    if(filtro.tipo === 'ferias' && s.fimDeAno) return false;
    if(filtro.tipo === 'fimdeano' && !s.fimDeAno) return false;
    if(filtro.sit && sitDe(s) !== filtro.sit) return false;
    if(busca && _ferNorm_([s.nome, s.matricula, s.departamento, s.gestor, _ferNomeGestor_(s.gestor)].join(' ')).indexOf(busca) < 0) return false;
    return true;
  }).sort((a, b) => (a.fimDeAno === b.fimDeAno) ? 0 : (a.fimDeAno ? 1 : -1)); // Férias primeiro; dentro do grupo, quem espera há mais tempo

  if(!lista.length){ $('listaFila').innerHTML = _ferVazio_('Nenhum pedido com esses filtros.'); return; }

  const linhas = lista.map(s => {
    const nomeJs = _rescArgJs_(s.nome);
    const sit = sitDe(s);
    const espera = s.diasEsperando === 0 ? 'pedido hoje' : (s.diasEsperando === 1 ? 'esperando há 1 dia' : 'esperando há ' + s.diasEsperando + ' dias');
    const gestor = _ferNomeGestor_(s.gestor);
    return {
      grupo: s.fimDeAno ? 'FÉRIAS DE FIM DE ANO' : 'FÉRIAS',
      cels: [
        _ferColab_(s.nome, esc(s.departamento || '—') + (gestor ? ' · pedido por <i class="fer-pessoa" title="' + esc(s.gestor) + '">' + esc(gestor) + '</i>' : '')),
        _ferDado_(dBR(s.inicio) + (s.fim ? ' a ' + dBR(s.fim) : ''), _ferPlural_(s.dias, 'dia', 'dias') + (s.abono ? ' + ' + s.abono + ' vendidos' : '')),
        brl0(s.custo),
        sit === 'fora' ? _ferTag_('Fora do prazo', 'vermelho', espera) :
          sit === 'perto' ? _ferTag_('Perto do prazo', 'amarelo', espera) : _ferTag_('No prazo', 'verde', espera),
        _rescAcoesHtml_([
          { p: 1, t: 'Confirmar', forte: 1, verde: 1, fn: "deferir('" + _rescArgJs_(s.id) + "', '" + nomeJs + "', '" + dBR(s.inicio) + "', " + Number(s.dias || 0) + ')' },
          { t: 'Ver memória de cálculo', fn: "verProvisao('" + _rescArgJs_(s.id) + "')" },
          { t: 'Não aprovar…', perigo: 1, fn: "abrirNao('" + _rescArgJs_(s.id) + "', '" + nomeJs + "')" }
        ])
      ]
    };
  });
  $('listaFila').innerHTML = _ferTabelaHtml_('fila', [
    { t: 'Colaborador' }, { t: 'Período', data: 1 }, { t: 'Custo previsto', cls: 'fer-num' }, { t: 'Prazo de resposta', cls: 'resc-situacao' },
    { t: 'Ações', cls: 'resc-col-acoes' }
  ], linhas);
}

async function deferir(id, nome, inicio, dias){
  // Deferir congela o custo e dispara e-mail na hora pro colaborador e pro gestor — é a ação de
  // maior consequência da fila, e (diferente de indeferir) não tem como desfazer pelo portal
  // depois. Por isso pede confirmação, igual às outras ações que não têm volta no sistema.
  const confirmou = confirm(
    'Confirmar as férias de ' + nome + ' a partir de ' + inicio + ' (' + dias + ' dia(s))?\n\n' +
    'Isso avisa o colaborador e o gestor na hora, e não tem como desfazer pelo portal depois.'
  );
  if(!confirmou) return;

  try{
    const r = await chamar('srvDeferir', TOKEN, id);
    toast(r.mensagem || 'Férias confirmadas.', 'suc');
    await carregar();
  }catch(e){ toast(e.message, 'err'); }
}

function abrirNao(id, nome){
  SOL_NAO = id;
  $('naoNome').textContent = nome;
  $('naoMotivo').value = '';
  limpa('naoMsg');
  abrir('ovNao');
}

async function confirmarNao(){
  const m = $('naoMotivo').value.trim();
  if(!m) return msg('naoMsg', 'Escreva o que explicar ao gestor — o campo é obrigatório.');

  const b = $('naoBtn');
  ocupado(b, 'Enviando…');

  try{
    await chamar('srvIndeferir', TOKEN, SOL_NAO, m);
    fechar('ovNao');
    toast('Enviado ao gestor. Os dias voltaram para o saldo.', 'suc');
    await carregar();
  }catch(e){
    msg('naoMsg', e.message);
  }finally{ livre(b); }
}

/* ================= CALENDÁRIO ================= */
/* [2026-10-15] Cartões por mês com barra empilhada contra o teto (mesma escala em todos os meses),
 * legenda única no topo e as definições num "Como ler". Cores validadas para daltonismo, claro e escuro. */
// Cores de antes. Ordem da barra escolhida para afastar as cores parecidas (verde x dourado, dourado x vermelho).
const FER_CAL_SERIES = [
  { k: 'planejado', p: 'pessoasDeferidas', r: 'Planejadas', c: 'var(--fer-plan)' },
  { k: 'assistencia', p: 'pessoasAssistencia', r: 'Assistência', c: 'var(--fer-assist)' },
  { k: 'pendente', p: 'pessoasPendentes', r: 'Pendentes', c: 'var(--fer-pend)', hachura: 1 },
  { k: 'compulsorio', p: 'pessoasCompulsorias', r: 'Compulsórias', c: 'var(--fer-comp)' },
  { k: 'vencido', p: 'pessoasVencidas', r: 'Vencidas (em dobro)', c: 'var(--fer-venc)' },
  { k: 'excecaoJm', p: 'pessoasExcecaoJm', r: 'Exceção JM', c: 'var(--fer-jm)' }
];
const _ferHach_ = s => s.hachura ? ' fer-hachura' : '';

function renderCalendario(){
  _ferCartoes_();
  if(!P){ $('calPeriodo').textContent = ''; $('calResumo').innerHTML = ''; $('calLegenda').innerHTML = ''; _feriasSemPainel_('calMeses'); return; }
  const c = P.calendario;
  const meses = c.meses || [];
  const series = FER_CAL_SERIES.filter(s => s.k !== 'excecaoJm' || meses.some(m => m.excecaoJm));
  const pessoasMes = m => series.reduce((t, s) => t + Number(m[s.p] || 0), 0);

  $('calPeriodo').textContent = 'De ' + mesBR(c.de) + ' a ' + mesBR(c.ate) + ' · valores previstos por mês de pagamento, comparados ao teto do mês';
  // na legenda e na lista de cada mês, a ordem de antes
  const legenda = ['planejado', 'pendente', 'compulsorio', 'vencido', 'assistencia', 'excecaoJm'].map(k => series.find(s => s.k === k)).filter(Boolean);
  $('calLegenda').innerHTML = legenda.map(s => '<li><span class="fer-sw' + _ferHach_(s) + '" style="background-color:' + s.c + '"></span>' + esc(s.r) + '</li>').join('') +
    '<li><span class="fer-sw fer-sw-teto"></span>Teto do mês</li>';

  const total = meses.reduce((t, m) => t + pessoasMes(m), 0);
  const planejadas = meses.reduce((t, m) => t + Number(m.pessoasDeferidas || 0), 0);
  const pendentes = meses.reduce((t, m) => t + Number(m.pessoasPendentes || 0), 0);
  const compulsorias = meses.reduce((t, m) => t + Number(m.pessoasCompulsorias || 0) + Number(m.pessoasVencidas || 0), 0);
  const acima = meses.filter(m => m.semaforo === 'VERMELHO');
  const risco = meses.filter(m => m.semaforo === 'AMARELO');

  $('calResumo').innerHTML =
    '<div class="fer-tile destaque"><span>Valor total previsto</span><b>' + esc(brl0(c.totalPrevisto)) + '</b><small>' + meses.length + ' meses</small></div>' +
    '<div class="fer-tile"><span>Eventos de férias</span><b class="az">' + _ferMilhar_(total) + '</b><small>' + _ferMilhar_(planejadas) + ' planejadas · ' + _ferMilhar_(pendentes) + ' pendentes</small></div>' +
    '<div class="fer-tile"><span>Compulsórias e vencidas</span><b class="wa">' + _ferMilhar_(compulsorias) + '</b><small>sem agendamento até o prazo</small></div>' +
    '<div class="fer-tile"><span>Meses acima do teto</span><b' + (acima.length ? ' class="cr"' : '') + '>' + acima.length + '</b>' +
      (acima.length ? '<small>' + acima.map(m => mesBR(m.mes)).join(', ') + '</small>'
        : (risco.length ? '<small>' + _ferPlural_(risco.length, 'mês estoura', 'meses estouram') + ' se a previsão se confirmar</small>' : '<small>todos dentro do teto</small>')) + '</div>';

  // Mesma escala em todos os meses, para a barra de um mês poder ser comparada com a do outro.
  const escala = Math.max(1, ...meses.map(m => Math.max(Number(m.teto || 0), Number(m.total || 0))));

  $('calMeses').innerHTML = meses.map(m => {
    const tot = Number(m.total || 0);
    const larg = Math.min(100, tot / escala * 100);
    const segs = series.filter(s => Number(m[s.k] || 0) > 0).map(s =>
      '<i class="' + _ferHach_(s).trim() + '" style="flex:' + Number(m[s.k]) + ' 0 0;background-color:' + s.c + '" title="' + esc(s.r + ': ' + brl0(m[s.k]) + ' · ' + _ferPlural_(Number(m[s.p] || 0), 'pessoa', 'pessoas')) + '"></i>').join('');
    const teto = Number(m.teto || 0);
    const cor = m.semaforo === 'VERMELHO' ? 'vermelho' : (m.semaforo === 'AMARELO' ? 'amarelo' : '');
    const disp = Number(m.disponivel || 0);
    const acimaTeto = Math.max(0, Number(m.planejado || 0) - teto);
    const status = m.semaforo === 'VERMELHO' ? _ferTag_(_ferBrlCurto_(acimaTeto) + ' acima do teto', 'vermelho', '', 'Só as férias já confirmadas passam do teto')
      : (disp < 0 ? _ferTag_('Estoura em ' + _ferBrlCurto_(-disp), 'amarelo', '', 'Passa do teto se a previsão se confirmar') : _ferTag_(_ferBrlCurto_(disp) + ' livres', 'verde'));
    // valores na cor da categoria, como era
    const linhas = legenda.filter(s => Number(m[s.k] || 0) > 0).map(s =>
      '<li><span class="fer-sw' + _ferHach_(s) + '" style="background-color:' + s.c + '"></span><span class="r">' + esc(s.r) + '</span><b style="color:' + s.c + '">' + esc(brl0(m[s.k])) + '</b><small>' +
        _ferPlural_(Number(m[s.p] || 0), 'pessoa', 'pessoas') + '</small></li>').join('');
    const [ano, mm] = String(m.mes).split('-');
    const nomeMes = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'][Number(mm) - 1] + ' ' + ano;
    return '<article class="fer-mes ' + cor + '" aria-label="' + esc(nomeMes) + '">' +
      '<div class="fer-mes-cab"><div><span class="m">' + esc(nomeMes) + '</span><span class="q">' + _ferPlural_(pessoasMes(m), 'evento', 'eventos') + '</span></div>' +
        '<div class="fer-mes-total"><b>' + esc(brl0(tot)) + '</b>' + status + '</div></div>' +
      '<div class="fer-barra" role="img" aria-label="' + esc('Previsto ' + brl0(tot) + ' de um teto de ' + brl0(teto)) + '">' +
        '<div class="fer-barra-trilho"></div>' +
        '<div class="fer-barra-seg" style="left:0;width:' + larg.toFixed(2) + '%">' + segs + '</div>' +
        (teto ? '<div class="fer-barra-teto" style="left:calc(' + Math.min(100, teto / escala * 100).toFixed(2) + '% - 1px)" title="Teto: ' + esc(brl0(teto)) + '"></div>' : '') +
      '</div>' +
      '<ul class="fer-mes-linhas">' + linhas + '</ul>' +
      '<div class="fer-mes-rodape"><span>Teto do mês <b>' + esc(brl0(teto)) + '</b></span>' +
        '<button type="button" class="fer-link" onclick="editarTetoMes(\'' + esc(m.mes) + '\',' + teto + ')">Editar teto</button></div>' +
    '</article>';
  }).join('');
}

async function editarTetoMes(mes, tetoAtual){
  const valor = prompt('Novo teto para ' + mesBR(mes) + ' — R$ (deixe vazio ou 0 para voltar ao padrão):', tetoAtual || '');
  if(valor === null) return; // cancelou

  try{
    const r = await chamar('srvDefinirTeto', TOKEN, mes, Number(valor) || 0);
    toast(r.mensagem, 'suc');
    P = await chamar('srvPainel', TOKEN);
    renderCalendario();
  }catch(e){
    toast(e.message, 'err');
  }
}

/* ================= ABONOS ================= */
/* [2026-10-15] Registrar no botão; Recusar no menu ⋮. */
function renderAbonos(){
  _ferCartoes_();
  if(!P){ _feriasSemPainel_('listaAbonos'); return; }
  const a = P.abonos || [];
  if(!a.length){ $('listaAbonos').innerHTML = _ferVazio_('Nenhum pedido de venda de dias aguardando o DP.'); return; }
  const filtro = FER_FILTRO.abonos || {};
  const busca = _ferNorm_(filtro.busca);
  const lista = a.filter(x => {
    if(filtro.sit === 'no' && !x.dentroDoPrazo) return false;
    if(filtro.sit === 'fora' && x.dentroDoPrazo) return false;
    if(busca && _ferNorm_([x.nome, x.matricula, x.solicitadoPor].join(' ')).indexOf(busca) < 0) return false;
    return true;
  });
  if(!lista.length){ $('listaAbonos').innerHTML = _ferVazio_('Nenhum pedido com esses filtros.'); return; }
  const linhas = lista.map(x => {
    const quem = _ferNomeGestor_(x.solicitadoPor);
    return { cels: [
      _ferColab_(x.nome, 'Período aquisitivo ' + esc(x.periodoAquisitivo) + (quem ? ' · pedido por ' + esc(quem) : '')),
      _ferDado_(_ferPlural_(Number(x.dias || 0), 'dia', 'dias')),
      _ferDado_(x.pedidoEmBR, x.prazoLegal ? 'prazo legal até ' + x.prazoLegal : ''),
      x.dentroDoPrazo ? _ferTag_('No prazo legal', 'verde') : _ferTag_('Fora do prazo legal', 'vermelho', 'só como exceção, com justificativa'),
      _rescAcoesHtml_([
        { p: 1, t: 'Registrar', forte: 1, verde: 1, fn: "abrirAbono('" + _rescArgJs_(x.idPeriodo) + "')" },
        { t: 'Recusar pedido…', perigo: 1, fn: "recusarAbono('" + _rescArgJs_(x.idPeriodo) + "', '" + _rescArgJs_(x.nome) + "')" }
      ])
    ] };
  });
  $('listaAbonos').innerHTML = _ferTabelaHtml_('abonos', [
    { t: 'Colaborador' }, { t: 'Dias vendidos', data: 1 }, { t: 'Pedido em', data: 1 }, { t: 'Situação', cls: 'resc-situacao' }, { t: 'Ações', cls: 'resc-col-acoes' }
  ], linhas);
}

function abrirAbono(idPeriodo){
  const a = P.abonos.find(x => x.idPeriodo === idPeriodo);
  if(!a) return;

  AB_ATUAL = a;

  $('abNome').textContent = a.nome;
  $('abSub').textContent = a.dias + ' dias · período ' + a.periodoAquisitivo;
  $('abData').value = a.pedidoEm || hojeISO();
  $('abDica').textContent = 'A lei exige o pedido até ' + a.prazoLegal +
    '. O gestor registrou em ' + a.pedidoEmBR + '.';
  $('abExcecao').checked = !a.dentroDoPrazo;
  $('abJust').value = '';

  toggleExcecao();
  limpa('abMsg');

  if(!a.dentroDoPrazo){
    msg('abMsg', 'Este pedido está fora do prazo legal. Só é possível registrar como exceção, com justificativa.', 'inf');
  }

  abrir('ovAbono');
}

async function recusarAbono(idPeriodo, nome){
  const motivo = prompt('Por que recusar o pedido de venda de dias de ' + nome + '?\n(ex.: agendado por engano, pessoa errada, etc.)');
  if(motivo === null) return; // cancelou

  try{
    const r = await chamar('srvRevogarAbono', TOKEN, idPeriodo, motivo || 'Recusado pelo DP.');
    toast(r.mensagem || 'Pedido recusado.', 'suc');
    P = await chamar('srvPainel', TOKEN);
    renderAbonos();
  }catch(e){
    toast(e.message, 'err');
  }
}

function toggleExcecao(){
  ver('abBoxJust', $('abExcecao').checked);
}

async function confirmarAbono(){
  limpa('abMsg');

  const data = $('abData').value;
  const exc = $('abExcecao').checked;
  const just = $('abJust').value.trim();

  if(!data) return msg('abMsg', 'Informe quando o colaborador pediu.');
  if(exc && !just) return msg('abMsg', 'A exceção exige justificativa.');

  const b = $('abBtn');
  ocupado(b, 'Registrando…');

  try{
    const r = await chamar('srvAutorizarAbono', TOKEN, AB_ATUAL.idPeriodo, data, exc, just);
    fechar('ovAbono');
    toast(r.mensagem || 'Venda de dias liberada.', 'suc');
    await carregar();
  }catch(e){
    msg('abMsg', e.message);
  }finally{ livre(b); }
}

/* ================= PRAZOS ================= */

 * 30 de cada lista (os mais urgentes); o rodapé avisa quando o total é maior. */

}

function renderPrazos(){
  _ferCartoes_();
  if(!P){ $('vencInfo').textContent = ''; _feriasSemPainel_('listaVencidos'); return; }
  const vencidas = PRAZOS_SUBABA !== 'criticos';
  const todos = vencidas ? (P.vencidos || []) : (P.criticos || []);
  const totalReal = vencidas ? Number(P.indicadores.vencidos || 0) : Number(P.indicadores.criticos || 0);

  document.querySelectorAll('#prazosAbas .sub').forEach(b => {
    const on = b.dataset.sub === PRAZOS_SUBABA;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  const cv = $('prazosCont_vencidas'), cc = $('prazosCont_criticos');
  if(cv) cv.textContent = _ferMilhar_(P.indicadores.vencidos || 0);
  if(cc) cc.textContent = _ferMilhar_(P.indicadores.criticos || 0);

  // gestores da lista atual no filtro
  const sel = $('prazosFiltroGestor');
  const filtro = FER_FILTRO.prazos || {};
  if(sel){
    const gestores = Array.from(new Set(todos.map(x => x.gestor || '(sem gestor)'))).sort((a, b) => _ferNomeGestor_(a).localeCompare(_ferNomeGestor_(b)));
    if(filtro.gestor && gestores.indexOf(filtro.gestor) < 0) filtro.gestor = '';
    sel.innerHTML = '<option value="">Gestor: Todos</option>' + gestores.map(g =>
      '<option value="' + esc(g) + '"' + (filtro.gestor === g ? ' selected' : '') + '>' + esc(_ferNomeGestor_(g) || 'Sem gestor cadastrado') + '</option>').join('');
  }

  $('vencInfo').innerHTML = vencidas
    ? 'Prazo para conceder já passou: <b>férias em dobro</b> (art. 137 da CLT)'
    : 'Prazo para conceder termina nos próximos <b>60 dias</b>';

  if(!todos.length){
    $('listaVencidos').innerHTML = _ferVazio_(vencidas ? 'Nenhum prazo vencido entre quem está trabalhando.' : 'Ninguém com prazo terminando nos próximos 60 dias.');
    return;
  }
  const busca = _ferNorm_(filtro.busca);
  const lista = todos.filter(x => {
    if(filtro.gestor && (x.gestor || '(sem gestor)') !== filtro.gestor) return false;
    if(busca && _ferNorm_([x.nome, x.matricula, x.gestor, _ferNomeGestor_(x.gestor)].join(' ')).indexOf(busca) < 0) return false;
    return true;
  });
  if(!lista.length){ $('listaVencidos').innerHTML = _ferVazio_('Ninguém com esses filtros.'); return; }

  const linhas = lista.map(x => {
    const gestor = _ferNomeGestor_(x.gestor);
    const sub = gestor ? 'Gestor: <i class="fer-pessoa" title="' + esc(x.gestor) + '">' + esc(gestor) + '</i>' : '<i class="fer-pessoa fer-gestor-falta">Sem gestor cadastrado</i>';
    let prazo, tag;
    if(vencidas){
      prazo = _ferDado_(x.concederAte, 'vencido há ' + _ferPlural_(Number(x.vencidoHa || 0), 'dia', 'dias'), 'vermelho');
      tag = _ferTag_('Em dobro', 'vermelho');
    }else{
      const d = Number(x.diasRestantes || 0);
      prazo = _ferDado_(x.concederAte, d === 0 ? 'vence hoje' : 'faltam ' + _ferPlural_(d, 'dia', 'dias'), 'amarelo');
      tag = _ferTag_(d <= 15 ? 'Urgente' : (d <= 30 ? 'Atenção' : 'Vence em breve'), 'amarelo');
    }
    return { cels: [
      _ferColab_(x.nome, sub, '', vencidas ? 'fer-av-venc' : 'fer-av-crit'),
      _ferDado_(_ferPlural_(Number(x.saldo || 0), 'dia', 'dias')),
      prazo,
      tag,
      _rescAcoesHtml_([{ p: 1, t: 'Memória de cálculo', fn: "verProvisao(null, '" + _rescArgJs_(x.idPeriodo) + "')" }])
    ] };
  });
  const aviso = totalReal > todos.length
    ? 'A lista mostra os ' + todos.length + ' ' + (vencidas ? 'vencidos há mais tempo' : 'que vencem primeiro') + ', de ' + _ferMilhar_(totalReal) + ' no total.' : '';
  $('listaVencidos').innerHTML = _ferTabelaHtml_('prazos', [
    { t: 'Colaborador' }, { t: 'Saldo', data: 1 }, { t: 'Conceder até', data: 1 }, { t: 'Situação', cls: 'resc-situacao' }, { t: 'Ações', cls: 'resc-col-acoes' }
  ], linhas, aviso);
}

function renderAfast(){
  if(!AFAST_FILA){ _moduloSemDados_('AFASTAMENTOS', 'listaAfast'); return; }
  const grupos = {
    atestado: AFAST_FILA.emAtestado,
    inss: AFAST_FILA.encaminhadosINSS,
    prorrogados: AFAST_FILA.prorrogados,
    retorno: AFAST_FILA.aguardandoRetorno,
    encerrados: AFAST_FILA.encerrados
  };
  Object.keys(grupos).forEach(k => atualizarContagemSub('afastCont_' + k, listaSegura(grupos[k]).length));
  document.querySelectorAll('#afastSubnav .sub').forEach(b => b.classList.toggle('on', b.dataset.sub === AFAST_SUBABA));

  const lista = grupos[AFAST_SUBABA] || [];
  if(!lista.length){ $('listaAfast').innerHTML = '<div class="vazio">Nada por aqui.</div>'; return; }

  $('listaAfast').innerHTML = lista.map(o => {
    let acoes = '';
    if(AFAST_SUBABA === 'atestado' || AFAST_SUBABA === 'inss'){
      acoes = '<button class="b ver" onclick="abrirAfastPericia(\'' + o.id + '\')">Agendar perícia</button>' +
        '<button class="b sim" onclick="abrirAfastDecisao(\'' + o.id + '\')">Registrar decisão</button>';
    } else if(AFAST_SUBABA === 'prorrogados'){
      acoes = '<button class="b sim" onclick="abrirAfastProrrogar(\'' + o.id + '\')">Prorrogar</button>';
    } else if(AFAST_SUBABA === 'retorno'){
      acoes = '<button class="b ver" onclick="abrirAfastExame(\'' + o.id + '\')">Exame ocupacional</button>' +
        '<button class="b sim" onclick="abrirAfastRetornar(\'' + o.id + '\')">Confirmar retorno</button>';
    }
    const tagAcidente = o.acidenteTrabalho ? ' <span class="tag al">acidente trabalho</span>' : '';
    return '<div class="item">' +
      '<div class="ini">' + esc(ini(o.nome)) + '</div>' +
      '<div class="info"><b>' + esc(o.nome) + tagAcidente + '</b>' +
      '<span>' + esc(o.tipo) + ' · ' + o.dias + ' dias · início ' + dBR(o.inicio) + '</span></div>' +
      '<div class="col"><div class="k">Fim previsto</div><div class="v">' + dBR(o.fim) + '</div></div>' +
      (o.exameOcupacionalResultado ? '<div class="col"><div class="k">Exame</div><div class="v">' + esc(o.exameOcupacionalResultado) + '</div></div>' : '') +
      (o.dataRetorno ? '<div class="col"><div class="k">Retorno</div><div class="v">' + dBR(o.dataRetorno) + '</div></div>' : '') +
      (o.estabilidadeAte ? '<div class="col"><div class="k">Estabilidade até</div><div class="v">' + dBR(o.estabilidadeAte) + '</div></div>' : '') +
      '<div class="acoes">' + acoes + '</div>' +
    '</div>';
  }).join('');
}
