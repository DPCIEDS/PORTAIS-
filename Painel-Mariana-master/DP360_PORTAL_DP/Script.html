  }catch(e){
    $('listaAgendadas').innerHTML = _ferVazio_('Não consegui carregar as férias agendadas: ' + esc(e.message) +
      '<br><br><button class="b ver" onclick="carregarAgendadas()">Tentar de novo</button>');
    toast(e.message, 'err');

/* [2026-10-29] Envio ao financeiro POR DEPARTAMENTO (pedido da Taynara). Sem mês escolhido, a lista é só
 * consulta, agrupada por mês de início. Com o mês escolhido, cada departamento vira um bloco: em cada pessoa o
 * número WEB, o valor líquido e banco/agência/conta (gravados ao sair do campo), a data de pagamento e o recibo
 * achado na pasta FÉRIAS; no bloco, o arquivo bancário e UM botão "Enviar ao financeiro", que só libera quando
 * não falta nada de ninguém. "Importar BI Férias" preenche valor e banco pelo relatório do Alterdata. A API
 * confere tudo de novo antes de enviar (FERIAS.FINANCEIRO_ENVIAR_DEPTO). */
const FERFIN_ARQ = {};      // departamento|mês → arquivos bancários escolhidos (File[])
const FERFIN_LEITURA = {};  // departamento|mês → resposta da leitura do arquivo bancário (FERIAS.FINANCEIRO_LER_ARQUIVO)
let FERFIN_DEPTOS = [];     // departamentos na ordem da tela (o índice vai nos botões)
let FERFIN_ENVIANDO = '';   // departamento sendo enviado agora
let FERFIN_LENDO = '';      // departamento cujo arquivo bancário está sendo lido agora
/* [2026-11-03] Os anexos e a leitura valem para o departamento NO MÊS escolhido (antes era só o departamento). */
function _ferfinChave_(depto, mes){ return depto + '|' + (mes || (FER_FILTRO.agendadas || {}).mes || ''); }

const _FERFIN_SEM_DEPTO = '(sem departamento)';
function _ferfinDepto_(a){ return a.departamento || _FERFIN_SEM_DEPTO; }

function _ferAgendSituacao_(a){
  if(!a.enviadoFinanceiro) return 'nao';
  return a.dentroDoPrazo === false ? 'fora' : 'no';
}

/** "1011/2026", "web 1011/2026" → "WEB:1011/2026"; '' se vazio; null se não der para ler (mesma regra da API). */
function _ferfinWebNorm_(v){
  const s = String(v || '').trim().toUpperCase().replace(/\s+/g, '');
  if(!s) return '';
  const m = s.match(/^(?:WEB:?)?(\d+)\/(\d{4})$/);
  return m ? 'WEB:' + Number(m[1]) + '/' + m[2] : null;
}
function _ferfinLerValor_(t){
  let s = String(t == null ? '' : t).replace(/R\$|\s/g, '');
  if(!s) return null;
  if(s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : null;
}
function _ferfinValorTxt_(n){ return n > 0 ? Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : ''; }

/** O que falta para a pessoa poder ir ao financeiro (a API confere o mesmo). */
function _ferfinFaltas_(a){
  const f = a.financeiro || {}, falta = [];
  if(!f.web) falta.push('WEB'); else if(_ferfinWebNorm_(f.web) === null) falta.push('WEB inválido');
  if(!(f.valorLiquido > 0)) falta.push('valor');
  if(!String(f.banco || '').trim() || !String(f.agencia || '').trim() || !String(f.conta || '').trim()) falta.push('banco/agência/conta');
  if(!f.recibo) falta.push('recibo na pasta FÉRIAS');
  if(!f.dataPagamento) falta.push(f.dataPagamentoErro || 'data de pagamento');
  // [2026-11-03] arquivo bancário lido: a pessoa tem que estar nele, com o mesmo valor (a API confere o mesmo)
  const lei = FERFIN_LEITURA[_ferfinChave_(_ferfinDepto_(a), String(a.inicio || '').slice(0, 7))];
  if(lei && lei.cnab && !a.enviadoFinanceiro){
    const pg = (lei.porId || {})[a.id];
    if(!pg) falta.push('não está no arquivo bancário');
    else if(f.valorLiquido > 0 && Math.abs(f.valorLiquido - pg.valor) > 0.004) falta.push('valor diferente do arquivo bancário (' + brl(pg.valor) + ')');
  }
  return falta;
}

/** Pendentes de envio do departamento no mês escolhido: é exatamente o que o botão manda (sem busca nem filtros). */
function _ferfinPendentes_(depto, mes){
  return (AGENDADAS_CACHE || []).filter(a => !a.enviadoFinanceiro && _ferfinDepto_(a) === depto && String(a.inicio || '').slice(0, 7) === mes);
}

function renderAgendadas(lista){
  _ferCartoes_();
  lista = lista || [];

  const semEnvio = lista.filter(a => !a.enviadoFinanceiro).length;
  $('agendInfo').innerHTML = lista.length ? '<b>' + _ferMilhar_(semEnvio) + '</b> de ' + _ferMilhar_(lista.length) + ' sem enviar ao financeiro' : '';

  const filtro = FER_FILTRO.agendadas || (FER_FILTRO.agendadas = {});
  const sel = $('agendFiltroMes');
  if(sel){
    const meses = Array.from(new Set(lista.map(a => String(a.inicio || '').slice(0, 7)).filter(Boolean))).sort().reverse();
    if(filtro.mes && meses.indexOf(filtro.mes) < 0) filtro.mes = '';
    sel.innerHTML = '<option value="">Início: Todos os meses</option>' + meses.map(m =>
      '<option value="' + m + '"' + (filtro.mes === m ? ' selected' : '') + '>' + esc(_rescNomeTitulo_(_rescMesExtenso_(m))) + '</option>').join('');
  }
  const selD = $('agendFiltroDepto');
  if(selD){
    const deptos = Array.from(new Set(lista.map(_ferfinDepto_))).sort((a, b) => a.localeCompare(b));
    if(filtro.depto && deptos.indexOf(filtro.depto) < 0) filtro.depto = '';
    selD.innerHTML = '<option value="">Departamento: Todos</option>' + deptos.map(d =>
      '<option value="' + esc(d) + '"' + (filtro.depto === d ? ' selected' : '') + '>' + esc(d) + '</option>').join('');
  }

  if(!lista.length){ $('listaAgendadas').innerHTML = _ferfinPainel_(_ferVazio_('Nenhuma férias confirmada ainda.')); return; }
  const busca = _ferNorm_(filtro.busca);
  const vis = lista.filter(a => {
    if(filtro.mes && String(a.inicio || '').slice(0, 7) !== filtro.mes) return false;
    if(filtro.depto && _ferfinDepto_(a) !== filtro.depto) return false;
    if(filtro.fin && _ferAgendSituacao_(a) !== filtro.fin) return false;
    if(busca && _ferNorm_([a.nome, a.departamento, (a.financeiro || {}).matricula].join(' ')).indexOf(busca) < 0) return false;
    return true;
  });
  if(!vis.length){ $('listaAgendadas').innerHTML = _ferfinPainel_(_ferVazio_('Nenhuma férias com esses filtros.')); return; }

  if(filtro.mes){ $('listaAgendadas').innerHTML = _ferfinBlocosHtml_(vis, filtro.mes); return; }

  // sem mês escolhido: só consulta, agrupada por mês de início
  const hoje = new Date(); const hoje12 = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate(), 12);
  const linhas = vis.map(a => ({
    grupo: _rescMesExtenso_(String(a.inicio || '').slice(0, 7)),
    cels: [
      _ferColab_(a.nome, esc(a.departamento || '—')),
      _ferDado_(dBR(a.inicio) + ' a ' + dBR(a.fim), _ferPlural_(Number(a.dias || 0), 'dia', 'dias') + (a.abono ? ' + ' + a.abono + ' vendidos' : '')),
      _ferfinPagamentoHtml_(a, hoje12),
      _ferfinSituacaoHtml_(a),
      _rescAcoesHtml_(_ferfinAcoes_(a))
    ]
  }));
  $('listaAgendadas').innerHTML = _ferfinPainel_(_ferTabelaHtml_('agendadas', [
    { t: 'Colaborador' }, { t: 'Férias', data: 1 }, { t: 'Pagamento', data: 1 }, { t: 'Financeiro', cls: 'resc-situacao' }, { t: 'Ações', cls: 'resc-col-acoes' }
  ], linhas, 'Para preencher WEB e valor e <b>enviar ao financeiro por departamento</b>, escolha o <b>mês de início</b> no filtro acima.'));
}

/** Quadro branco da lista (os blocos por departamento já são quadros, cada um). */
function _ferfinPainel_(html){ return '<div class="painel resc-painel"><div class="painel-corpo">' + html + '</div></div>'; }

function _ferfinPagamentoHtml_(a, hoje12){
  const f = a.financeiro || {};
  if(a.enviadoFinanceiro) return _ferDado_(dBR(a.vencimentoPagamento), a.enviadoFinanceiroEm ? 'enviado em ' + dBR(a.enviadoFinanceiroEm) : '');
  if(!f.dataPagamento) return '<span class="resc-tag vermelho">' + esc(f.dataPagamentoErro || 'sem data') + '</span>';
  const venc = _ferIsoParaData_(f.dataPagamento);
  const d = Math.round((venc - hoje12) / 86400000);
  return _ferDado_(dBR(f.dataPagamento), d < 0 ? 'passou há ' + _ferPlural_(-d, 'dia', 'dias') : (d === 0 ? 'é hoje' : 'faltam ' + _ferPlural_(d, 'dia', 'dias')),
    d <= 2 ? 'vermelho' : (d <= 7 ? 'amarelo' : ''));
}
function _ferfinSituacaoHtml_(a){
  const f = a.financeiro || {};
  const sit = _ferAgendSituacao_(a);
  if(sit === 'nao') return _ferTag_('Não enviado', 'amarelo');
  const sub = [f.web, a.antecedenciaDias !== null && a.antecedenciaDias !== undefined ? _ferPlural_(a.antecedenciaDias, 'dia', 'dias') + ' antes do pagamento' : ''].filter(Boolean).join(' · ');
  return sit === 'fora' ? _ferTag_('Enviado fora do prazo', 'vermelho', sub) : _ferTag_('Enviado', 'verde', sub);
}
function _ferfinAcoes_(a){
  if(a.enviadoFinanceiro) return a.documentoLink ? [{ p: 1, t: 'Ver arquivo bancário', href: a.documentoLink }] : [];
  return [
    { p: 1, t: 'Preparar envio', forte: 1, fn: "ferfinIrPara('" + _rescArgJs_(String(a.inicio || '').slice(0, 7)) + "', '" + _rescArgJs_(_ferfinDepto_(a)) + "')" },

function _ferfinBlocosHtml_(vis, mes){
  const porDepto = {};
  vis.forEach(a => { (porDepto[_ferfinDepto_(a)] = porDepto[_ferfinDepto_(a)] || []).push(a); });
  FERFIN_DEPTOS = Object.keys(porDepto).sort((a, b) => a.localeCompare(b));
  const hoje = new Date(); const hoje12 = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate(), 12);
  return FERFIN_DEPTOS.map((d, i) => {
    const linhas = porDepto[d].slice().sort((a, b) => String(a.nome).localeCompare(String(b.nome))).map(a => _ferfinLinhaHtml_(a, hoje12)).join('');

      '<div class="ferfin-cab" id="ferfinCab' + i + '">' + _ferfinCabHtml_(i, mes) + '</div>' +

          '<th scope="col">' + esc(t) + '</th>').join('') +
      '</tr></thead><tbody>' + linhas + '</tbody></table></div></div>';
  }).join('');

function _ferfinCabHtml_(i, mes){
  const depto = FERFIN_DEPTOS[i];
  const todas = (AGENDADAS_CACHE || []).filter(a => _ferfinDepto_(a) === depto && String(a.inicio || '').slice(0, 7) === mes);
  const pend = _ferfinPendentes_(depto, mes);
  const total = pend.reduce((t, a) => t + ((a.financeiro || {}).valorLiquido || 0), 0);
  const datas = Array.from(new Set(pend.map(a => (a.financeiro || {}).dataPagamento).filter(Boolean))).sort().map(dBR);
  const enviadas = todas.length - pend.length;
  let h = '<div><h3>' + esc(depto) + '</h3><div class="ferfin-sub">' +
    (pend.length ? _ferPlural_(pend.length, 'pessoa a enviar', 'pessoas a enviar') + ' · ' + brl(total) + (datas.length ? ' · pagamento ' + datas.join(', ') : '') : 'Nada a enviar') +
    (enviadas ? ' · ' + _ferPlural_(enviadas, 'já enviada', 'já enviadas') : '') + '</div></div>';
  if(!pend.length) return h + '<span class="resc-tag verde">Tudo enviado</span>';

  const faltas = pend.map(a => [a, _ferfinFaltas_(a)]).filter(x => x[1].length);
  const chave = _ferfinChave_(depto, mes);
  const arqs = FERFIN_ARQ[chave] || [];
  const enviando = FERFIN_ENVIANDO === depto;
  const lendo = FERFIN_LENDO === depto;
  const libera = !faltas.length && arqs.length && !FERFIN_ENVIANDO && !FERFIN_LENDO;
  h += '<div class="ferfin-envio">' +
    '<label class="resc-btn-acao ferfin-anexo"' + (lendo || enviando ? ' aria-disabled="true"' : '') + '>' +
      (lendo ? 'Lendo o arquivo…' : (arqs.length ? 'Trocar arquivo bancário' : 'Anexar arquivo bancário')) +
      '<input type="file" multiple hidden' + (lendo || enviando ? ' disabled' : '') + ' onchange="ferfinArquivo(' + i + ', this)"></label>' +
    '<button type="button" class="resc-btn-acao forte verde"' + (libera ? '' : ' disabled') + ' onclick="ferfinEnviar(' + i + ')">' +
      (enviando ? 'Enviando…' : 'Enviar ao financeiro') + '</button>' +
    (arqs.length ? '<div class="ferfin-arqs">📎 ' + arqs.map(f => esc(f.name)).join(', ') + '</div>' : '<div class="ferfin-arqs">Falta o arquivo bancário.</div>') +
    '</div>';
  h += _ferfinLeituraHtml_(FERFIN_LEITURA[chave]);
  if(faltas.length) h += '<div class="ferfin-faltas"><b>Envio bloqueado, falta:</b> ' +
    faltas.map(x => esc(_rescNomeTitulo_(x[0].nome)) + ' (' + esc(x[1].join(', ')) + ')').join(' · ') + '</div>';
  return h;
}

/** Redesenha só o cabeçalho do departamento (para não tirar o foco dos campos enquanto a pessoa digita). */
function _ferfinAtualizarCab_(depto){
  const i = FERFIN_DEPTOS.indexOf(depto);
  const el = $('ferfinCab' + i);
  if(i > -1 && el) el.innerHTML = _ferfinCabHtml_(i, (FER_FILTRO.agendadas || {}).mes);
}

async function ferfinSalvar(id, campo, el){
  const a = (AGENDADAS_CACHE || []).find(x => x.id === id);
  if(!a) return;
  const f = a.financeiro || (a.financeiro = {});
  let valor = String(el.value || '');
  if(campo === 'web'){
    const w = _ferfinWebNorm_(valor);
    if(w === null){ el.classList.add('ferfin-erro'); return toast('Número WEB inválido. Use o formato WEB:1011/2026.', 'err'); }
    valor = w; el.value = w;
  }
  if(campo === 'valor'){
    const n = _ferfinLerValor_(valor);
    if(valor.trim() && !(n > 0)){ el.classList.add('ferfin-erro'); return toast('Valor inválido. Use, por exemplo, 2.207,15.', 'err'); }
    valor = n > 0 ? n : ''; el.value = _ferfinValorTxt_(n);
  }
  el.classList.remove('ferfin-erro', 'ferfin-ok'); el.classList.add('ferfin-salvando');
  try{
    const dados = { id: id }; dados[campo] = valor;
    await chamar('srvFerFinSalvar', TOKEN, dados);
    if(campo === 'valor') f.valorLiquido = valor || null;
    else f[campo] = valor;
    // banco, agência e conta são do cadastro: valem para as outras férias da mesma pessoa na lista
    if(['banco', 'agencia', 'conta'].indexOf(campo) > -1){
      (AGENDADAS_CACHE || []).forEach(x => { if(x.idColaborador === a.idColaborador && x.financeiro) x.financeiro[campo] = valor; });
    }
    el.classList.remove('ferfin-salvando'); el.classList.add('ferfin-ok');
    setTimeout(() => el.classList.remove('ferfin-ok'), 1500);
    _ferfinAtualizarCab_(_ferfinDepto_(a));
  }catch(e){
    el.classList.remove('ferfin-salvando'); el.classList.add('ferfin-erro');
    toast(e.message, 'err');
  }
}

/* [2026-11-03] Anexar o arquivo bancário já manda o arquivo para a API ler: a remessa do banco (CNAB 240)
 * preenche valor, banco, agência e conta de cada pessoa do departamento, achada pelo CPF. */
async function ferfinArquivo(i, input){
  const depto = FERFIN_DEPTOS[i], mes = (FER_FILTRO.agendadas || {}).mes;
  const arqs = Array.from(input.files || []);
  if(!depto || !mes || !arqs.length) return;
  const chave = _ferfinChave_(depto, mes);
  FERFIN_ARQ[chave] = arqs;
  delete FERFIN_LEITURA[chave];
  FERFIN_LENDO = depto;
  _ferfinAtualizarCab_(depto);
  try{
    const arquivos = await Promise.all(arqs.map(_ferfinLerArquivo_));
    const r = await chamar('srvFerFinLerArquivo', TOKEN, { departamento: depto, mes: mes, arquivos: arquivos });
    FERFIN_LEITURA[chave] = r;
    FERFIN_LENDO = '';
    toast(r.mensagem, 'suc');
    if(r.cnab) await carregarAgendadas();   // valores e contas novos na tela
  }catch(e){
    toast('O arquivo ficou anexado, mas não consegui lê-lo: ' + e.message, 'err');
  }finally{
    FERFIN_LENDO = '';
    _ferfinAtualizarCab_(depto);
  }
}

function _ferfinLerArquivo_(file){
  return new Promise((ok, falha) => {
    const r = new FileReader();
    r.onload = () => ok({ base64: String(r.result).split(',')[1], nome: file.name, tipo: file.type || 'application/octet-stream' });
    r.onerror = () => falha(new Error('Não consegui ler o arquivo ' + file.name + '.'));
    r.readAsDataURL(file);
  });
}

async function ferfinEnviar(i){
  const depto = FERFIN_DEPTOS[i], mes = (FER_FILTRO.agendadas || {}).mes;
  if(!depto || !mes || FERFIN_ENVIANDO || FERFIN_LENDO) return;
  const pend = _ferfinPendentes_(depto, mes);
  const faltas = pend.filter(a => _ferfinFaltas_(a).length);
  if(faltas.length) return toast('Ainda falta informação de ' + _ferPlural_(faltas.length, 'pessoa', 'pessoas') + ' de ' + depto + '.', 'err');
  const arqs = FERFIN_ARQ[_ferfinChave_(depto, mes)] || [];
  if(!arqs.length) return toast('Anexe o arquivo bancário de ' + depto + '.', 'err');
  const total = pend.reduce((t, a) => t + a.financeiro.valorLiquido, 0);
  const mesBr = mes.slice(5) + '/' + mes.slice(0, 4);
  if(!confirm('Enviar ao financeiro as férias de ' + depto + ' com início em ' + mesBr + '?\n\n' +
    _ferPlural_(pend.length, 'pessoa', 'pessoas') + ' · ' + brl(total) + '\n\n' +
    'Vai um e-mail com os dados de todos, o arquivo bancário e os recibos, e as linhas entram na planilha Controle Web.')) return;
  FERFIN_ENVIANDO = depto;
  FERFIN_DEPTOS.forEach(d => _ferfinAtualizarCab_(d));
  try{
    const arquivos = await Promise.all(arqs.map(_ferfinLerArquivo_));
    const r = await chamar('srvFerFinEnviarDepto', TOKEN, { departamento: depto, mes: mes, ids: pend.map(a => a.id), arquivos: arquivos });
    delete FERFIN_ARQ[_ferfinChave_(depto, mes)];
    delete FERFIN_LEITURA[_ferfinChave_(depto, mes)];
    toast(r.mensagem, r.planilha === 'ok' ? 'suc' : 'err');
    FERFIN_ENVIANDO = '';
    await carregarAgendadas();
  }catch(e){
    toast(e.message, 'err');
  }finally{
    FERFIN_ENVIANDO = '';
    FERFIN_DEPTOS.forEach(d => _ferfinAtualizarCab_(d));
  }
}

async function ferfinImportarBI(input){
  const f = input.files && input.files[0];
  if(!f) return;
  if(!/\.(xls|xlsx)$/i.test(f.name)){ input.value = ''; return toast('Use o arquivo .xls ou .xlsx do BI Férias.', 'err'); }
  const b = $('ferfinBtnBI');

    const dataUri = await new Promise((ok, falha) => {
      const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => falha(new Error('Não consegui ler o arquivo.')); r.readAsDataURL(f);
    });
    const r = await chamar('processarBIFeriasDataUri', dataUri, f.name, TOKEN);
    const extra = [].concat(
      (r.naoEncontradas || []).length ? ['Sem férias deferidas com o mesmo início no DP360: ' + r.naoEncontradas.join(', ')] : [],
      (r.valorIlegivel || []).length ? ['Valor ilegível: ' + r.valorIlegivel.join(', ')] : []);

      extra.map(t => '<br>' + esc(t)).join('') + '</div>';
    toast(r.mensagem, 'suc');
    await carregarAgendadas();
  }catch(e){
    toast(e.message, 'err');
  }finally{
    livre(b);
    input.value = '';
  }
}

async function estornarFeriasDeferida(id, nome){

async function confirmarRescNova(){
  limpa('rnMsg');

  const idColaborador = $('rnColabId').value;
  if(!idColaborador) return msg('rnMsg', 'Escolha um colaborador clicando numa sugestão da lista (não vale só digitar o nome).');

  const justificativa = $('rnJustificativa').value.trim();
  if(!justificativa) return msg('rnMsg', 'Informe a justificativa.');

  const tipoCod = $('rnTipo').value;
  const tipo = (RESC_GLOBAL_CTX.tipos || []).find(t => t.cod === tipoCod);

  const dados = {
    idColaborador: idColaborador,
    tipoCod: tipoCod,
    modo: $('rnModo').value,
    observacao: justificativa
  };

  if(tipo && tipo.pedeAviso) dados.avisoModalidade = $('rnAvisoModalidade').value;

  // Estabilidade acidentária (Lei 8.213/91 art. 118): se a caixa de confirmação já apareceu
  // numa tentativa anterior, manda a confirmação + justificativa junto desta vez.
  const boxEstabilidadeAberto = $('rnBoxEstabilidade').style.display !== 'none';
  if(boxEstabilidadeAberto){
    if(!$('rnConfirmarEstabilidade').checked) return msg('rnMsg', 'Marque a confirmação para prosseguir com a estabilidade ativa.');
    const justEstab = $('rnJustificativaEstabilidade').value.trim();
    if(!justEstab) return msg('rnMsg', 'Informe a justificativa da dispensa durante a estabilidade.');
    dados.confirmarEstabilidade = true;
    dados.justificativaEstabilidade = justEstab;
  }

  const b = $('rnBtn');
  ocupado(b, 'Registrando…');
  try{
    if(tipo && tipo.pedeCarta){
      const arq = $('rnArquivoCarta');
      if(arq.files[0]){
        const f = await lerArquivo(arq);
        dados.cartaBase64 = f.base64; dados.cartaNome = f.nome; dados.cartaTipo = f.tipo;
      }
    }
    if(tipo && tipo.pedeLaudo){
      const arqLaudo = $('rnArquivoLaudo');
      if(arqLaudo.files[0]){
        const f = await lerArquivo(arqLaudo);
        dados.laudoBase64 = f.base64; dados.laudoNome = f.nome; dados.laudoTipo = f.tipo;
      }
    }
    const r = await chamar('srvRescSolicitarDP', TOKEN, dados);
    fechar('ovRescNova');
    toast(r.mensagem || 'Rescisão registrada.', 'suc');
    RESC_FILA = await chamar('srvRescFila', TOKEN);
    renderResc();
  }catch(e){
    // Mensagem vem de Rescisão.js (rescSolicitar) — se for o caso de estabilidade ativa,
    // revela a caixa de confirmação em vez de só mostrar o texto cru do erro.
    if(!boxEstabilidadeAberto && /estabilidade (acidentária )?ativa/i.test(e.message || '')){
      $('rnEstabilidadeAviso').textContent = e.message;
      ver('rnBoxEstabilidade', true);
      msg('rnMsg', 'Confirme na caixa vermelha para prosseguir, ou feche esta janela.');
      $('rnBoxEstabilidade').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else {
      msg('rnMsg', e.message);
    }
  }finally{ livre(b); }
}

async function atualizarRecibos(btn){
  btn.disabled = true; btn.classList.add('girando');
  try{
    await renderRecibos(true); // força reler a pasta do Drive, não espera o cache de 30min
    // A checagem em tempo real no Autentique só roda quando a aba "Recibos Enviados" está
    // selecionada — é a única aba onde isso importa, e é uma chamada mais lenta/cara, então não
    // deve rodar (nem "girar") nas outras abas. Mesmo padrão do atualizarHomolog.
    if(RECIBOS_SUBABA === 'enviados'){
      const r = await chamar('srvFeriasVerificarRecibosLote', TOKEN);
      if(r && r.verificados && RECIBOS && RECIBOS.lista){
        let assinados = 0;
        r.verificados.forEach(v => {
          if(!v.ok) return;
          const item = RECIBOS.lista.find(x => x.id === v.idSolicitacao);
          if(item){ item.assinado = v.assinado; if(v.assinado) item.statusAutentique = 'Assinado'; }

        });
        renderRecibosLista();
        toast('Verificação concluída: ' + r.verificados.length + ' checados, ' + assinados + ' assinados por todo mundo.', 'suc');
      }
    }
  }
  catch(e){ toast(e.message, 'err'); }
  finally{ btn.disabled = false; btn.classList.remove('girando'); }
}

function renderRecibosLista(){
  const cont = $('listaRecibos');
  _ferCartoes_();
  if(!cont || !RECIBOS) return;

  document.querySelectorAll('#recibosSubnav .sub').forEach(b => {
    const on = b.dataset.sub === RECIBOS_SUBABA;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  ver('btnEnviarTodosRecibos', RECIBOS_SUBABA === 'prontosEnvio');
  ver('btnBaixarTodosRecibos', RECIBOS_SUBABA === 'enviados');
  const qtdProntosEnvio = RECIBOS.lista.filter(r => !r.enviado && r.temRecibo && r.temEmail).length;
  const qtdProntosBaixar = RECIBOS.lista.filter(r => r.enviado && !r.baixado && r.assinado).length;
  ver('badgeEnviarTodosRecibos', qtdProntosEnvio > 0);
  ver('badgeBaixarTodosRecibos', qtdProntosBaixar > 0);
  $('badgeEnviarTodosRecibos').textContent = qtdProntosEnvio;
  $('badgeBaixarTodosRecibos').textContent = qtdProntosBaixar;

  const contar = (id, n) => { const el = $(id); if(el) el.textContent = _ferMilhar_(n); };
  contar('recibosCont_pendentes', RECIBOS.lista.filter(r => !r.enviado && !r.temRecibo).length);
  contar('recibosCont_prontosEnvio', RECIBOS.lista.filter(r => !r.enviado && r.temRecibo).length);
  contar('recibosCont_enviados', RECIBOS.lista.filter(r => r.enviado && !r.baixado).length);
  contar('recibosCont_assinados', RECIBOS.lista.filter(r => r.enviado && r.baixado).length);

  let lista = RECIBOS.lista.filter(r => {
    if(RECIBOS_SUBABA === 'assinados')    return r.enviado && r.baixado;
    if(RECIBOS_SUBABA === 'enviados')     return r.enviado && !r.baixado;
    if(RECIBOS_SUBABA === 'prontosEnvio') return !r.enviado && r.temRecibo;
    return !r.enviado && !r.temRecibo; // pendentes
  });
  const busca = _homologNorm_(RECIBOS_BUSCA);
  if(busca) lista = lista.filter(r => _homologNorm_(r.nome).indexOf(busca) > -1);

  if(!lista.length){
    cont.innerHTML = _ferVazio_(busca ? 'Ninguém encontrado para "' + esc(RECIBOS_BUSCA) + '".' :
      (RECIBOS_SUBABA === 'assinados' ? 'Nenhum recibo assinado e arquivado ainda.' :
       RECIBOS_SUBABA === 'enviados' ? 'Nenhum recibo aguardando assinatura.' :
       RECIBOS_SUBABA === 'prontosEnvio' ? 'Nenhum recibo pronto para envio no momento.' :
       'Todas as férias confirmadas já têm recibo na pasta.'));
    return;
  }

  const linhas = lista.map(r => {
    const id = _rescArgJs_(r.id);
    let tag, acoes;
    if(!r.enviado){
      if(!r.temRecibo){
        tag = _ferTag_('Sem recibo na pasta', 'cinza', 'gere o PDF no Alterdata');
        acoes = [];
      }else if(!r.temEmail){
        tag = _ferTag_('Sem e-mail cadastrado', 'amarelo', 'não dá para enviar ao Autentique');
        acoes = [{ p: 1, t: 'Ver recibo', fn: "verRecibo('" + id + "')" }];
      }else{
        tag = _ferTag_('Recibo encontrado', 'verde');
        acoes = [
          { p: 1, t: 'Enviar ao Autentique', forte: 1, verde: 1, fn: "feriasEnviarRecibo('" + id + "')" },
          { t: 'Ver recibo', fn: "verRecibo('" + id + "')" }
        ];
      }
    }else if(r.baixado){
      tag = _ferTag_('Assinado e arquivado', 'verde');
      acoes = r.assinadoLink ? [{ p: 1, t: 'Ver recibo assinado', href: r.assinadoLink, verde: 1 }] : [];
    }else if(r.assinado){
      tag = _ferTag_('Assinado', 'verde', 'falta baixar e arquivar');
      acoes = [{ p: 1, t: 'Baixar recibo', forte: 1, fn: "feriasBaixarRecibo('" + id + "')" }];
    }else{
      tag = _ferTag_('Aguardando assinatura', 'amarelo');
      acoes = [
        { p: 1, t: 'Verificar', fn: "feriasVerificarRecibo('" + id + "')" },
        { t: 'Cancelar envio…', perigo: 1, fn: "abrirCancelarRecibo('" + id + "')" }
      ];
    }
    return {
      grupo: _rescMesExtenso_(String(r.inicio || '').slice(0, 7)),
      cels: [
        _ferColab_(r.nome, 'Férias de ' + dBR(r.inicio) + ' a ' + dBR(r.fim)),
        _ferDado_(_ferPlural_(Number(r.dias || 0), 'dia', 'dias')),
        tag,
        acoes.length ? _rescAcoesHtml_(acoes) : '<span class="resc-sem-acao" title="Aparece aqui quando o PDF estiver na pasta">Aguardando PDF</span>'
      ]
    };
  });
  cont.innerHTML = _ferTabelaHtml_('recibos', [
    { t: 'Colaborador' }, { t: 'Dias', data: 1 }, { t: 'Situação', cls: 'resc-situacao' }, { t: 'Ações', cls: 'resc-col-acoes' }
  ], linhas);
}

/* ================= ADMISSÃO: VISUAL DA RESCISÃO (2026-10-14) ================= */
/* Pedido da Taynara: o mesmo visual do módulo de Rescisão. Cartões com contagem (Cadastros e as três
 * situações do kit), busca e filtros, e as listas em tabela (_rescTabelaHtml_ e _rescLinhaHtml_) com
 * a ação principal num botão e as outras no menu ⋮. As ações chamam as mesmas funções de antes. */

const ADM_PAG = { chave: '', pagina: 0 };
let ADM_MOSTRAR_TODOS = false;
let ADM_FILTRO_MES = '', ADM_FILTRO_SITUACAO = '', ADMKIT_FILTRO_MES = '';
let ADMKIT_PRECARGA = ''; // '' = não tentou; 'carregando'; 'feita'

const ADM_COR_STATUS = {
  'Cadastro recebido': 'verde', 'Em conferência pelo DP': 'azul', 'Pendência documental': 'vermelho',
  'Aguardando ASO': 'amarelo', 'ASO aprovado': 'azul', 'Cadastro no Alterdata': 'azul',
  'Aguardando documentos Alterdata': 'amarelo', 'Kit em preparação': 'amarelo', 'Kit pronto': 'azul',
  'Erro ao gerar kit': 'vermelho', 'Enviado para assinatura': 'amarelo', 'Aguardando assinatura': 'amarelo',
  'Assinado': 'verde', 'Admissão concluída': 'verde', 'Cancelada': 'cinza'
};

/** Cartão "Cadastros" ou um dos cartões do kit (pendentes, enviados, assinados). */
function admEtapa(sub){
  if(sub === 'cadastros'){
    if(ADM_SUBABA === 'cadastros') renderAdm(); else admIr('cadastros');
    return;
  }
  ADMKIT_SUBABA = sub;
  if(ADM_SUBABA === 'kit') renderAdmKitLista(); else admIr('kit');
}

function _admMarcarEtapa_(){
  const atual = ADM_SUBABA === 'kit' ? ADMKIT_SUBABA : 'cadastros';
  document.querySelectorAll('#admSubnav .sub').forEach(b => {
    const on = b.dataset.sub === atual;
    b.classList.toggle('on', on);
    if(on) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}

/** Data da planilha (aaaa-mm-dd, dd/mm/aaaa ou data com hora vinda da API) -> 'aaaa-mm-dd' ('' se não der). */
function _admDataISO_(v){
  const s = String(v == null ? '' : v).trim();
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const br = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(br) return br[3] + '-' + ('0' + br[2]).slice(-2) + '-' + ('0' + br[1]).slice(-2);
  const d = new Date(s);
  if(isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function _admRotuloMes_(chave){ return chave ? _rescMesExtenso_(chave) : 'SEM DATA DE ADMISSÃO'; }

/** Opções do filtro de mês: os meses de admissão que existem na lista, o mais recente primeiro. */
function _admMesesOpcoes_(lista){
  const meses = [];
  lista.forEach(x => {
    const m = _admDataISO_(x.dataAdmissao).slice(0, 7);
    if(m && !meses.some(o => o.valor === m)) meses.push({ valor: m, texto: _rescNomeTitulo_(_rescMesExtenso_(m)) });
  });
  return meses.sort((a, b) => b.valor.localeCompare(a.valor));
}

/** Admissão mais recente primeiro (sem data no fim) e, no mesmo dia, pelo nome. */
function _admOrdenar_(lista){
  return lista.map(x => ({ x: x, d: _admDataISO_(x.dataAdmissao), n: _homologNorm_(x.nome) }))
    .sort((a, b) => (a.d !== b.d) ? (!a.d ? 1 : (!b.d ? -1 : b.d.localeCompare(a.d))) : a.n.localeCompare(b.n))
    .map(o => o.x);
}

function admPagina(delta){
  ADM_PAG.pagina = Math.max(0, ADM_PAG.pagina + delta);
  if(ADM_SUBABA === 'kit') renderAdmKitLista(); else renderAdm();
  const box = $(ADM_SUBABA === 'kit' ? 'listaAdmKit' : 'listaAdm');
  if(box && box.getBoundingClientRect().top < 0) box.scrollIntoView({ block: 'start' });
}

function admMostrarTodos(todos){
  ADM_MOSTRAR_TODOS = !!todos;
  admPagina(-ADM_PAG.pagina); // volta para a 1ª página e redesenha
}

function admFiltrar(campo, v){
  if(campo === 'mes') ADM_FILTRO_MES = v; else ADM_FILTRO_SITUACAO = v;
  renderAdm();
}

  catch(e){ toast(e.message, 'err'); }

/** Contagem dos três cartões do kit (vem da lista do kit). */
function _admKitContagens_(){
  if(!ADMKIT || !Array.isArray(ADMKIT.lista)) return;
  const l = ADMKIT.lista;
  atualizarContagemSub('admKitCont_pendentes', l.filter(k => !k.enviado).length);
  atualizarContagemSub('admKitCont_enviados', l.filter(k => k.enviado && !k.baixado).length);
  atualizarContagemSub('admKitCont_assinados', l.filter(k => k.baixado).length);
}

/** Abrindo a Admissão nos Cadastros, a lista do kit é carregada uma vez em segundo plano, só para as
 *  contagens dos cartões (só com a seção na tela, não no login). */
function _admKitPreCarga_(){
  const sec = $('secAdmissao');
  if(!sec || sec.offsetParent === null) return;
  if(ADMKIT || ADMKIT_PRECARGA) return;
  ADMKIT_PRECARGA = 'carregando';
  chamar('srvAdmKitLista', TOKEN).then(r => {
    if(!ADMKIT && r && Array.isArray(r.lista)) ADMKIT = r; // não troca uma lista mais nova da aba do kit
    _admKitContagens_();
  }).catch(() => {}).then(() => { ADMKIT_PRECARGA = 'feita'; });
}

function _admLinhaCadastro_(x){
  const proto = _rescArgJs_(x.protocolo);
  const adm = _admDataISO_(x.dataAdmissao), cad = _admDataISO_(x.enviadoEm);
  const cpf = _admfCpf_(x.cpf);
  const status = x.status || 'Cadastro recebido';
  return _rescLinhaHtml_({
    nome: x.nome,
    sub: [cpf ? 'CPF ' + cpf : '', x.departamento || ''].filter(Boolean).join(' · '),
    rotuloData: 'Admissão',
    data: adm ? dBR(adm) : '—',
    dataSub: cad ? 'cadastro em ' + dBR(cad) : '',
    situacao: status, cor: ADM_COR_STATUS[status] || 'cinza',
    situacaoSub: 'ASO: ' + (x.asoStatus || '—') + ' · RioCard: ' + (x.usaRiocard ? (x.riocardStatus || 'Pendente') : 'não usa'),
    acoes: [
      { t: 'Abrir ficha', fn: "abrirAdmFicha('" + proto + "')", p: 1, forte: 1, verde: 1 },
      x.usaRiocard && { t: 'Gerar RioCard', fn: "admGerarRiocardUm('" + proto + "')" }
    ]
  });
}

function renderAdm(){
  _admMarcarEtapa_();
  if(!ADM_CTX){ _moduloSemDados_('ADMISSAO', 'listaAdm'); return; }
  const ind = ADM_CTX.indicadores || {};
  const todos = listaSegura(ADM_CTX.itens);
  atualizarContagemSub('admCont_cadastros', todos.length);
  const rq = $('admRiocardQtd');
  if(rq) rq.textContent = ind.riocardPendente ? ' (' + ind.riocardPendente + ' pendente' + (ind.riocardPendente === 1 ? '' : 's') + ')' : '';
  _admKitContagens_();
  _admKitPreCarga_();

  // Filtros de mês de admissão e de situação: as opções saem da lista.
  const meses = _admMesesOpcoes_(todos);
  const situacoes = [];
  todos.forEach(x => {
    const st = x.status || 'Cadastro recebido';
    if(!situacoes.some(o => o.valor === st)) situacoes.push({ valor: st, texto: st });
  });
  const ordem = st => { const i = ADM_STATUS_OPCOES.indexOf(st); return i < 0 ? 99 : i; };
  situacoes.sort((a, b) => ordem(a.valor) - ordem(b.valor) || a.texto.localeCompare(b.texto));
  if(ADM_FILTRO_MES && !meses.some(o => o.valor === ADM_FILTRO_MES)) ADM_FILTRO_MES = '';
  if(ADM_FILTRO_SITUACAO && !situacoes.some(o => o.valor === ADM_FILTRO_SITUACAO)) ADM_FILTRO_SITUACAO = '';
  _homologOpcoes_('admFiltroMes', 'Mês', meses, ADM_FILTRO_MES);
  _homologOpcoes_('admFiltroSituacao', 'Situação', situacoes, ADM_FILTRO_SITUACAO);

  let itens = todos;
  if(ADM_FILTRO_MES) itens = itens.filter(x => _admDataISO_(x.dataAdmissao).slice(0, 7) === ADM_FILTRO_MES);
  if(ADM_FILTRO_SITUACAO) itens = itens.filter(x => (x.status || 'Cadastro recebido') === ADM_FILTRO_SITUACAO);
  const busca = _homologNorm_(ADM_BUSCA), buscaCpf = String(ADM_BUSCA || '').replace(/\D/g, '');
  if(busca){
    itens = itens.filter(x => _homologNorm_(x.nome).indexOf(busca) > -1 ||
      (!!buscaCpf && String(x.cpf || '').replace(/\D/g, '').indexOf(buscaCpf) > -1));
  }

  if(!itens.length){
    $('listaAdm').innerHTML = '<div class="vazio">' + (busca ? 'Ninguém encontrado para "' + esc(ADM_BUSCA) + '".' :
      (ADM_FILTRO_MES || ADM_FILTRO_SITUACAO) ? 'Ninguém com esses filtros.' : 'Nenhuma admissão encontrada.') + '</div>';
    return;
  }

  // Admissão mais recente primeiro, com uma linha por mês de admissão.
  const linhas = _admOrdenar_(itens).map(x => ({ grupo: _admDataISO_(x.dataAdmissao).slice(0, 7), html: _admLinhaCadastro_(x) }));
  $('listaAdm').innerHTML = _rescTabelaHtml_('Admissão', linhas,
    'adm:' + ADM_FILTRO_MES + ':' + ADM_FILTRO_SITUACAO + ':' + busca,
    { pag: ADM_PAG, todos: ADM_MOSTRAR_TODOS, pref: 'adm', rotuloGrupo: _admRotuloMes_ });
}

/* [2026-10-13] Ficha da admissão redesenhada (pedido da Taynara: "mais bonita visualmente").
 * Resumo do andamento em cartões coloridos, dados da pessoa formatados (data, CPF, celular) e a
 * tratativa do DP em duas colunas. Os ids dos campos (admf*) não mudaram: admSalvarFicha lê deles. */
function _admfCpf_(v){
  const d = String(v == null ? '' : v).replace(/\D/g, '');
  if(!d) return '';
  return ('00000000000' + d).slice(-11).replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
}
function _admfFoneDigitos_(v){
  let d = String(v == null ? '' : v).replace(/\D/g, '');
  if(d.length === 13 && d.indexOf('55') === 0) d = d.slice(2);
  return d;
}
function _admfFone_(v){
  const d = _admfFoneDigitos_(v);
  if(d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  if(d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return String(v == null ? '' : v).trim();
}
/** Data da planilha (ISO com hora, aaaa-mm-dd ou dd/mm/aaaa) -> { br: 'dd/mm/aaaa', idade }. */
function _admfData_(v){
  const s = String(v == null ? '' : v).trim();
  if(!s) return null;
  let d = null, m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m && s.indexOf('T') > -1){ const x = new Date(s); if(!isNaN(x)) d = new Date(x.getFullYear(), x.getMonth(), x.getDate()); }
  else if(m) d = new Date(+m[1], +m[2] - 1, +m[3]);
  else { m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) d = new Date(+m[3], +m[2] - 1, +m[1]); }
  if(!d || isNaN(d)) return { br: s, idade: null };
  const h = new Date();
  let idade = h.getFullYear() - d.getFullYear();
  if(h.getMonth() < d.getMonth() || (h.getMonth() === d.getMonth() && h.getDate() < d.getDate())) idade--;
  const p2 = n => ('0' + n).slice(-2);
  return { br: p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear(), idade: idade };
}
/** Cor do cartão: ok (verde), al (amarelo, em andamento), cr (vermelho) ou neutro. */
function _admfTom_(valor){
  const v = _homologNorm_(valor);
  if(/inapto|erro|cancel|recus/.test(v)) return 'cr';
  if(/conclu|^assinado|apto|kit pronto|aprovado/.test(v)) return 'ok';
  if(/gerado|agendado|enviado|aguardando|prepara|reagend|conferencia|pendencia|alterdata/.test(v)) return 'al';
  return '';
}

function _admRenderFicha_(f){
  const c = f.cadastro || {};
  const t = f.tratativa || {};
  const item = f.item || {};
  const g = (obj, k) => esc(obj && obj[k] != null ? obj[k] : '');
  const prot = esc(c['Protocolo']);
  const opts = ADM_STATUS_OPCOES.map(s =>
    '<option value="' + esc(s) + '"' + ((t.STATUS === s) ? ' selected' : '') + '>' + esc(s) + '</option>').join('');

  $('admFichaNome').textContent = c['Nome completo'] || '';
  const cpf = _admfCpf_(c['CPF']);
  $('admFichaSub').textContent = (cpf ? 'CPF ' + cpf + ' · ' : '') + 'Protocolo ' + (c['Protocolo'] || '');

  // Andamento
  const etapa = (rotulo, valor, link) =>
    '<div class="admf-etapa ' + _admfTom_(valor) + '"><span>' + rotulo + '</span><b>' + esc(valor) + '</b>' + (link || '') + '</div>';
  const rio = item.usaRiocard ? (t.RIOCARD_STATUS || 'Pendente') : 'Não usa';
  const etapas =
    '<div class="admf-etapas">' +
      etapa('Etapa', t.STATUS || 'Cadastro recebido') +
      etapa('ASO', t.ASO_STATUS || 'Não iniciado') +
      etapa('RioCard', rio, t.RIOCARD_ARQUIVO_URL ? '<a href="' + esc(t.RIOCARD_ARQUIVO_URL) + '" target="_blank">Ver arquivo</a>' : '') +
      etapa('Kit', t.KIT_STATUS || 'Pendente') +
      etapa('Assinatura', t.ASSINATURA_STATUS || 'Não enviado', t.ASSINATURA_URL ? '<a href="' + esc(t.ASSINATURA_URL) + '" target="_blank">Ver assinado</a>' : '') +
    '</div>';

  // Dados da pessoa
  const dado = (rotulo, valorHtml) => '<div class="admf-dado"><span>' + rotulo + '</span><b>' + (valorHtml || '—') + '</b></div>';
  const nasc = _admfData_(c['Data de nascimento']);
  const email = String(c['E-mail pessoal'] || '').trim();
  const fone = _admfFone_(c['Celular/WhatsApp']);
  const foneDig = _admfFoneDigitos_(c['Celular/WhatsApp']);
  const vtQuer = String(c['Vale-transporte — deseja?'] || '').trim();
  const vtTipo = String(c['VT — tipo (Jaé/RioCard)'] || '').trim();
  const vt = /^s/i.test(vtQuer) ? 'Sim' + (vtTipo ? ' · ' + esc(vtTipo) : '') : (vtQuer ? 'Não' : '');
  const qDep = listaSegura(f.dependentes).length, qDoc = listaSegura(f.documentos).length;
  const dados =
    '<div class="admf-sec"><h4>Dados da pessoa</h4><div class="admf-dados">' +
      dado('Nascimento', nasc ? esc(nasc.br) + (nasc.idade != null ? '<small>' + nasc.idade + ' anos</small>' : '') : '') +
      dado('Celular / WhatsApp', fone ? esc(fone) + (foneDig.length >= 10 ? '<small><a href="https://wa.me/55' + foneDig + '" target="_blank">WhatsApp</a></small>' : '') : '') +
      dado('E-mail', email ? '<a href="mailto:' + esc(email) + '">' + esc(email) + '</a>' : '') +
      dado('Vale-transporte', vt) +
      dado('Dependentes', qDep ? String(qDep) : 'Nenhum') +
      dado('Documentos enviados', String(qDoc)) +
    '</div>' +
    (f.pastaUrl ? '<a class="b ver admf-pasta" href="' + esc(f.pastaUrl) + '" target="_blank">Abrir pasta no Drive</a>' : '') +
    '</div>';

  // Tratativa do DP (mesmos campos e ids de antes)
  const campo = (rotulo, html) => '<div class="campo"><label>' + rotulo + '</label>' + html + '</div>';
  const trat =
    '<div class="admf-sec"><h4>Tratativa do DP</h4><div class="admf-grade">' +
      campo('Etapa da admissão', '<select id="admfStatus">' + opts + '</select>') +
      campo('ASO', '<select id="admfAso">' +
        ['Não iniciado','Agendado','Realizado - Apto','Realizado - Inapto','Pendente reagendamento'].map(s =>
          '<option value="' + s + '"' + (t.ASO_STATUS === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>') +
      campo('Responsável', '<input id="admfResp" value="' + g(t,'RESPONSAVEL') + '">') +
      campo('Projeto', '<input id="admfProj" value="' + g(t,'PROJETO') + '">') +
      campo('Cargo', '<input id="admfCargo" value="' + g(t,'CARGO') + '">') +
      campo('Salário', '<input id="admfSalario" value="' + g(t,'SALARIO') + '">') +
      campo('Matrícula (Alterdata)', '<input id="admfMatricula" value="' + g(t,'MATRICULA') + '">') +
    '</div>' +
    campo('Pendências', '<textarea id="admfPend" rows="2">' + g(t,'PENDENCIAS') + '</textarea>') +
    campo('Observações internas', '<textarea id="admfObs" rows="2">' + g(t,'OBSERVACOES') + '</textarea>') +
    '</div>';

  const acoes =
    '<div class="admf-acoes">' +
      (item.usaRiocard ? '<button class="b ver" onclick="admGerarRiocardUm(\'' + prot + '\')">' + (t.RIOCARD_ARQUIVO_URL ? 'Regerar RioCard' : 'Gerar RioCard') + '</button>' : '') +
      (t.RIOCARD_ARQUIVO_URL && t.RIOCARD_STATUS !== 'Concluído' ? '<button class="b ver" onclick="admRiocardMarcarConcluido(\'' + prot + '\')">Marcar RioCard concluído</button>' : '') +
      '<button class="b pri" id="admfSalvarBtn" onclick="admSalvarFicha()">Salvar</button>' +
    '</div>';

  $('admFichaCorpo').innerHTML = etapas + dados + trat + acoes;
}

async function admSalvarFicha(){
  if(!ADM_ATUAL) return;
  limpa('admFichaMsg');
  const protocolo = ADM_ATUAL.cadastro['Protocolo'];
  const campos = {
    STATUS: $('admfStatus').value, ASO_STATUS: $('admfAso').value, RESPONSAVEL: $('admfResp').value.trim(),
    PROJETO: $('admfProj').value.trim(), CARGO: $('admfCargo').value.trim(),
    SALARIO: $('admfSalario').value.trim(), MATRICULA: $('admfMatricula').value.trim(),
    PENDENCIAS: $('admfPend').value.trim(), OBSERVACOES: $('admfObs').value.trim()
  };

  // Não bloqueia (o DP pode ter uma exceção legítima), mas avisa: nada no backend impede
  // marcar "Admissão concluída" sem RioCard/Kit resolvidos, então some um aviso aqui antes.
  if(campos.STATUS === 'Admissão concluída'){
    const t = (ADM_ATUAL && ADM_ATUAL.tratativa) || {};
    const item = (ADM_ATUAL && ADM_ATUAL.item) || {};
    const pendencias = [];
    if(item.usaRiocard && t.RIOCARD_STATUS !== 'Concluído') pendencias.push('RioCard (status atual: ' + (t.RIOCARD_STATUS || 'Pendente') + ')');
    if(t.KIT_STATUS && t.ASSINATURA_STATUS !== 'Assinado') pendencias.push('assinatura do kit (status atual: ' + (t.ASSINATURA_STATUS || 'Não enviado') + ')');
    if(pendencias.length && !confirm('Ainda em aberto: ' + pendencias.join(' · ') + '.\n\nMarcar como concluída mesmo assim?')) return;
  }

  const btn = $('admfSalvarBtn');
  ocupado(btn, 'Salvando…');
  try{
    await chamar('srvAdmSalvarTratativa', TOKEN, protocolo, campos);
    fechar('ovAdmFicha');
    toast('Tratativa salva.', 'suc');
    await admAtualizar();
  }catch(e){ msg('admFichaMsg', e.message); }
  finally{ livre(btn); }
}

/* Mesmo padrão de "Recibos de férias" acima: núcleo enviar/verificar/baixar/cancelar,
 * sessões Pendentes/Enviados/Assinados, botões de lote. */

function admKitIr(sub){

  renderAdmKitLista();
}

  ADMKIT_BUSCA = v;
  renderAdmKitLista();

  catch(e){ toast(e.message, 'err'); }

/** Uma linha da tabela do kit: situação colorida, a ação principal no botão e as outras no menu ⋮. */
function _admLinhaKit_(k){
  const proto = _rescArgJs_(k.protocolo);
  const adm = _admDataISO_(k.dataAdmissao);
  // Pedido: Enviados/Assinados mostram o documento no Autentique e, quando arquivado, o PDF no Drive.
  const autentique = k.linkAutentique ? { t: 'Ver no Autentique', href: k.linkAutentique } : null;
  let situacao = '', cor = 'cinza', situacaoSub = '', acoes = [];

  if(k.origem === 'CHECKLIST'){
    situacao = k.kitStatus || 'Sem pasta de admissão';
    cor = k.assinado ? 'verde' : (k.enviado ? 'amarelo' : 'vermelho'); // "Sem pasta de admissão" em vermelho
    acoes = [k.baixado && k.assinaturaUrl && { t: 'Ver kit assinado', href: k.assinaturaUrl, p: 1, forte: 1, verde: 1 }, autentique];
  } else if(!k.enviado && k.kitStatus === 'Kit em preparação'){
    // Gerando em segundo plano (1-2 min): sem botão, para não disparar dois gatilhos para a mesma
    // pessoa. A lista se atualiza sozinha (agendarAtualizacaoAdmKit).
    situacao = 'Kit em preparação'; cor = 'amarelo'; situacaoSub = 'a lista atualiza sozinha';
  } else if(!k.enviado && k.kitStatus === 'Erro ao gerar kit'){
    situacao = 'Erro ao gerar o kit'; cor = 'vermelho';
    acoes = [{ t: 'Gerar de novo', fn: "admKitGerarUm('" + proto + "')", p: 1, forte: 1 }];
  } else if(!k.enviado && k.kitStatus === 'Kit pronto'){
    // "Enviar ao Autentique" só com o kit pronto: "Pendente" (sem geração pedida) não pode subir.
    situacao = 'Kit pronto'; cor = 'azul';
    acoes = [{ t: 'Enviar ao Autentique', fn: "admKitEnviarUm('" + proto + "')", p: 1, forte: 1, verde: 1 },
      { t: 'Ver kit', fn: "verAdmKit('" + proto + "')" }];
  } else if(!k.enviado){
    situacao = k.kitStatus || 'Pendente'; cor = 'laranja';
    acoes = [{ t: 'Gerar kit', fn: "admKitGerarUm('" + proto + "')", p: 1, forte: 1, verde: 1 }];
  } else if(k.baixado){
    situacao = 'Assinado e arquivado'; cor = 'verde';
    acoes = [k.assinaturaUrl && { t: 'Ver kit assinado', href: k.assinaturaUrl, p: 1, forte: 1, verde: 1 }, autentique];
  } else if(k.assinado){
    situacao = 'Assinado'; cor = 'verde'; situacaoSub = 'falta baixar e arquivar';
    acoes = [{ t: 'Baixar e arquivar', fn: "admKitBaixarUm('" + proto + "')", p: 1, forte: 1 }, autentique];
  } else {
    situacao = 'Aguardando assinatura'; cor = 'amarelo';
    acoes = [{ t: 'Verificar assinatura', fn: "admKitVerificarUm('" + proto + "')", p: 1 }, autentique,
      { t: 'Cancelar envio', fn: "abrirCancelarAdmKit('" + proto + "')", perigo: 1 }];
  }

  return _rescLinhaHtml_({
    nome: k.nome,
    sub: [k.protocolo ? 'Protocolo ' + k.protocolo : '', k.lotacao || ''].filter(Boolean).join(' · '),
    rotuloData: 'Admissão',
    data: adm ? dBR(adm) : '—',
    situacao: situacao, cor: cor, situacaoSub: situacaoSub,
    acoes: acoes
  });
}

function renderAdmKitLista(){
  const cont = $('listaAdmKit');
  _admMarcarEtapa_();
  if(!cont || !ADMKIT) return;
  const todos = listaSegura(ADMKIT.lista);

  ver('btnEnviarTodosAdmKit', ADMKIT_SUBABA === 'pendentes');
  ver('btnVerificarTodosAdmKit', ADMKIT_SUBABA === 'enviados');
  ver('btnBaixarTodosAdmKit', ADMKIT_SUBABA === 'enviados');
  const qtdProntosEnviar = todos.filter(k => !k.enviado && k.protocolo && k.kitStatus === 'Kit pronto').length;
  const qtdProntosBaixar = todos.filter(k => k.enviado && !k.baixado && k.assinado).length;
  ver('badgeEnviarTodosAdmKit', qtdProntosEnviar > 0);
  ver('badgeBaixarTodosAdmKit', qtdProntosBaixar > 0);
  $('badgeEnviarTodosAdmKit').textContent = qtdProntosEnviar;
  $('badgeBaixarTodosAdmKit').textContent = qtdProntosBaixar;
  _admKitContagens_();

  let lista = todos.filter(k => {
    if(ADMKIT_SUBABA === 'assinados') return k.baixado;
    if(ADMKIT_SUBABA === 'enviados')  return k.enviado && !k.baixado;
    return !k.enviado; // pendentes
  });

  // Filtro de mês de admissão: as opções saem do cartão atual.
  const meses = _admMesesOpcoes_(lista);
  if(ADMKIT_FILTRO_MES && !meses.some(o => o.valor === ADMKIT_FILTRO_MES)) ADMKIT_FILTRO_MES = '';
  _homologOpcoes_('admKitFiltroMes', 'Mês', meses, ADMKIT_FILTRO_MES);
  if(ADMKIT_FILTRO_MES) lista = lista.filter(k => _admDataISO_(k.dataAdmissao).slice(0, 7) === ADMKIT_FILTRO_MES);

  const busca = _homologNorm_(ADMKIT_BUSCA);
  if(busca){
    lista = lista.filter(k => _homologNorm_(k.nome).indexOf(busca) > -1 || _homologNorm_(k.protocolo).indexOf(busca) > -1);
  }

  if(!lista.length){
    const vazioMsg = busca ? 'Ninguém encontrado para "' + esc(ADMKIT_BUSCA) + '".' :
      ADMKIT_FILTRO_MES ? 'Ninguém com esse filtro.' :
      (ADMKIT_SUBABA === 'assinados' ? 'Nenhum kit assinado e arquivado ainda.' :
       ADMKIT_SUBABA === 'enviados' ? 'Nenhum kit enviado ainda.' :
       'Nenhuma admissão pendente de envio do kit.');
    cont.innerHTML = '<div class="vazio">' + vazioMsg + '</div>';
    return;
  }

  // Admissão mais recente primeiro, com uma linha por mês de admissão.
  const linhas = _admOrdenar_(lista).map(k => ({ grupo: _admDataISO_(k.dataAdmissao).slice(0, 7), html: _admLinhaKit_(k) }));
  cont.innerHTML = _rescTabelaHtml_('Admissão', linhas,
    'admkit:' + ADMKIT_SUBABA + ':' + ADMKIT_FILTRO_MES + ':' + busca,
    { pag: ADM_PAG, todos: ADM_MOSTRAR_TODOS, pref: 'adm', rotuloGrupo: _admRotuloMes_ });
  agendarAtualizacaoAdmKit();
}

// Enquanto tiver alguém "Kit em preparação" (gerando em segundo plano), recarrega a lista
// sozinha de tempos em tempos — sem isso, o gestor só veria o status novo dando F5 na mão.
// Um único setTimeout por vez (nunca acumula timers rodando em paralelo).
let ADMKIT_TIMER_ATUALIZACAO = null;
function agendarAtualizacaoAdmKit(){
  if(ADMKIT_TIMER_ATUALIZACAO) { clearTimeout(ADMKIT_TIMER_ATUALIZACAO); ADMKIT_TIMER_ATUALIZACAO = null; }
  const temPendente = ADMKIT && ADMKIT.lista && ADMKIT.lista.some(k => k.kitStatus === 'Kit em preparação');
  if(!temPendente) return;
  ADMKIT_TIMER_ATUALIZACAO = setTimeout(_admKitRecarregarSemPiscar_, 8000);
}

/** Recarga automática (Kit em preparação): sem o "carregando" piscando na tabela e sem fechar um
 *  menu ⋮ aberto (com o menu aberto, espera a próxima rodada). Erro aqui não insiste, como antes. */
async function _admKitRecarregarSemPiscar_(){
  ADMKIT_TIMER_ATUALIZACAO = null;
  if(RESC_MENU_BTN){ agendarAtualizacaoAdmKit(); return; }
  try{ ADMKIT = await chamar('srvAdmKitLista', TOKEN); }
  catch(e){ return; }
  if(RESC_MENU_BTN){ _admKitContagens_(); agendarAtualizacaoAdmKit(); return; }
  renderAdmKitLista();
}

async function verAdmKit(protocolo){
  const item = ADMKIT && ADMKIT.lista ? ADMKIT.lista.find(x => x.protocolo === protocolo) : null;
  $('verAdmKitNome').textContent = item ? item.nome : '';
  $('verAdmKitCorpo').innerHTML = '<div class="esq"></div>';
  abrir('ovVerAdmKit');
  try{
    const r = await chamar('srvAdmKitVer', TOKEN, protocolo);
    $('verAdmKitCorpo').innerHTML = '<div class="campo"><a class="b ver" style="display:block;text-align:center" href="'+esc(r.kitUrl)+'" target="_blank">📄 '+esc(r.kitNome)+'</a></div>';
  }catch(e){
    $('verAdmKitCorpo').innerHTML = '<div class="msg err on">'+esc(e.message)+'</div>';
  }
}

async function admKitGerarUm(protocolo){
  try{
    let r = await chamar('srvAdmKitGerar', TOKEN, protocolo, false);
    // [FIX 2026-09-22] Antes checava r.ok===false — mas o _api_() ja lanca erro generico
    // quando ok e false, entao esse "if" nunca rodava de verdade (o catch la embaixo pegava
    // primeiro, sem mostrar as pendencias). Backend agora devolve ok:true com
    // precisaConfirmar:true nesse caso, exatamente pra passar por essa checagem.
    if(r && r.precisaConfirmar && r.pendencias){
      if(!confirm('Há pendências no cadastro:\n\n- ' + r.pendencias.join('\n- ') + '\n\nGerar o kit mesmo assim?')) return;
      r = await chamar('srvAdmKitGerar', TOKEN, protocolo, true);
    }
    // O kit não fica pronto na hora (junta Contrato + Ficha + dados pessoais + fixos, leva
    // 1-2 min) — fica rodando em segundo plano. A lista atualiza sozinha até aparecer pronto.
    toast(r.mensagem || 'Kit sendo gerado em segundo plano.', 'inf');
    renderAdmKit();
  }catch(e){ toast(e.message, 'err'); }
}

/* [2026-10-05] Envio em lote com barra de progresso. O portal manda os kits em grupos pequenos
 * (ADMKIT_LOTE_TAMANHO por chamada, cada uma bem abaixo dos ~60 s que o Portal espera pela API) e
 * atualiza a barra a cada grupo. Antes era uma chamada só, de até 4,5 min, sem retorno na tela.
 * - Pausa do Autentique (excesso de envios seguidos): espera ADMKIT_LOTE_PAUSA_S e continua sozinho.
 * - Chamada que falha: espera ADMKIT_LOTE_ESPERA_FALHA_S (o servidor pode ainda estar terminando o
 *   grupo), recarrega a lista e segue só com quem continua sem envio. Nunca reenvia às cegas.
 * - Fechar a janela não interrompe: o envio segue e o botão reabre a janela com o andamento.
 *   "Parar" interrompe depois do grupo atual. */
const ADMKIT_LOTE_TAMANHO = 3;
const ADMKIT_LOTE_PAUSA_S = 60;
const ADMKIT_LOTE_ESPERA_FALHA_S = 90;
const ADMKIT_LOTE_MAX_FALHAS = 3;
let ADMKIT_ENVIO = null;

function admKitProntosParaEnvio_(){
  const lista = (ADMKIT && ADMKIT.lista) ? ADMKIT.lista : [];
  // So entra quem esta com o kit realmente pronto — "Kit em preparação"/"Erro ao gerar
  // kit"/ainda sem geracao pedida nao pode subir pro Autentique.
  return lista.filter(k => !k.enviado && k.kitStatus === 'Kit pronto' && k.protocolo);
}

function abrirEnviarTodosAdmKit(){
  if(ADMKIT_ENVIO && ADMKIT_ENVIO.rodando){ abrir('ovEnviarTodosAdmKit'); return; } // envio em andamento: só mostra
  const prontos = admKitProntosParaEnvio_();
  if(!prontos.length){
    toast('Ninguém está com o kit pronto para enviar no momento.', 'inf');
    return;
  }
  ADMKIT_ENVIO = {
    fila: prontos.map(k => ({ protocolo: k.protocolo, nome: k.nome })),
    total: prontos.length, enviados: 0, pulados: 0, erros: [],
    rodando: false, parar: false, iniciado: false, falha: '', ultimaFalhaEm: 0
  };
  $('enviarTodosAdmKitTexto').textContent = 'Você está prestes a enviar ' + prontos.length + ' kit' + (prontos.length === 1 ? '' : 's') +
    (prontos.length === 1 ? ' admissional' : ' admissionais') + ' para assinatura no Autentique. Deseja continuar?';
  ver('enviarTodosAdmKitProg', false);
  $('enviarTodosAdmKitErros').innerHTML = '';
  admKitEnvioStatus_('');
  admKitEnvioBotoes_('confirmar');
  abrir('ovEnviarTodosAdmKit');
}

function admKitEnvioBotoes_(fase){
  const voltar = $('btnVoltarEnviarTodosAdmKit'), sim = $('btnConfirmarEnviarTodosAdmKit');
  if(!voltar || !sim) return;
  const cfg = {
    confirmar: ['Voltar', false, true, false, 'Sim, enviar todos'],
    enviando:  ['Parar', false, true, true, 'Enviando…'],
    parando:   ['Parando…', true, true, true, 'Enviando…'],
    fim:       ['Fechar', false, false, true, ''],
    retomar:   ['Fechar', false, true, false, 'Continuar envio']
  }[fase];
  voltar.textContent = cfg[0]; voltar.disabled = cfg[1];
  sim.style.display = cfg[2] ? '' : 'none'; sim.disabled = cfg[3]; if(cfg[4]) sim.textContent = cfg[4];
}

function fecharEnviarTodosAdmKit(){
  const st = ADMKIT_ENVIO;
  if(st && st.rodando){
    st.parar = true;
    admKitEnvioBotoes_('parando');
    admKitEnvioStatus_('Parando depois do grupo atual…', 'pausa');
    return;
  }
  fechar('ovEnviarTodosAdmKit');
}

function admKitEnvioStatus_(texto, tipo){
  const el = $('enviarTodosAdmKitStatus');
  if(el) el.textContent = texto || '';
  const barra = $('enviarTodosAdmKitBarra');
  if(barra){ barra.classList.toggle('pausa', tipo === 'pausa'); barra.classList.toggle('erro', tipo === 'erro'); }
}

function admKitEnvioProgresso_(){
  const st = ADMKIT_ENVIO;
  if(!st) return;
  const feitos = st.total - st.fila.length;
  const pct = st.total ? Math.round(feitos * 100 / st.total) : 100;
  $('enviarTodosAdmKitBarra').style.width = pct + '%';
  $('enviarTodosAdmKitPct').textContent = pct + '%';
  $('enviarTodosAdmKitContagem').textContent = feitos + ' de ' + st.total + ' processados · ' + st.enviados + ' enviado(s)' +
    (st.pulados ? ' · ' + st.pulados + ' já estavam enviados' : '') + (st.erros.length ? ' · ' + st.erros.length + ' com erro' : '');
  $('enviarTodosAdmKitErros').innerHTML = st.erros.map(e => '<div>• ' + esc(e) + '</div>').join('');
}

async function admKitEsperar_(segundos, texto){
  const st = ADMKIT_ENVIO;
  for(let s = segundos; s > 0; s--){
    if(st.parar) return false;
    admKitEnvioStatus_(texto + ' Continuando em ' + s + ' s…', 'pausa');
    await new Promise(r => setTimeout(r, 1000));
  }
  return !st.parar;
}

// Recarrega a lista do servidor e tira da fila só quem a lista CONFIRMA: já enviado (conta como
// enviado) ou com outro status (vira aviso). [FIX 2026-10-05] Quem não aparece na lista recarregada
// continua na fila — antes saía como "não encontrado" e 37 kits prontos ficaram sem envio. Lista que
// não veio inteira (sem o campo, vazia ou sem ninguém da fila) é ignorada. O servidor também pula
// quem já foi enviado, então manter alguém na fila nunca gera envio em dobro.
async function admKitRecarregarFila_(){
  const st = ADMKIT_ENVIO;
  let resp;
  try{ resp = await chamar('srvAdmKitLista', TOKEN); }
  catch(e){ return false; }
  const lista = resp && Array.isArray(resp.lista) ? resp.lista : null;
  if(!lista || !lista.length) return false;
  const porProto = {};
  lista.forEach(k => { if(k.protocolo) porProto[k.protocolo] = k; });
  if(st.fila.length && !st.fila.some(g => porProto[g.protocolo])) return false;
  ADMKIT = resp;
  st.fila = st.fila.filter(g => {
    const k = porProto[g.protocolo];
    if(!k) return true;
    if(k.enviado){ st.enviados++; return false; }
    if(k.kitStatus !== 'Kit pronto'){ st.erros.push(g.nome + ': saiu da fila (status atual: ' + (k.kitStatus || '?') + ').'); return false; }
    return true;
  });
  return true;
}

// [FIX 2026-10-05] Sessão vencida no meio do envio: o portal zera o TOKEN e manda para o login.
// Continuar só gerava falhas ("Token não informado"); agora o envio para e avisa.
function admKitSessaoAcabou_(erro){
  if(!TOKEN) return true;
  try{ return typeof _erroDeSessao_ === 'function' && _erroDeSessao_(erro); }catch(e){ return false; }
}

async function confirmarEnviarTodosAdmKit(){
  const st = ADMKIT_ENVIO;
  if(!st || st.rodando) return;
  st.rodando = true; st.parar = false;
  ver('enviarTodosAdmKitProg', true);
  $('enviarTodosAdmKitTexto').textContent = 'Enviando os kits para o Autentique, ' + ADMKIT_LOTE_TAMANHO +
    ' por vez. Se fechar esta janela, o envio continua: clique de novo no botão de enviar todos para acompanhar.';
  admKitEnvioBotoes_('enviando');
  admKitEnvioProgresso_();
  let falhasSeguidas = 0;
  try{
    if(st.iniciado){
      // Retomada: se a última chamada falhou há pouco, o servidor pode ainda estar terminando aquele grupo.
      const falta = Math.ceil((st.ultimaFalhaEm + ADMKIT_LOTE_ESPERA_FALHA_S * 1000 - Date.now()) / 1000);
      if(falta > 0) await admKitEsperar_(falta, 'Conferindo o que já foi enviado antes de continuar.'); // "Parar" durante a espera cai no resumo abaixo
      admKitEnvioStatus_('Conferindo o que já foi enviado…');
      await admKitRecarregarFila_();
      admKitEnvioProgresso_();
    }
    st.iniciado = true; st.falha = ''; st.sessaoAcabou = false;
    while(st.fila.length && !st.parar){
      if(admKitSessaoAcabou_('')){ st.sessaoAcabou = true; break; }
      const grupo = st.fila.slice(0, ADMKIT_LOTE_TAMANHO);
      admKitEnvioStatus_('Enviando: ' + grupo.map(g => g.nome).join(', ') + '…');
      let r = null, erro = '';
      try{ r = await chamar('srvAdmKitEnviarLote', TOKEN, grupo.map(g => g.protocolo)); }
      catch(e){ erro = e.message || String(e); }
      const processados = r ? Math.max(0, grupo.length - Number(r.naoProcessados || 0)) : 0;
      if(!r || (!processados && !r.bloqueadoAutentique)){
        falhasSeguidas++;
        st.ultimaFalhaEm = Date.now();
        st.falha = erro || 'o servidor não processou o grupo';
        if(admKitSessaoAcabou_(erro)){ st.sessaoAcabou = true; break; }
        if(falhasSeguidas >= ADMKIT_LOTE_MAX_FALHAS) break;
        if(!await admKitEsperar_(ADMKIT_LOTE_ESPERA_FALHA_S, 'Sem resposta do servidor (' + st.falha + ').')) break;
        admKitEnvioStatus_('Conferindo o que já foi enviado…');
        await admKitRecarregarFila_();
        admKitEnvioProgresso_();
        continue;
      }
      falhasSeguidas = 0; st.falha = '';
      st.enviados += Number(r.enviados || 0);
      st.pulados += Number(r.pulados || 0);
      (r.detalhes || []).filter(d => /^ERRO /.test(d)).forEach(d => st.erros.push(d.replace(/^ERRO /, '')));
      st.fila.splice(0, processados);
      admKitEnvioProgresso_();
      if(r.bloqueadoAutentique && st.fila.length){
        if(!await admKitEsperar_(ADMKIT_LOTE_PAUSA_S, 'O Autentique pediu uma pausa por excesso de envios seguidos.')) break;
      }
    }
  }finally{
    st.rodando = false;
  }

  let resumo;
  if(!st.fila.length){
    resumo = 'Concluído: ' + st.enviados + ' kit' + (st.enviados === 1 ? '' : 's') + ' enviado' + (st.enviados === 1 ? '' : 's') +
      ' para o Autentique' + (st.erros.length ? ', ' + st.erros.length + ' com erro (veja abaixo).' : '.');
    admKitEnvioStatus_(resumo, st.erros.length ? 'erro' : '');
    admKitEnvioBotoes_('fim');
  }else if(st.sessaoAcabou){
    resumo = 'Sua sessão no portal expirou no meio do envio. ' + st.enviados + ' enviado(s), faltam ' + st.fila.length +
      '. Entre de novo e clique em "Enviar todos" para continuar com os que faltam.';
    admKitEnvioStatus_(resumo, 'erro');
    admKitEnvioBotoes_('fim');
  }else if(st.parar){
    resumo = 'Envio interrompido: ' + st.enviados + ' enviado(s), faltam ' + st.fila.length + '. Clique em "Continuar envio" para seguir.';
    admKitEnvioStatus_(resumo, 'pausa');
    admKitEnvioBotoes_('retomar');
  }else{
    resumo = 'O envio parou porque o servidor não respondeu (' + st.falha + '). ' + st.enviados + ' enviado(s), faltam ' +
      st.fila.length + '. Clique em "Continuar envio" para seguir de onde parou.';
    admKitEnvioStatus_(resumo, 'erro');
    admKitEnvioBotoes_('retomar');
  }
  $('enviarTodosAdmKitTexto').textContent = 'Envio para o Autentique';
  admKitEnvioProgresso_();
  toast(resumo, st.erros.length || st.fila.length ? 'inf' : 'suc');
  renderAdmKit();
}

// Só consulta o Autentique e atualiza status — sem efeito destrutivo, por isso sem modal de
// confirmação (diferente de Enviar/Baixar todos, que geram/movem documento de verdade).
async function verificarTodosAdmKit(btn){
  if(btn){ btn.disabled = true; btn.classList.add('girando'); }
  try{
    const r = await chamar('srvAdmKitVerificarLote', TOKEN);
    toast(r.mensagem, r.erros ? 'inf' : 'suc');
    renderAdmKit();
  }catch(e){ toast(e.message, 'err'); }
  finally{ if(btn){ btn.disabled = false; btn.classList.remove('girando'); } }
}

}
