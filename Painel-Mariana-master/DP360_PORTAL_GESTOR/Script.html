function onTipoMovChange(){
  const cod = $('movTipo').value;
  ver('boxMovDepartamento', cod === 'TRANSFERENCIA_DEPARTAMENTO');
  ver('boxMovTurno', cod === 'ALTERACAO_TURNO');
  ver('boxMovCarga', cod === 'ALTERACAO_CARGA_HORARIA');
  ver('boxMovCargo', cod === 'ALTERACAO_CARGO');
  ver('boxMovSalario', cod === 'ALTERACAO_SALARIO');
  ver('boxMovAdicional', cod === 'ADICIONAL_PAGAMENTO' || cod === 'OUTRO');
  ver('boxMovDivergencia', false);
  $('movTipoDica').textContent = MOV_DICAS[cod] || '';
  movAtualizarResumo();
}

/** Resumo do pedido acima do botão de enviar, montado com o que já foi preenchido. */
function movAtualizarResumo(){
  const c = _movColabEscolhido_();
  const cod = $('movTipo').value;
  const tipo = (CTX_MOV && CTX_MOV.tipos.find(t => t.cod === cod)) || null;
  if(!c || !tipo){ ver('movResumo', false); return; }

  const val = id => String($(id).value || '').trim();
  const brl = v => v ? _movBrlG_(String(v).replace(',', '.')) : '';
  const para = {
    TRANSFERENCIA_DEPARTAMENTO: val('movDepartamentoNovo') && ('para ' + val('movDepartamentoNovo')),
    ALTERACAO_TURNO: 'para ' + ($('movTurnoNovo').value === 'NOTURNO' ? 'noturno' : 'diurno'),
    ALTERACAO_CARGA_HORARIA: val('movCargaHorariaNova') && ('para ' + val('movCargaHorariaNova')),
    ALTERACAO_CARGO: val('movCargoNovo') && ((c.cargo ? 'de ' + c.cargo + ' ' : '') + 'para ' + val('movCargoNovo')),
    ALTERACAO_SALARIO: val('movSalarioNovo') && ('para ' + brl(val('movSalarioNovo'))),
    ADICIONAL_PAGAMENTO: [val('movDescricaoAdicional'), brl(val('movValorAdicional'))].filter(Boolean).join(' · '),
    OUTRO: val('movDescricaoAdicional')
  }[cod] || '';
  const comp = String($('movCompetencia').value || '').split('-');
  const desde = comp.length === 2 ? comp[1] + '/' + comp[0] : '';

  $('movResumo').innerHTML = '<span class="mov-resumo-rot">Resumo do pedido</span>' +
    '<b>' + esc(c.nome) + '</b> · ' + esc(tipo.nome) + (para ? ' ' + esc(para) : '') +
    (desde ? ', a partir de <b>' + esc(desde) + '</b>' : '') + '.' +
    '<span class="mov-resumo-pass">Vai primeiro para o RH. Você acompanha tudo nesta tela.</span>';
  ver('movResumo', true);
}

async function enviarSolicitacaoMov(){
  limpaAviso('movAviso');

  const idColab = $('movColab').value;
  const tipo = $('movTipo').value;
  const competenciaMes = $('movCompetencia').value; // "YYYY-MM"
  const justificativa = $('movJustificativa').value.trim();

  if(!idColab) return aviso('movAviso', 'Escolha o colaborador.');
  if(!tipo) return aviso('movAviso', 'Escolha o tipo de movimentação.');
  if(!competenciaMes) return aviso('movAviso', 'Informe a competência de início.');
  if(!justificativa) return aviso('movAviso', 'Informe a justificativa.');

  const partes = competenciaMes.split('-'); // [YYYY, MM]
  const competenciaInicio = partes[1] + '/' + partes[0];

  const dados = {
    idColaborador: idColab,
    tipoCod: tipo,
    competenciaInicio: competenciaInicio,
    justificativa: justificativa
  };

  if(tipo === 'TRANSFERENCIA_DEPARTAMENTO'){
    dados.departamentoNovo = $('movDepartamentoNovo').value.trim();
    if(!dados.departamentoNovo) return aviso('movAviso', 'Informe o departamento novo.');
  } else if(tipo === 'ALTERACAO_TURNO'){
    dados.turnoNovo = $('movTurnoNovo').value;
  } else if(tipo === 'ALTERACAO_CARGA_HORARIA'){
    dados.cargaHorariaNova = $('movCargaHorariaNova').value.trim();
    if(!dados.cargaHorariaNova) return aviso('movAviso', 'Informe a nova carga horária.');
  } else if(tipo === 'ALTERACAO_CARGO'){
    dados.cargoNovo = $('movCargoNovo').value.trim();
    if(!dados.cargoNovo) return aviso('movAviso', 'Informe o cargo novo.');
  } else if(tipo === 'ALTERACAO_SALARIO'){
    const salario = $('movSalarioNovo').value;
    if(!salario) return aviso('movAviso', 'Informe o novo salário.');
    dados.salarioNovo = salario;
    if($('movConfirmarDivergencia').checked){
      dados.confirmarDivergenciaSalarial = true;
      dados.justificativaDivergencia = $('movJustificativaDivergencia').value.trim();
      if(!dados.justificativaDivergencia) return aviso('movAviso', 'Informe a justificativa da divergência.');
    }
  } else if(tipo === 'ADICIONAL_PAGAMENTO' || tipo === 'OUTRO'){
    dados.descricaoAdicional = $('movDescricaoAdicional').value.trim();
    if(!dados.descricaoAdicional) return aviso('movAviso', 'Descreva o que está sendo solicitado.');
    if($('movValorAdicional').value) dados.valorAdicional = $('movValorAdicional').value;
  }

  const b = $('movBtn');
  ocupado(b, 'Enviando…');
  try{
    const r = await chamar('srvMovSolicitar', TOKEN, dados);
    fechar('ovMov');
    toast(r.mensagem || 'Solicitação enviada.', 'bom');
    CTX_MOV = null;
    MOV_FILTRO_G = '';
    await irPara('movimentacao');
  }catch(e){
    if(String(e.message).indexOf('diverge do praticado') > -1){
      $('movDivergenciaTexto').textContent = e.message;
      ver('boxMovDivergencia', true);
      aviso('movAviso', 'Confira a divergência de salário abaixo antes de reenviar.');
    }else{
      aviso('movAviso', e.message);
    }
  }finally{ livre(b); }
}

async function cancelarMov(id){
  if(!confirm('Cancelar esta movimentação?')) return;
  try{
    const r = await chamar('srvMovCancelar', TOKEN, id);
    toast(r.mensagem || 'Movimentação cancelada.', 'bom');
    CTX_MOV = null;
    await irPara('movimentacao');
  }catch(e){
    toast(e.message, 'ruim');
  }
}
</script>
